<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Autologin - VEX</title>
<link rel="icon" href="/static/img/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/theme.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4fa553">
  <link rel="apple-touch-icon" href="/static/img/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#4caf50 0%,#45a049 100%);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.autologin-wrapper{
  background:#fff;
  border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  width:100%;
  max-width:420px;
  padding:40px;
  animation:slideIn .4s ease-out;
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:translateY(0)}
}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:28px;color:#1c1e21;font-weight:700;margin-bottom:8px}
.logo p{font-size:14px;color:#65676b;line-height:1.5}
.form-group{margin-bottom:20px}
.form-label{
  display:block;
  margin-bottom:8px;
  font-weight:600;
  font-size:14px;
  color:#1c1e21;
}
.form-input{
  width:100%;
  padding:12px 16px;
  border:1px solid #e4e6eb;
  border-radius:8px;
  font-size:15px;
  transition:all .3s;
  font-family:inherit;
}
.form-input:focus{
  outline:none;
  border-color:#4caf50;
  box-shadow:0 0 0 3px rgba(76,175,80,.1);
}
.btn-primary{
  width:100%;
  padding:12px 16px;
  background:linear-gradient(135deg,#4caf50 0%,#45a049 100%);
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:all .3s;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(76,175,80,.3)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.message{
  padding:12px 16px;
  border-radius:8px;
  margin-bottom:20px;
  font-size:14px;
  text-align:center;
}
.message.error{background:#ffebee;color:#c62828;border:1px solid #f44336}
.message.success{background:#e8f5e9;color:#2e7d32;border:1px solid #4caf50}
.helper{
  margin-top:16px;
  font-size:13px;
  color:#65676b;
  text-align:center;
  line-height:1.5;
}
.back-link{
  display:block;
  margin-top:24px;
  text-align:center;
  font-size:14px;
  color:#4caf50;
  text-decoration:none;
  font-weight:600;
}
.back-link:hover{text-decoration:underline}
/* FIX (demande utilisateur, plusieurs fois : "meme style d'erreur/info que
   fchier sur TOUT le serveur") -- encadre inline remplace par le toast
   bas-droite standard. */
#toast-area{position:fixed;bottom:24px;right:24px;z-index:5000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:#fff;border:1px solid #e4e6eb;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);padding:12px 18px;font-size:13px;font-weight:600;color:#1c1e21;display:flex;align-items:center;gap:10px;animation:toast-in .25s ease;pointer-events:all;max-width:340px}
@keyframes toast-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.ok{border-left:4px solid #4caf50}
.toast.error{border-left:4px solid #c62828}
.toast .ico{width:14px;height:14px;flex-shrink:0}
</style>
</head>
<body>
<div id="toast-area"></div>
<div class="autologin-wrapper">
  <div class="logo">
    <h1>VEX</h1>
    <p>Collez votre lien autologin pour vous connecter rapidement.</p>
  </div>

  <div id="msg-box"></div>

  <form id="autologin-form">
    <div class="form-group">
      <label class="form-label" for="autologin-link">Lien autologin</label>
      <input
        type="text"
        id="autologin-link"
        class="form-input"
        placeholder="https://.../autologin/connecter?uid=...&token=..."
        autocomplete="off"
        required
      >
    </div>

    <button type="submit" class="btn-primary" id="autologin-btn">Entrer</button>
  </form>

  <p class="helper">Vous pouvez coller un lien complet ou un chemin commençant par <code>/autologin/connecter</code>.</p>
  <a class="back-link" href="/login">Retour a la connexion</a>
</div>

<script>
// FIX (demande utilisateur, plusieurs fois : "meme style d'erreur/info que
// fchier sur TOUT le serveur") -- encadre inline remplace par un vrai
// toast bas-droite (signature conservee pour ne pas toucher tous les
// appels existants).
function escToast(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showMsg(msg, type) {
  if (!msg) return;
  toast(msg, type === 'error' ? 'error' : 'ok');
}
function toast(msg, type = 'ok', dur = 3500) {
  const area = document.getElementById('toast-area');
  const existant = [...area.children].find(c => c.dataset.msg === msg);
  if (existant) { existant.dispatchEvent(new Event('vex-relancer')); return; }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.dataset.msg = msg;
  const icone = type === 'error' ? 'circle-xmark' : 'circle-check';
  el.innerHTML = `<img class="ico" src="/static/img/solid/${icone}.svg" alt=""><span>${escToast(msg)}</span>`;
  area.appendChild(el);
  let minuteur = null;
  const armerDisparition = () => { minuteur = setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => area.removeChild(el), 300); }, dur); };
  el.addEventListener('mouseenter', () => clearTimeout(minuteur));
  el.addEventListener('mouseleave', armerDisparition);
  el.addEventListener('vex-relancer', () => { clearTimeout(minuteur); armerDisparition(); });
  armerDisparition();
}

document.getElementById('autologin-form').addEventListener('submit', function(e) {
  e.preventDefault();

  const btn = document.getElementById('autologin-btn');
  const raw = document.getElementById('autologin-link').value.trim();

  if (!raw) {
    showMsg('Veuillez saisir votre lien autologin.', 'error');
    return;
  }

  let target = raw;

  try {
    if (raw.startsWith('/')) {
      target = raw;
    } else {
      const url = new URL(raw);
      target = url.pathname + url.search;
    }
  } catch (_) {
    showMsg('Le lien autologin est invalide.', 'error');
    return;
  }

  if (!target.startsWith('/autologin/connecter')) {
    showMsg('Le lien doit pointer vers /autologin/connecter.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Connexion...';
  showMsg('Redirection en cours...', 'success');
  window.location.href = target;
});
</script>
  <script src="/static/pwa-register.js" defer></script>
</body>
</html>
