<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Connexion - VEX</title>
<link rel="icon" href="/static/img/favicon.ico" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#4caf50 0%,#45a049 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.login-wrapper{background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.3);width:100%;max-width:420px;padding:40px;animation:slideIn .4s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:28px;color:#1c1e21;font-weight:700;margin-bottom:8px}
.logo p{font-size:14px;color:#65676b}
.form-group{margin-bottom:20px}
.form-label{display:block;margin-bottom:8px;font-weight:600;font-size:14px;color:#1c1e21}
.form-input{width:100%;padding:12px 16px;border:1px solid #e4e6eb;border-radius:8px;font-size:15px;transition:all .3s;font-family:inherit}
.form-input:focus{outline:none;border-color:#4caf50;box-shadow:0 0 0 3px rgba(76,175,80,.1)}
.btn-primary{width:100%;padding:12px 16px;background:linear-gradient(135deg,#4caf50 0%,#45a049 100%);color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;margin-top:8px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(76,175,80,.3)}
.divider{text-align:center;margin:24px 0;position:relative}
.divider::before{content:'';position:absolute;left:0;top:50%;width:100%;height:1px;background:#e4e6eb}
.divider span{background:white;padding:0 16px;color:#65676b;font-size:14px;position:relative;z-index:1}
.btn-secondary{width:100%;padding:12px 16px;background:#e4e6eb;color:#1c1e21;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s}
.btn-secondary:hover{background:#d0d2d6}
.message{padding:12px 16px;border-radius:8px;margin-bottom:20px;font-size:14px;text-align:center}
.message.success{background:#e8f5e9;color:#2e7d32;border:1px solid #4caf50}
.message.error{background:#ffebee;color:#c62828;border:1px solid #f44336}
.checkbox-wrapper{display:flex;align-items:center;gap:8px;margin-top:16px}
.checkbox-wrapper input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#4caf50}
.checkbox-wrapper label{font-size:13px;color:#65676b;cursor:pointer}
.checkbox-wrapper a{color:#4caf50;text-decoration:none;font-weight:500}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:1000}
.modal.active{display:flex}
.modal-content{background:white;border-radius:12px;padding:0;width:90%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:slideUp .3s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:24px;border-bottom:1px solid #e4e6eb}
.modal-header h2{font-size:24px;color:#1c1e21;font-weight:700}
.modal-body{padding:24px}
.modal-footer{padding:24px;border-top:1px solid #e4e6eb;display:flex;gap:12px;justify-content:flex-end}
.btn-cancel{padding:10px 20px;background:#e4e6eb;color:#1c1e21;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="login-wrapper">
    <div class="logo">
        <h1>VEX</h1>
        <p>Connectez-vous à votre compte</p>
    </div>
    <div id="msg-login"></div>
    <form id="login-form">
        <div class="form-group">
            <label class="form-label" for="email">Adresse email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="exemple@email.com" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="motdepass">Mot de passe</label>
            <input type="password" id="motdepass" name="motdepass" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="login-btn">Se connecter</button>
    </form>
    <div id="signup-toggle"></div>
</div>

<div class="modal" id="signupModal">
    <div class="modal-content">
        <div class="modal-header"><h2>Créer un compte</h2></div>
        <div class="modal-body">
            <div id="msg-signup"></div>
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label" for="s-nom">Nom d'utilisateur</label>
                    <input type="text" id="s-nom" name="nom" class="form-input" placeholder="Votre nom" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="s-email">Adresse email</label>
                    <input type="email" id="s-email" name="email" class="form-input" placeholder="exemple@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="s-mdp">
                        Mot de passe
                        <span id="pass-hint" style="font-weight:400;color:#9e9e9e;font-size:12px;"></span>
                    </label>
                    <input type="password" id="s-mdp" name="motdepass" class="form-input" placeholder="••••••••" required>
                </div>
                <div id="activation-field"></div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="scales" name="scales">
                    <label for="scales">J'accepte la <a href="/constiontu.html" target="_blank">Politique de Confidentialité</a></label>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" onclick="hideSignupModal()">Annuler</button>
            <button type="button" class="btn-primary" style="width:auto;margin:0;" onclick="submitSignup()">Créer le compte</button>
        </div>
    </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// VEX Crypto — côté client uniquement
//
// PRINCIPE :
//   1. Le mot de passe en clair NE QUITTE JAMAIS le navigateur.
//   2. Avant envoi au serveur : PBKDF2-SHA256(mdp, salt_minute) → hash hex 64 car.
//   3. Le serveur reçoit et stocke/compare uniquement ce hash.
//   4. Le mdp en clair est gardé en mémoire JS (variable _VEX_MDP_CLAIR)
//      pour chiffrer/déchiffrer les fichiers ExoDrive avec ChaCha20-Poly1305.
//
// SALT : timestamp Unix tronqué à la minute (Math.floor(Date.now()/1000/60))
//   → identique côté client lors du login ET lors de la vérification DB
//     à condition que l'inscription ET le login soient dans la même minute,
//     OU que le serveur stocke le salt avec le hash (voir note ci-dessous).
//
// NOTE IMPORTANTE SUR LE SALT :
//   Le salt minute change toutes les 60 secondes. Pour que le login fonctionne
//   après l'inscription (qui peut être le lendemain), le salt doit être
//   reproductible à partir de données connues des deux côtés.
//   → Stratégie retenue : salt = PBKDF2 ne sert PAS à l'anti-bruteforce
//     (le mdp en clair n'est jamais envoyé, donc brute-force réseau = impossible).
//     Le salt protège contre les rainbow tables sur la DB.
//     On utilise donc : salt = email.toLowerCase() — stable, connu des deux
//     côtés, unique par utilisateur, pas besoin de stocker.
//
// CHIFFREMENT FICHIERS :
//   VEX.chiffrer(plaintext: Uint8Array) → { iv: Uint8Array, data: Uint8Array }
//   VEX.dechiffrer(iv: Uint8Array, data: Uint8Array) → Uint8Array
//   La clé dérivée (AES-256-GCM, meilleur support WebCrypto que ChaCha20)
//   est dérivée du mdp en clair via HKDF-SHA256.
//   → ChaCha20 n'est pas disponible nativement dans WebCrypto API du navigateur.
//     On utilise AES-256-GCM qui est équivalent en solidité et disponible partout.
//     Pour le Raspberry Pi (serveur), le module Rust utilisera ChaCha20 si besoin.
// ══════════════════════════════════════════════════════════════════

const VEX = (() => {
    // Mdp en clair gardé en mémoire — jamais dans le DOM, jamais dans localStorage
    let _mdp = null;

    // ── Utilitaires bas niveau ────────────────────────────────────

    function strToBytes(str) {
        return new TextEncoder().encode(str);
    }

    function bytesToHex(buf) {
        return Array.from(new Uint8Array(buf))
            .map(b => b.toString(16).padStart(2, '0'))
            .join('');
    }

    function hexToBytes(hex) {
        const arr = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2)
            arr[i / 2] = parseInt(hex.slice(i, i + 2), 16);
        return arr;
    }

    // ── PBKDF2-SHA256 ─────────────────────────────────────────────
    // Produit un hash hex 64 caractères à envoyer au serveur.
    // salt = email en minuscules (stable, unique par user, connu des deux côtés)
    // iterations = 100 000 (OWASP 2023 recommandation)
    async function pbkdf2Hex(password, salt) {
        const keyMaterial = await crypto.subtle.importKey(
            'raw', strToBytes(password), 'PBKDF2', false, ['deriveBits']
        );
        const bits = await crypto.subtle.deriveBits(
            {
                name:       'PBKDF2',
                hash:       'SHA-256',
                salt:       strToBytes(salt.toLowerCase()),
                iterations: 100000,
            },
            keyMaterial,
            256 // 32 octets = 64 hex
        );
        return bytesToHex(bits);
    }

    // ── Dérivation clé de chiffrement fichiers ────────────────────
    // Utilise HKDF-SHA256 sur le mdp en clair pour produire une clé AES-256-GCM.
    // Cette clé est stable tant que le mdp ne change pas.
    async function deriverCleChiffrement() {
        if (!_mdp) throw new Error('Non connecté');
        const keyMaterial = await crypto.subtle.importKey(
            'raw', strToBytes(_mdp), 'HKDF', false, ['deriveKey']
        );
        return crypto.subtle.deriveKey(
            {
                name: 'HKDF',
                hash: 'SHA-256',
                salt: strToBytes('VEX-ExoDrive-v1'),
                info: strToBytes('file-encryption'),
            },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
        );
    }

    // ── API publique ──────────────────────────────────────────────

    return {
        // Appelé après connexion réussie pour mémoriser le mdp en clair
        setMdp(mdpClair) {
            _mdp = mdpClair;
        },

        // Efface le mdp de la mémoire (logout)
        clearMdp() {
            _mdp = null;
        },

        // Hash PBKDF2 à envoyer au serveur
        // usage : const hash = await VEX.hashPourServeur(mdp, email)
        hashPourServeur: pbkdf2Hex,

        // Chiffre un Uint8Array avec AES-256-GCM (clé dérivée du mdp en clair)
        // Retourne { iv: Uint8Array(12), data: Uint8Array }
        async chiffrer(plaintext) {
            const cle = await deriverCleChiffrement();
            const iv  = crypto.getRandomValues(new Uint8Array(12));
            const data = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv },
                cle,
                plaintext
            );
            return { iv, data: new Uint8Array(data) };
        },

        // Déchiffre { iv, data } → Uint8Array
        async dechiffrer(iv, data) {
            const cle = await deriverCleChiffrement();
            const plain = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv },
                cle,
                data
            );
            return new Uint8Array(plain);
        },

        // Chiffre un File avant upload → { iv: hex, blob: Blob }
        // usage dans ExoDrive : const { iv, blob } = await VEX.chiffrerFichier(file)
        async chiffrerFichier(file) {
            const bytes = new Uint8Array(await file.arrayBuffer());
            const { iv, data } = await this.chiffrer(bytes);
            return {
                iv:   bytesToHex(iv),
                blob: new Blob([data], { type: 'application/octet-stream' }),
            };
        },

        // Déchiffre un blob reçu du serveur → Blob du fichier original
        // iv doit être le hex retourné par chiffrerFichier
        async dechiffrerFichier(blob, ivHex, mimeType) {
            const data  = new Uint8Array(await blob.arrayBuffer());
            const iv    = hexToBytes(ivHex);
            const plain = await this.dechiffrer(iv, data);
            return new Blob([plain], { type: mimeType || 'application/octet-stream' });
        },
    };
})();

// ══════════════════════════════════════════════════════════════════
// UI
// ══════════════════════════════════════════════════════════════════

async function loadConfig() {
    try {
        const r = await fetch('/api/login/config', { credentials: 'include' });
        if (!r.ok) return {};
        return await r.json();
    } catch { return {}; }
}

function showMsg(id, msg, type) {
    const el = document.getElementById(id);
    if (!msg) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="message ${type}">${esc(msg)}</div>`;
}

function esc(s) {
    return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showSignupModal() { document.getElementById('signupModal').classList.add('active'); }
function hideSignupModal() { document.getElementById('signupModal').classList.remove('active'); }
document.getElementById('signupModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) hideSignupModal();
});

// ── Connexion ────────────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = '…';

    const mdpClair = document.getElementById('motdepass').value;
    const email    = document.getElementById('email').value;
    sessionStorage.removeItem('vex_mdp');
    sessionStorage.removeItem('vex_hash');
    sessionStorage.removeItem('vex_email');

    try {
        // Hash PBKDF2 côté client — le mdp en clair ne quitte jamais le navigateur
        const hashMdp = await VEX.hashPourServeur(mdpClair, email);

        const body = new URLSearchParams({
            action:    'login',
            email,
            motdepass: hashMdp, // hash hex 64 car., jamais le mdp en clair
        });

        const r = await fetch('/login/login', { method: 'POST', body, credentials: 'include' });
        const d = await r.json();

        if (d.success) {
            // Mémoriser le mdp en clair pour le chiffrement fichiers
            VEX.setMdp(mdpClair);
            sessionStorage.setItem('vex_mdp', mdpClair);
            sessionStorage.setItem('vex_hash', hashMdp);
            sessionStorage.setItem('vex_email', email);
            window.location.href = d.redirect || '/login/dashboard';
        } else {
            showMsg('msg-login', d.error, 'error');
        }
    } catch (err) {
        showMsg('msg-login', 'Erreur réseau ou crypto.', 'error');
        console.error(err);
    }

    btn.disabled = false;
    btn.textContent = 'Se connecter';
});

// ── Inscription ──────────────────────────────────────────────────
async function submitSignup() {
    const scales = document.getElementById('scales').checked;
    if (!scales) {
        showMsg('msg-signup', 'Veuillez accepter la politique de confidentialité.', 'error');
        return;
    }

    const mdpClair = document.getElementById('s-mdp').value;
    const email    = document.getElementById('s-email').value;
    const nom      = document.getElementById('s-nom').value;

    // Vérification longueur côté client (le serveur ne peut pas vérifier sur le hash)
    if (mdpClair.length < window._VEX_PASS_MIN) {
        showMsg('msg-signup', `Mot de passe trop court (min. ${window._VEX_PASS_MIN} car.).`, 'error');
        return;
    }

    try {
        const hashMdp = await VEX.hashPourServeur(mdpClair, email);

        const body = new URLSearchParams({
            action:    'signup',
            nom,
            email,
            motdepass: hashMdp,
            scales:    '1',
        });

        const activation = document.getElementById('activation-input');
        if (activation) body.append('activation_key', activation.value);

        const r = await fetch('/login/login', { method: 'POST', body, credentials: 'include' });
        const d = await r.json();

        if (d.success) {
            hideSignupModal();
            showMsg('msg-login', d.message || 'Inscription réussie. Connectez-vous.', 'success');
        } else {
            showMsg('msg-signup', d.error, 'error');
        }
    } catch (err) {
        showMsg('msg-signup', 'Erreur réseau ou crypto.', 'error');
        console.error(err);
    }
}

// ── Init ─────────────────────────────────────────────────────────
(async function init() {
    const cfg = await loadConfig();

    const regMode = cfg.registration_mode  || 'open';
    const passMin = cfg.password_min_length || 8;
    const actReq  = cfg.activation_key_required || false;

    // Stocké sur window pour y accéder dans submitSignup
    window._VEX_PASS_MIN = passMin;

    document.getElementById('pass-hint').textContent = `(min. ${passMin} car.)`;

    if (regMode === 'closed') {
        document.getElementById('signup-toggle').innerHTML =
            '<p style="text-align:center;margin-top:20px;font-size:13px;color:#999;">Les inscriptions sont fermées.</p>';
    } else {
        document.getElementById('signup-toggle').innerHTML =
            '<div class="divider"><span>ou</span></div>' +
            '<button class="btn-secondary" onclick="showSignupModal()">Créer un nouveau compte</button>';
    }

    if (actReq) {
        document.getElementById('activation-field').innerHTML = `
            <div class="form-group">
                <label class="form-label">Clé d'activation</label>
                <input type="text" id="activation-input" class="form-input" placeholder="Votre clé d'invitation" required>
            </div>`;
    }
})();
</script>
</body>
</html>
