<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{T_TITRE_ONGLET}}</title>
<link rel="icon" href="/static/img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/static/css/theme.css">
<script src="/static/fa-local.js" defer></script>
<style>
.ico    { display:inline-block; width:16px; height:16px; vertical-align:middle; flex-shrink:0; }
.ico-sm { width:14px; height:14px; }
.ico-md { width:20px; height:20px; }
.ico-lg { width:44px; height:44px; }
.ico-white { filter: brightness(0) invert(1); }
.ico-muted { filter: invert(44%) sepia(9%) saturate(322%) hue-rotate(182deg) brightness(92%) contrast(89%); }
.ico-red   { filter: invert(27%) sepia(88%) saturate(1200%) hue-rotate(335deg) brightness(92%) contrast(95%); }
.ico-primary { filter: invert(48%) sepia(79%) saturate(476%) hue-rotate(86deg) brightness(95%) contrast(89%); }
[data-theme="dark"] .ico-muted { filter: invert(72%) sepia(5%) saturate(400%) hue-rotate(180deg) brightness(85%); }
@keyframes ico-spin { to { transform:rotate(360deg); } }
.ico-spin { animation: ico-spin .8s linear infinite; }

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  overflow:hidden; padding-top:56px; -webkit-font-smoothing:antialiased;
}

.app { display:flex; height:calc(100vh - 56px); overflow:hidden; }

.sidebar {
  width:280px; background:var(--sidebar-bg); border-right:1px solid var(--border);
  display:flex; flex-direction:column; flex-shrink:0; overflow-y:auto; padding:16px 10px;
}
.btn-nouveau {
  width:100%; padding:10px 16px; background:var(--accent); color:var(--surface);
  border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:16px;
  transition:background .2s; font-family:inherit;
}
.btn-nouveau:hover { background:var(--vex-green-2); }

.page-item {
  padding:12px 14px; border-radius:8px; cursor:pointer; margin-bottom:4px;
  border:1px solid transparent; transition:background .15s;
}
.page-item:hover  { background:var(--sidebar-hover); }
.page-item.active { background:var(--alt); border-color:var(--accent); }
.page-item-title { font-size:14px; font-weight:600; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.page-item-meta  { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-dim); }
.badge {
  display:inline-flex; align-items:center; gap:3px; padding:1px 6px; border-radius:8px;
  font-size:10px; font-weight:700;
}
.badge-public  { background:var(--alt); color:var(--accent); }
.badge-partage { background:rgba(59,130,246,.15); color:var(--blue); }
.empty-list { padding:30px 14px; text-align:center; color:var(--text-dim); font-size:13px; }

.main { flex:1; overflow-y:auto; padding:28px 36px; }
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; color:var(--text-dim); text-align:center;
}
.empty-state p { margin-top:14px; font-size:15px; }

.editor-card { max-width:760px; margin:0 auto; }
.editor-hdr { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
.editor-hdr input.titre-input {
  font-size:22px; font-weight:700; border:none; background:none; color:var(--text);
  outline:none; width:100%; padding:4px 0; border-bottom:2px solid transparent; transition:border-color .2s;
}
.editor-hdr input.titre-input:focus { border-bottom-color:var(--accent); }
.editor-actions { display:flex; gap:8px; flex-shrink:0; }

.btn {
  padding:9px 15px; border:none; border-radius:6px; cursor:pointer; font-size:13px;
  font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:7px; font-family:inherit;
}
.btn-primary   { background:var(--accent); color:var(--surface); }
.btn-primary:hover { background:var(--vex-green-2); }
.btn-secondary { background:transparent; color:var(--text-dim); border:1px solid var(--border); }
.btn-secondary:hover { background:var(--sidebar-hover); }
.btn-danger    { background:var(--danger); color:var(--surface); }
.btn-danger:hover { background:var(--danger); filter:brightness(.88); }
.btn:disabled  { opacity:.55; cursor:not-allowed; }

.mode-tabs { display:flex; gap:6px; background:var(--sidebar-hover); border-radius:8px; padding:4px; margin-bottom:18px; width:fit-content; }
.mode-tab {
  padding:7px 16px; border-radius:6px; border:none; background:none; cursor:pointer;
  font-size:13px; font-weight:600; color:var(--text-dim); font-family:inherit; transition:.15s;
}
.mode-tab.active { background:var(--surface); color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.1); }

.field-group { margin-bottom:16px; }
.field-group label { display:block; margin-bottom:6px; font-weight:600; font-size:13px; }
.field-group input[type=text], .field-group textarea {
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px;
  font-size:14px; outline:none; background:var(--input); color:var(--text);
  font-family:inherit; transition:border-color .2s;
}
.field-group input[type=text]:focus, .field-group textarea:focus { border-color:var(--accent); }
.field-group textarea { min-height:120px; resize:vertical; line-height:1.6; }
.field-group textarea.code { font-family:'SF Mono',Consolas,monospace; font-size:13px; min-height:320px; }
.hint { font-size:12px; color:var(--text-dim); margin-top:5px; }

.pub-row {
  display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--sidebar-hover);
  border-radius:8px; margin-bottom:18px;
}
.switch { position:relative; width:40px; height:22px; flex-shrink:0; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; inset:0; background:var(--border); border-radius:22px; cursor:pointer; transition:.2s; }
.slider::before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:var(--surface); border-radius:50%; transition:.2s; }
.switch input:checked + .slider { background:var(--accent); }
.switch input:checked + .slider::before { transform:translateX(18px); }
.pub-label { font-size:13px; font-weight:600; }
.pub-sub { font-size:12px; color:var(--text-dim); }

.share-block { border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:18px; }
.share-block h3 { font-size:13px; margin-bottom:12px; display:flex; align-items:center; gap:7px; }
.share-add { display:flex; gap:8px; margin-bottom:10px; }
.share-add input { flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--input); color:var(--text); font-size:13px; outline:none; }
.share-add input:focus { border-color:var(--accent); }
.share-list { display:flex; flex-direction:column; gap:6px; }
.share-item { display:flex; align-items:center; justify-content:space-between; padding:7px 10px; background:var(--sidebar-hover); border-radius:6px; font-size:13px; }
.share-item-rm { background:none; border:none; cursor:pointer; color:var(--text-dim); font-size:16px; line-height:1; }
.share-item-rm:hover { color:var(--danger); }
.share-empty { font-size:12px; color:var(--text-dim); padding:6px 2px; }

.link-row { display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--sidebar-hover); border-radius:8px; font-size:13px; margin-bottom:18px; }
.link-row code { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-dim); }
.link-row a { color:var(--accent); font-weight:600; text-decoration:none; display:flex; align-items:center; gap:5px; flex-shrink:0; }

.blocs-hint { font-size:12px; color:var(--text-dim); margin-bottom:14px; }
.editor-card.wide { max-width:none; width:100%; }

/* ── Écran blocs : palette | canevas | réglages, + barre d'actions verticale ── */
.blocs-editor-layout { display:flex; gap:0; align-items:stretch; height:calc(100vh - 150px); min-height:420px; }
.blocs-palette {
  width:210px; flex-shrink:0; border:1px solid var(--border); border-radius:0 8px 8px 0; background:var(--sidebar-hover);
  overflow-y:auto; padding:10px; position:relative; transition:background .15s,border-color .15s;
}
.blocs-palette.trash-armed { background:color-mix(in srgb, var(--danger) 12%, var(--sidebar-hover)); border-color:var(--danger); }
.blocs-palette-trash-overlay {
  display:none; position:absolute; inset:10px; z-index:1; border-radius:6px; border:2px dashed var(--danger);
  align-items:center; justify-content:center; font-size:34px; color:var(--danger); opacity:.7; pointer-events:none;
  background:var(--sidebar-hover);
}
.blocs-palette.trash-armed .blocs-palette-trash-overlay { display:flex; }
.blocs-palette-cat { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); margin:12px 4px 6px; }
.blocs-palette-cat:first-child { margin-top:2px; }
.blocs-palette-item {
  display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:6px; cursor:grab; font-size:12.5px;
  border:1px solid transparent; user-select:none;
}
.blocs-palette-item:hover { background:var(--surface); border-color:var(--border); }
.blocs-palette-item.dragging { opacity:.4; }
.blocs-palette-item i { width:16px; text-align:center; color:var(--accent); flex-shrink:0; }

.blocs-toolbar-v {
  width:44px; flex-shrink:0; background:var(--surface); border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0;
}
.blocs-toolbar-v .vbtn {
  width:34px; height:34px; border-radius:7px; border:1px solid transparent; background:none; color:var(--text-dim);
  cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; transition:.15s;
}
.blocs-toolbar-v .vbtn:hover { background:var(--sidebar-hover); color:var(--text); }
.blocs-toolbar-v .vbtn.active { background:var(--accent); color:var(--surface); }
.blocs-toolbar-v .vsep { width:22px; height:1px; background:var(--border); margin:4px 0; }

.blocs-center { flex:1; min-width:0; display:flex; flex-direction:column; border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--surface); }
.blocs-viewtabs { display:flex; gap:4px; padding:8px 10px; border-bottom:1px solid var(--border); flex-shrink:0; }
.blocs-viewtab {
  padding:6px 13px; border-radius:6px; border:none; background:none; cursor:pointer; font-size:12.5px; font-weight:600;
  color:var(--text-dim); display:inline-flex; align-items:center; gap:6px;
}
.blocs-viewtab.active { background:var(--alt); color:var(--accent); }
.blocs-canvas-wrap { flex:1; overflow-y:auto; padding:16px; }
.blocs-canvas.drop-over { background:var(--alt); border-radius:8px; }
.blocs-drop-indicator { height:3px; background:var(--accent); border-radius:2px; margin:4px 0; }
.blocs-drop-side { position:relative; }
.blocs-drop-side::before { content:''; position:absolute; top:4px; bottom:4px; width:3px; background:var(--accent); border-radius:2px; }
.blocs-drop-side.side-left::before { left:-6px; }
.blocs-drop-side.side-right::before { right:-6px; }
.blocs-code-view { width:100%; height:100%; min-height:300px; font-family:'SF Mono',Consolas,monospace; font-size:12.5px;
  border:1px solid var(--border); border-radius:6px; padding:12px; background:var(--input); color:var(--text); resize:none; }

.blocs-list { display:flex; flex-direction:column; gap:10px; min-height:60px; }
.blocs-row { display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; }
.blocs-row .bloc-item { min-width:0; }
.bloc-item { position:relative; border:1px solid var(--border); border-radius:8px; background:var(--sidebar-hover); flex:1; }
.bloc-resize-handle {
  position:absolute; top:0; right:-11px; bottom:0; width:22px; z-index:5; cursor:col-resize;
  display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s;
}
.bloc-item:hover .bloc-resize-handle, .bloc-item.selected .bloc-resize-handle { opacity:1; }
.bloc-resize-handle i {
  width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:10px; box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.bloc-height-handle {
  position:absolute; left:0; right:0; bottom:-11px; height:22px; z-index:5; cursor:row-resize;
  display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s;
}
.bloc-item:hover .bloc-height-handle, .bloc-item.selected .bloc-height-handle { opacity:1; }
.bloc-height-handle i {
  width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:10px; box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.bloc-item.dragging { opacity:.4; }
.bloc-item.selected { border-color:var(--accent); box-shadow:0 0 0 2px var(--alt); }
.bloc-item-hdr { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; cursor:pointer; gap:8px; }
.bloc-item-type { font-size:12.5px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:8px; overflow:hidden; }
.bloc-item-type .bloc-drag-handle { cursor:grab; color:var(--text-dim); flex-shrink:0; }
.bloc-item-type i.bloc-type-ico { color:var(--accent); flex-shrink:0; }
.bloc-item-summary { font-weight:400; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bloc-item-actions { display:flex; gap:4px; flex-shrink:0; }
.bloc-act {
  width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--surface);
  color:var(--text-dim); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:11px;
  transition:all .15s;
}
.bloc-act:hover { background:var(--accent); color:var(--surface); border-color:var(--accent); }
.bloc-move-handle { cursor:grab; }
.bloc-move-handle:active { cursor:grabbing; }
.bloc-act-danger:hover { background:var(--danger); border-color:var(--danger); }
.bloc-item-body { display:none; flex-direction:column; gap:10px; padding:0 12px 14px; }
.bloc-item.open .bloc-item-body { display:flex; }
.bloc-item.open .bloc-item-hdr { border-bottom:1px solid var(--border); }
.bloc-item-body input[type=text], .bloc-item-body input[type=number], .bloc-item-body input[type=datetime-local],
.bloc-item-body textarea, .bloc-item-body select {
  width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px;
  font-size:13px; outline:none; background:var(--input); color:var(--text); font-family:inherit;
}
.bloc-item-body textarea { min-height:70px; resize:vertical; line-height:1.5; }
.bloc-item-body input:focus, .bloc-item-body textarea:focus, .bloc-item-body select:focus { border-color:var(--accent); }
.champ-label { font-size:11px; font-weight:600; color:var(--text-dim); margin-bottom:3px; display:block; }
.bloc-anim-row {
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); margin-top:2px;
}
.bloc-anim-select {
  padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:var(--input);
  color:var(--text); font-size:12px; font-family:inherit; outline:none; max-width:220px;
}
.bloc-anim-select:focus { border-color:var(--accent); }
.blocs-empty { text-align:center; padding:24px 14px; color:var(--text-dim); font-size:13px; border:1px dashed var(--border); border-radius:8px; margin-bottom:16px; }
.blocs-add-row { display:flex; gap:8px; flex-wrap:wrap; }

/* ── Panneau de réglages (droite) ── */
.blocs-settings {
  width:290px; flex-shrink:0; border:1px solid var(--border); background:var(--sidebar-hover);
  overflow-y:auto; padding:14px;
}
.blocs-settings-empty { color:var(--text-dim); font-size:12.5px; text-align:center; padding:30px 10px; }
.blocs-settings-hdr { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.blocs-settings-hdr i { color:var(--accent); }
.blocs-settings-section-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); margin:14px 0 8px; }
.blocs-settings-section-title:first-child { margin-top:0; }
.layout-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* ── Icônes (remplace le champ émoji libre) ── */
.champ-icon-preview {
  width:44px; height:44px; border-radius:8px; background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--accent); margin-bottom:8px;
}
.icon-picker-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:6000; align-items:center; justify-content:center; }
.icon-picker-modal { background:var(--surface); border-radius:10px; width:460px; max-width:92vw; max-height:78vh; display:flex; flex-direction:column; overflow:hidden; }
.icon-picker-hdr { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); }
.icon-picker-close { background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-dim); }
.icon-picker-search { padding:10px 16px; border-bottom:1px solid var(--border); }
.icon-picker-search input { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; background:var(--input); color:var(--text); font-size:13px; outline:none; }
.icon-picker-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; padding:14px; overflow-y:auto; }
.icon-picker-item {
  aspect-ratio:1; border-radius:7px; border:1px solid var(--border); background:var(--sidebar-hover); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--text);
}
.icon-picker-item:hover { border-color:var(--accent); color:var(--accent); }

/* ── Mode Actions : timeline façon Blender ── */
.blocs-timeline-wrap { border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; display:none; }
.blocs-timeline-wrap.active { display:block; }
.blocs-timeline-hdr { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border); }
.blocs-timeline-hdr .vbtn {
  width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--sidebar-hover); color:var(--text);
  cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px;
}
.blocs-timeline-hdr .vbtn:hover { background:var(--accent); color:var(--surface); }
.blocs-timeline-hdr .vbtn.active { background:var(--accent); color:var(--surface); }
.timeline-time { font-family:'SF Mono',Consolas,monospace; font-size:12px; color:var(--text-dim); min-width:64px; }
.tl-zoom { display:flex; gap:4px; }
.tl-frame-input {
  width:64px; padding:5px 6px; border:1px solid var(--border); border-radius:6px; background:var(--input);
  color:var(--text); font-size:12px; font-family:'SF Mono',Consolas,monospace; outline:none; text-align:center;
}
.tl-frame-input:focus { border-color:var(--accent); }
.tl-range { display:flex; align-items:center; gap:5px; }
.tl-range .champ-label { margin:0; }
.tl-range-input {
  width:66px; padding:5px 6px; border:1px solid var(--border); border-radius:6px; background:var(--input);
  color:var(--text); font-size:12px; font-family:'SF Mono',Consolas,monospace; outline:none;
}
.tl-range-input:focus { border-color:var(--accent); }
.timeline-ruler-outer { overflow-x:auto; }
.timeline-ruler-numbers { position:relative; margin-left:160px; height:16px; font-size:10px; color:var(--text-dim); font-family:'SF Mono',Consolas,monospace; }
.timeline-ruler-numbers span { position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; }
.blocs-timeline-tracks { position:relative; max-height:180px; overflow-y:auto; padding:8px 12px; }
.tl-links { position:absolute; left:0; top:0; pointer-events:none; }
.timeline-track { display:flex; align-items:center; gap:10px; height:30px; margin-bottom:4px; }
.timeline-track-label { width:150px; flex-shrink:0; font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.timeline-track-add {
  margin-left:auto; width:18px; height:18px; border-radius:4px; border:1px solid var(--border); background:var(--surface);
  color:var(--text-dim); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:9px; flex-shrink:0;
}
.timeline-track-add:hover { background:var(--accent); color:var(--surface); border-color:var(--accent); }
.timeline-track-ruler { flex:0 0 auto; width:600px; position:relative; height:20px; background:var(--sidebar-hover); border-radius:4px; cursor:text; }
.timeline-clip {
  position:absolute; top:2px; height:16px; width:16px; border-radius:3px; background:var(--accent); cursor:grab;
  box-shadow:0 1px 3px rgba(0,0,0,.3); transform:rotate(45deg);
}
.timeline-clip.pos { background:#3b82f6; }
.timeline-clip:active { cursor:grabbing; }
.timeline-clip.selected { outline:2px solid var(--text); }
.timeline-playhead { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--danger); pointer-events:none; z-index:2; }
.timeline-ruler-wrap { position:relative; margin-left:160px; width:600px; height:16px; cursor:text; }

.img-picker-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:6000;
  align-items:center; justify-content:center;
}
.img-picker-modal { background:var(--surface); border-radius:10px; width:520px; max-width:92vw; max-height:82vh; display:flex; flex-direction:column; overflow:hidden; }
.img-picker-hdr { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); }
.img-picker-close { background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-dim); }
.img-picker-tabs { display:flex; gap:6px; padding:10px 16px 0; }
.img-picker-tab { padding:8px 14px; border:none; background:none; cursor:pointer; font-weight:600; font-size:13px; color:var(--text-dim); border-bottom:2px solid transparent; }

.mes-images-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; }
.mes-images-item { cursor:pointer; border:2px solid transparent; border-radius:6px; overflow:hidden; height:80px; background:var(--sidebar-hover); }
.mes-images-item:hover { border-color:var(--accent); }

.spinner-wrap { display:flex; align-items:center; justify-content:center; padding:40px; }

<script>
'use strict';
const API = '/api/sitec';
const ICO = '/static/img/solid/';
const THEMES = ['light','dark','solarized','rose'];

let pages = [];
let current = null; // page en cours d'édition (objet complet)
let dirty = false;

function redirectLogin() { window.location.href = '/login/login'; }

async function apiFetch(url, options = {}) {
  const r = await fetch(url, { ...options, credentials:'include' });
  if (r.status === 401) { redirectLogin(); throw new Error('Session expirée'); }
  return r;
}

// ── Init ──────────────────────────────────────────────────────────
async function initUI() {
  try {
    const r = await fetch('/api/sitec/navbar');
    if (r.status === 401) { redirectLogin(); return; }
    const html = await r.text();
    const nav = document.getElementById('vex-navbar');
    nav.innerHTML = html;
    nav.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      if (old.src) s.src = old.src; else s.textContent = old.textContent;
      document.body.appendChild(s); old.remove();
    });
  } catch {}
}

async function loadPages() {
  document.getElementById('pageList').innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  try {
    const r = await apiFetch(`${API}/list`);
    const data = await r.json();
    pages = data.pages || [];
    renderList();
  } catch(e) {
    if (e.message !== 'Session expirée')
      document.getElementById('pageList').innerHTML = `<div class="empty-list">${I18N.ERREUR_CHARGEMENT}</div>`;
  }
}

function renderList() {
  const el = document.getElementById('pageList');
  if (!pages.length) {
    el.innerHTML = `<div class="empty-list">${I18N.AUCUNE_PAGE}</div>`;
    return;
  }
  el.innerHTML = pages.map(p => {
    const active = current && current.id === p.id ? ' active' : '';
    const badges = [];
    if (p.public) badges.push(`<span class="badge badge-public">${I18N.PUBLIC}</span>`);
    if (p.share_count > 0) badges.push(`<span class="badge badge-partage">${I18N.N_PARTAGES.replace('{n}', p.share_count)}</span>`);
    return `<div class="page-item${active}" data-id="${p.id}">
      <div class="page-item-title">${esc(p.titre || I18N.SANS_TITRE)}</div>
      <div class="page-item-meta">${badges.join('') || `<span>${I18N.PRIVE}</span>`}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.page-item').forEach(item =>
    item.onclick = () => openPage(item.dataset.id)
  );
}

// ── Ouvrir / créer ────────────────────────────────────────────────
async function openPage(id) {
  if (dirty && !confirm(I18N.CONFIRM_QUITTER_SANS_SAUVEGARDER)) return;
  document.getElementById('main').innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  try {
    const r = await apiFetch(`${API}/get?id=${encodeURIComponent(id)}`);
    const data = await r.json();
    if (!data.success) { toast(data.error || I18N.ERREUR, 'err'); return; }
    current = data.page;
    dirty = false;
    blocsFullView = current.mode === 'blocs';
    history.replaceState({}, '', blocsFullView ? `/sitec?open=${encodeURIComponent(id)}&blocs=1` : `/sitec?open=${encodeURIComponent(id)}`);
    renderList();
    renderEditor();
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR_CHARGEMENT, 'err'); }
}

async function createPage() {
  try {
    const r = await apiFetch(`${API}/create`, { method:'POST' });
    const data = await r.json();
    if (!data.success) { toast(data.error || I18N.ERREUR, 'err'); return; }
    await loadPages();
    await openPage(data.id);
    toast(I18N.PAGE_CREEE, 'ok');
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR_CREATION, 'err'); }
}

let blocs = [];
let selectedIdx = -1;
let dragState = null; // { fromPalette:bool, type?, fromIdx? }
let blocsViewMode = 'visuel'; // 'visuel' | 'code'
let actionsMode = false;
let tlPlaying = false;
let tlPlayhead = 0; // ms
let tlSelectedIdx = -1;
let tlSelectedKf = -1; // index dans blocs[idx].keyframes, -1 = repère d'entrée (délai) sélectionné
let tlGrabbing = false;
const TL_ABS_MAX = 120000; // plafond serveur (san_int anim_delai)

let tlEnd = 30000;

function blocDefaut(type) {
  const base = { type, animation: '', ligne: '', largeur: 100, espace: 16, anim_delai: 0, hauteur: 0, decalage: 0, keyframes: [] };
  (BLOC_SPECS[type] || []).forEach(champ => {
    if (champ.type === 'items') base[champ.k] = [];
    else if (champ.type === 'checkgroup') base[champ.k] = champ.defaut ? [...champ.defaut] : [];
    else base[champ.k] = champ.defaut !== undefined ? champ.defaut : '';
  });
  return base;
}

function blocSummary(b) {
  const spec = BLOC_SPECS[b.type] || [];
  const texteChamp = spec.find(c => ['text','textarea'].includes(c.type) && b[c.k]);
  if (texteChamp) return String(b[texteChamp.k]).slice(0, 40);
  const itemsChamp = spec.find(c => c.type === 'items');
  if (itemsChamp && (b[itemsChamp.k] || []).length) return `${b[itemsChamp.k].length} élément(s)`;
  return '';
}

function animationSelectHtml(b) {
  const opts = ANIMATIONS.map(a => `<option value="${a}"${(b.animation||'')===a?' selected':''}>${escAttr(ANIMATION_LABELS[a])}</option>`).join('');
  return `<label class="bloc-anim-row"><i class="fas fa-wand-magic-sparkles"></i> ${escAttr(I18N.ANIMATION_LABEL)}
    <select data-field="animation" class="bloc-anim-select">${opts}</select></label>`;
}

function champHtml(valeur, champ) {
  const v = valeur ?? champ.defaut ?? '';
  if (champ.type === 'text') return `<input type="text" data-field="${champ.k}" placeholder="${escAttr(champ.placeholder||'')}" value="${escAttr(v)}">`;
  if (champ.type === 'textarea') return `<textarea data-field="${champ.k}" placeholder="${escAttr(champ.placeholder||'')}">${esc(v)}</textarea>`;
  if (champ.type === 'number') return `<input type="number" data-field="${champ.k}" min="${champ.min??''}" max="${champ.max??''}" value="${esc(v)}">`;
  if (champ.type === 'datetime') return `<input type="datetime-local" data-field="${champ.k}" value="${escAttr(v)}">`;
  if (champ.type === 'select') return `<select data-field="${champ.k}">${champ.options.map(([val,lbl]) => `<option value="${val}"${String(v)===String(val)?' selected':''}>${escAttr(lbl)}</option>`).join('')}</select>`;
  if (champ.type === 'checkgroup') {
    const arr = Array.isArray(v) ? v : [];
    return `<div class="champ-checkgroup" data-checkgroup="${champ.k}">${champ.options.map(([val,lbl]) => `
      <label><input type="checkbox" value="${val}" ${arr.includes(val)?'checked':''}> ${escAttr(lbl)}</label>`).join('')}</div>`;
  }
  if (champ.type === 'icon') {
    const icon = v || 'star';
    return `<div class="champ-icon" data-field="${champ.k}">
      <div class="champ-icon-preview"><i class="fas fa-${escAttr(icon)}"></i></div>
      <button type="button" class="btn btn-secondary btn-xs" data-icon-pick="${champ.k}"><i class="fas fa-icons"></i> Choisir une icône</button>
    </div>`;
  }
  if (champ.type === 'image') {
    return `<div class="champ-image" data-field="${champ.k}">
      <div class="champ-image-preview">${v ? `<img src="${escAttr(v)}" alt="" onerror="this.parentElement.innerHTML=''">` : ''}</div>
      <div class="champ-image-actions">
        <button type="button" class="btn btn-secondary btn-xs" data-img-pick="${champ.k}"><i class="fas fa-file-image"></i> Choisir une image</button>
        ${v ? `<button type="button" class="btn btn-secondary btn-xs" data-img-clear="${champ.k}"><i class="fas fa-xmark"></i> Retirer</button>` : ''}
      </div>
    </div>`;
  }
  return '';
}

function champItemsHtml(bloc, champ) {
  const items = bloc[champ.k] || [];
  const rows = items.map((it, j) => `
    <div class="champ-item-row" data-subidx="${j}">
      <div class="champ-item-row-hdr">
        <button type="button" class="bloc-act" data-subact="up" ${j===0?'disabled':''} title="Monter"><i class="fas fa-arrow-up"></i></button>
        <button type="button" class="bloc-act" data-subact="down" ${j===items.length-1?'disabled':''} title="Descendre"><i class="fas fa-arrow-down"></i></button>
        <button type="button" class="bloc-act bloc-act-danger" data-subact="del" title="Supprimer"><i class="fas fa-trash"></i></button>
      </div>
      <div class="champ-item-fields">
        ${champ.sousChamps.map(sc => `${sc.label?`<span class="champ-label">${escAttr(sc.label)}</span>`:''}${champHtml(it[sc.k], {...sc, k:sc.k})}`).join('')}
      </div>
    </div>`).join('');
  return `<div class="champ-items" data-field="${champ.k}">
    <div class="champ-items-list">${rows || `<div class="champ-items-empty">Aucun élément — cliquez sur « Ajouter » ci-dessous.</div>`}</div>
    <button type="button" class="btn btn-secondary btn-xs" data-add-item="${champ.k}" style="margin-top:8px"><i class="fas fa-plus"></i> Ajouter</button>
  </div>`;
}

function blocItemBodyHtml(b) {
  const spec = BLOC_SPECS[b.type] || [];
  const champs = spec.map(champ => {
    const inner = champ.type === 'items' ? champItemsHtml(b, champ) : champHtml(b[champ.k], champ);
    return champ.label && champ.type !== 'items' ? `<div><span class="champ-label">${escAttr(champ.label)}</span>${inner}</div>` : `<div>${champ.label?`<span class="champ-label">${escAttr(champ.label)}</span>`:''}${inner}</div>`;
  }).join('');
  return `${champs}${animationSelectHtml(b)}`;
}

// ── Rendu du canevas : rangées de blocs, sélection, glisser-déposer ────
function renderBlocsList() {
  const list = document.getElementById('blocsList');
  if (!list) return;
  if (!blocs.length) {
    list.innerHTML = `<div class="blocs-empty">${I18N.BLOCS_VIDE}</div>`;
    return;
  }

  // Regroupe les blocs consécutifs qui partagent "ligne" en rangées visuelles.
  const rows = [];
  let i = 0;
  while (i < blocs.length) {
    const ligne = blocs[i].ligne || '';
    if (!ligne) { rows.push([i]); i++; continue; }
    const grp = [i];
    let j = i + 1;
    while (j < blocs.length && (blocs[j].ligne || '') === ligne) { grp.push(j); j++; }
    rows.push(grp);
    i = j;
  }

  const cardHtml = (idx) => {
    const b = blocs[idx];
    let style;
    if (b.ligne) {
      style = ` style="flex:0 0 ${b.largeur||100}%;max-width:${b.largeur||100}%;${b.hauteur?`min-height:${b.hauteur}px;`:''}"`;
    } else {
      // Bloc seul : "largeur" (si <100) devient une vraie largeur (pas un
      // flex-basis de rangée) + "decalage" un margin-left, pour pouvoir le
      // rétrécir et le déplacer horizontalement même hors d'une rangée.
      const l = b.largeur || 100;
      style = ` style="width:${l}%;margin-left:${b.decalage||0}%;${b.hauteur?`min-height:${b.hauteur}px;`:''}"`;
    }
    const widthHandle = `<div class="bloc-resize-handle" data-idx="${idx}" title="Glisser pour ajuster la largeur"><i class="fas fa-arrows-left-right"></i></div>`;
    const moveHandle = (!b.ligne && (b.largeur||100) < 100)
      ? `<button type="button" class="bloc-act bloc-move-handle" data-idx="${idx}" title="Glisser pour déplacer horizontalement"><i class="fas fa-up-down-left-right"></i></button>` : '';
    return `<div class="bloc-item${selectedIdx===idx?' selected':''}" data-idx="${idx}" draggable="true"${style}>
      <div class="bloc-item-hdr">
        <span class="bloc-item-type">
          <i class="fas fa-grip-vertical bloc-drag-handle"></i>
          <i class="fas fa-${BLOC_ICONES[b.type]||'cube'} bloc-type-ico"></i>
          ${escAttr(BLOC_LABELS[b.type]||b.type)}
          ${blocSummary(b) ? `<span class="bloc-item-summary">— ${escAttr(blocSummary(b))}</span>` : ''}
        </span>
        <div class="bloc-item-actions">
          ${moveHandle}
          <button type="button" class="bloc-act" data-act="up" ${idx===0?'disabled':''} title="${escAttr(I18N.BLOC_MONTER_TITLE)}"><i class="fas fa-arrow-up"></i></button>
          <button type="button" class="bloc-act" data-act="down" ${idx===blocs.length-1?'disabled':''} title="${escAttr(I18N.BLOC_DESCENDRE_TITLE)}"><i class="fas fa-arrow-down"></i></button>
          <button type="button" class="bloc-act bloc-act-danger" data-act="del" title="${escAttr(I18N.BLOC_SUPPRIMER_TITLE)}"><i class="fas fa-trash"></i></button>
        </div>
      </div>
      ${widthHandle}
      <div class="bloc-height-handle" data-idx="${idx}" title="Glisser pour ajuster la hauteur"><i class="fas fa-arrows-up-down"></i></div>
    </div>`;
  };

  list.innerHTML = rows.map(grp => grp.length === 1
    ? cardHtml(grp[0])
    : `<div class="blocs-row">${grp.map(cardHtml).join('')}</div>`
  ).join('');

  list.querySelectorAll('.bloc-item').forEach(item => {
    const idx = Number(item.dataset.idx);

    item.querySelector('.bloc-item-hdr').addEventListener('click', (e) => {
      if (e.target.closest('.bloc-act')) return;
      selectionnerBloc(idx);
    });

    item.addEventListener('dragstart', (e) => {
      dragState = { fromIdx: idx };
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'reorder');
      document.getElementById('blocsPalette')?.classList.add('trash-armed');
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      dragState = null;
      list.querySelectorAll('.blocs-drop-side').forEach(el => el.classList.remove('blocs-drop-side','side-left','side-right'));
      document.getElementById('blocsPalette')?.classList.remove('trash-armed');
    });

    // Survol : bord gauche/droit = rejoindre une rangée, centre = insérer seul
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const rel = (e.clientX - rect.left) / rect.width;
      item.classList.remove('blocs-drop-side','side-left','side-right');
      if (rel < 0.22) item.classList.add('blocs-drop-side','side-left');
      else if (rel > 0.78) item.classList.add('blocs-drop-side','side-right');
    });
    item.addEventListener('dragleave', () => item.classList.remove('blocs-drop-side','side-left','side-right'));

    item.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const rect = item.getBoundingClientRect();
      const rel = (e.clientX - rect.left) / rect.width;
      item.classList.remove('blocs-drop-side','side-left','side-right');
      const side = rel < 0.22 ? 'left' : (rel > 0.78 ? 'right' : null);
      deposerSur(idx, side);
    });

    item.querySelectorAll(':scope > .bloc-item-hdr .bloc-act').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'up' && idx > 0) {
          [blocs[idx-1], blocs[idx]] = [blocs[idx], blocs[idx-1]];
          if (selectedIdx === idx) selectedIdx = idx-1; else if (selectedIdx === idx-1) selectedIdx = idx;
        }
        if (act === 'down' && idx < blocs.length-1) {
          [blocs[idx+1], blocs[idx]] = [blocs[idx], blocs[idx+1]];
          if (selectedIdx === idx) selectedIdx = idx+1; else if (selectedIdx === idx+1) selectedIdx = idx;
        }
        if (act === 'del') {
          blocs.splice(idx, 1);
          if (selectedIdx === idx) selectedIdx = -1; else if (selectedIdx > idx) selectedIdx--;
        }
        markDirty();
        renderBlocsList();
        renderBlocsSettings();
      });
    });
  });

  // Poignée de redimensionnement (largeur) : marche pour un bloc en rangée
  // (flex-basis, référence = la rangée) comme pour un bloc seul (largeur
  // réelle, référence = le canevas) -- avant, seuls les blocs en rangée
  // étaient redimensionnables.
  list.querySelectorAll('.bloc-resize-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      const enLigne = !!blocs[idx].ligne;
      const ref = enLigne ? item.closest('.blocs-row') : document.getElementById('blocsList');
      if (!ref) return;
      const onMove = (ev) => {
        const refRect = ref.getBoundingClientRect();
        const decalagePx = enLigne ? 0 : (blocs[idx].decalage || 0) / 100 * refRect.width;
        const rel = (ev.clientX - refRect.left - decalagePx) / refRect.width;
        const largeur = Math.max(10, Math.min(100, Math.round(rel * 100)));
        blocs[idx].largeur = largeur;
        if (enLigne) {
          item.style.flex = `0 0 ${largeur}%`;
          item.style.maxWidth = `${largeur}%`;
        } else {
          item.style.width = `${largeur}%`;
        }
        markDirty();
        if (selectedIdx === idx) {
          const el = document.getElementById('setLargeur');
          if (el) el.value = largeur;
        }
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (!enLigne) renderBlocsList(); // fait apparaître/disparaître la poignée de déplacement
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Poignée de déplacement horizontal (bloc seul, rétréci) : glisser = ajuste "decalage"
  list.querySelectorAll('.bloc-move-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      const listEl = document.getElementById('blocsList');
      const onMove = (ev) => {
        const listRect = listEl.getBoundingClientRect();
        const largeur = blocs[idx].largeur || 100;
        let rel = (ev.clientX - listRect.left) / listRect.width * 100;
        const decalage = Math.max(0, Math.min(100 - largeur, Math.round(rel)));
        blocs[idx].decalage = decalage;
        item.style.marginLeft = `${decalage}%`;
        markDirty();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Poignée de redimensionnement (hauteur) : glisser = ajuste "hauteur" (px)
  list.querySelectorAll('.bloc-height-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      const startY = e.clientY;
      const startH = item.getBoundingClientRect().height;
      const onMove = (ev) => {
        const hauteur = Math.max(0, Math.round(startH + (ev.clientY - startY)));
        blocs[idx].hauteur = hauteur;
        item.style.minHeight = `${hauteur}px`;
        markDirty();
        if (selectedIdx === idx) {
          const el = document.getElementById('setHauteur');
          if (el) el.value = hauteur;
        }
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Zone vide du canevas : dépose = bloc seul en fin de page
  list.ondragover = (e) => { if (!e.target.closest('.bloc-item')) e.preventDefault(); };
  list.ondrop = (e) => {
    if (e.target.closest('.bloc-item')) return;
    e.preventDefault();
    if (dragState && dragState.type) {
      ajouterBloc(dragState.type);
    } else if (dragState && dragState.fromIdx !== undefined) {
      const [moved] = blocs.splice(dragState.fromIdx, 1);
      moved.ligne = ''; moved.largeur = 100;
      blocs.push(moved);
      markDirty();
      renderBlocsList();
    }
    dragState = null;
  };

  if (actionsMode) renderTimeline();
}

function selectionnerBloc(idx) {
  selectedIdx = idx;
  renderBlocsList();
  renderBlocsSettings();
}

// ── Panneau de réglages (droite) : contenu complet + disposition + animation du bloc sélectionné ──
function renderBlocsSettings() {
  const panel = document.getElementById('blocsSettings');
  if (!panel) return;
  if (selectedIdx < 0 || !blocs[selectedIdx]) {
    panel.innerHTML = `<div class="blocs-settings-empty"><i class="fas fa-arrow-pointer" style="display:block;font-size:20px;margin-bottom:8px;"></i>Sélectionnez un bloc dans le canevas pour modifier tous ses réglages ici.</div>`;
    return;
  }
  const idx = selectedIdx;
  const b = blocs[idx];
  const enLigne = !!b.ligne;
  panel.innerHTML = `
    <div class="blocs-settings-hdr"><i class="fas fa-${BLOC_ICONES[b.type]||'cube'}"></i> ${escAttr(BLOC_LABELS[b.type]||b.type)}</div>
    <div class="blocs-settings-section-title">Contenu</div>
    ${blocItemBodyHtml(b)}
    <div class="blocs-settings-section-title">Disposition</div>
    <div class="layout-grid-2">
      <div><span class="champ-label">Largeur (%)</span><input type="number" id="setLargeur" min="10" max="100" value="${b.largeur||100}"></div>
      ${enLigne
        ? `<div><span class="champ-label">Espace ligne (px)</span><input type="number" id="setEspace" min="0" max="1000" value="${b.espace||16}"></div>`
        : `<div><span class="champ-label">Décalage gauche (%)</span><input type="number" id="setDecalage" min="0" max="90" value="${b.decalage||0}" ${(b.largeur||100)>=100?'disabled':''}></div>`}
    </div>
    <div style="margin-top:8px"><span class="champ-label">Hauteur forcée (px, 0 = auto)</span><input type="number" id="setHauteur" min="0" max="2000" value="${b.hauteur||0}"></div>
    ${enLigne
      ? `<button type="button" class="btn btn-secondary btn-xs" id="sortirLigneBtn" style="margin-top:8px"><i class="fas fa-arrows-left-right"></i> Sortir de la ligne</button>`
      : `<div class="hint" style="margin-top:6px">Glissez ce bloc sur le bord gauche/droit d'un autre bloc dans le canevas pour les mettre côte à côte, ou réduisez sa largeur et utilisez le décalage pour le positionner librement.</div>`}
    <div class="blocs-settings-section-title">Délai d'animation</div>
    <div><span class="champ-label">Avant déclenchement (ms)</span><input type="number" id="setDelai" min="0" max="120000" step="50" value="${b.anim_delai||0}"></div>
    <div class="hint" style="margin-top:6px">Réglable aussi en glissant le repère de ce bloc dans le mode Actions (barre d'outils verticale).</div>`;

  wireBlocFields(panel, idx);

  const largeurEl = document.getElementById('setLargeur');
  if (largeurEl) largeurEl.addEventListener('input', (e) => setLargeurLigne(idx, Number(e.target.value)));
  const espaceEl = document.getElementById('setEspace');
  if (espaceEl) espaceEl.addEventListener('input', (e) => setEspaceLigne(idx, Number(e.target.value)));
  const decalageEl = document.getElementById('setDecalage');
  if (decalageEl) decalageEl.addEventListener('input', (e) => {
    const largeur = blocs[idx].largeur || 100;
    blocs[idx].decalage = Math.max(0, Math.min(100 - largeur, Number(e.target.value) || 0));
    markDirty(); renderBlocsList();
  });
  const hauteurEl = document.getElementById('setHauteur');
  if (hauteurEl) hauteurEl.addEventListener('input', (e) => { blocs[idx].hauteur = Math.max(0, Math.min(2000, Number(e.target.value)||0)); markDirty(); renderBlocsList(); });
  const delaiEl = document.getElementById('setDelai');
  if (delaiEl) delaiEl.addEventListener('input', (e) => { blocs[idx].anim_delai = Math.max(0, Math.min(120000, Number(e.target.value)||0)); markDirty(); if (actionsMode) renderTimeline(); });
  const sortirBtn = document.getElementById('sortirLigneBtn');
  if (sortirBtn) sortirBtn.onclick = () => sortirDeLaLigne(idx);
}

// Câble les champs (texte, checkgroup, image, icône, sous-listes) d'un
// panneau de réglages sur le bloc `idx` -- utilisé par le panneau latéral.
function wireBlocFields(container, idx) {
  container.querySelectorAll('[data-field]').forEach(field => {
    if (field.closest('.champ-image') || field.closest('.champ-items') || field.closest('.champ-icon')) return;
    field.addEventListener('input', () => { blocs[idx][field.dataset.field] = field.value; markDirty(); });
    field.addEventListener('change', () => renderBlocsList());
  });

  container.querySelectorAll('[data-checkgroup]').forEach(group => {
    group.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        const key = group.dataset.checkgroup;
        blocs[idx][key] = Array.from(group.querySelectorAll('input:checked')).map(c => c.value);
        markDirty();
      });
    });
  });

  container.querySelectorAll('[data-img-pick]').forEach(btn => {
    if (btn.closest('.champ-items')) return;
    btn.addEventListener('click', () => {
      const key = btn.dataset.imgPick;
      ouvrirSelecteurImage(url => { blocs[idx][key] = url; markDirty(); renderBlocsSettings(); });
    });
  });
  container.querySelectorAll('[data-img-clear]').forEach(btn => {
    if (btn.closest('.champ-items')) return;
    btn.addEventListener('click', () => { blocs[idx][btn.dataset.imgClear] = ''; markDirty(); renderBlocsSettings(); });
  });

  container.querySelectorAll('[data-icon-pick]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.iconPick;
      ouvrirSelecteurIcone(slug => { blocs[idx][key] = slug; markDirty(); renderBlocsSettings(); });
    });
  });

  // Sous-listes (items)
  container.querySelectorAll('.champ-items').forEach(wrap => {
    const key = wrap.dataset.field;
    const champ = (BLOC_SPECS[blocs[idx].type] || []).find(c => c.k === key);
    wrap.querySelectorAll('.champ-item-row').forEach(row => {
      const j = Number(row.dataset.subidx);
      row.querySelectorAll('[data-field]').forEach(field => {
        if (field.closest('.champ-image')) return;
        field.addEventListener('input', () => { blocs[idx][key][j][field.dataset.field] = field.value; markDirty(); });
      });
      row.querySelectorAll('[data-img-pick]').forEach(btn => {
        btn.addEventListener('click', () => {
          const fk = btn.dataset.imgPick;
          ouvrirSelecteurImage(url => { blocs[idx][key][j][fk] = url; markDirty(); renderBlocsSettings(); });
        });
      });
      row.querySelectorAll('[data-img-clear]').forEach(btn => {
        btn.addEventListener('click', () => { blocs[idx][key][j][btn.dataset.imgClear] = ''; markDirty(); renderBlocsSettings(); });
      });
      row.querySelectorAll('[data-subact]').forEach(btn => {
        btn.addEventListener('click', () => {
          const items = blocs[idx][key];
          if (btn.dataset.subact === 'up' && j > 0) [items[j-1], items[j]] = [items[j], items[j-1]];
          if (btn.dataset.subact === 'down' && j < items.length-1) [items[j+1], items[j]] = [items[j], items[j+1]];
          if (btn.dataset.subact === 'del') items.splice(j, 1);
          markDirty();
          renderBlocsSettings();
        });
      });
    });
    const addBtn = wrap.querySelector('[data-add-item]');
    if (addBtn) addBtn.addEventListener('click', () => {
      const nouvel = {};
      champ.sousChamps.forEach(sc => { nouvel[sc.k] = ''; });
      blocs[idx][key].push(nouvel);
      markDirty();
      renderBlocsSettings();
    });
  });
}

// ── Disposition en rangées (plusieurs blocs par ligne) ──────────────
function deposerSur(targetIdx, side) {
  if (!dragState) return;
  let novo;
  if (dragState.type) {
    novo = blocDefaut(dragState.type);
  } else if (dragState.fromIdx !== undefined) {
    [novo] = blocs.splice(dragState.fromIdx, 1);
    if (dragState.fromIdx < targetIdx) targetIdx--;
  } else {
    dragState = null;
    return;
  }

  if (side === 'left' || side === 'right') {
    const target = blocs[targetIdx];
    const ligneId = target.ligne || ('r' + Date.now().toString(36));
    if (!target.ligne) target.ligne = ligneId;
    novo.ligne = ligneId;
    novo.espace = target.espace || 16;
    const insertAt = side === 'left' ? targetIdx : targetIdx + 1;
    blocs.splice(insertAt, 0, novo);
    equilibrerLigne(ligneId);
  } else {
    novo.ligne = ''; novo.largeur = 100;
    blocs.splice(targetIdx + 1, 0, novo);
  }
  selectedIdx = blocs.indexOf(novo);
  markDirty();
  renderBlocsList();
  renderBlocsSettings();
  dragState = null;
}

function equilibrerLigne(ligneId) {
  const idxs = blocs.map((b, i) => b.ligne === ligneId ? i : -1).filter(i => i >= 0);
  if (!idxs.length) return;
  const w = Math.round(100 / idxs.length);
  idxs.forEach(i => { blocs[i].largeur = w; });
}

function sortirDeLaLigne(idx) {
  const ligneId = blocs[idx].ligne;
  blocs[idx].ligne = '';
  blocs[idx].largeur = 100;
  if (ligneId) equilibrerLigne(ligneId);
  markDirty();
  renderBlocsList();
  renderBlocsSettings();
}

function setLargeurLigne(idx, val) {
  blocs[idx].largeur = Math.max(10, Math.min(100, val || 100));
  markDirty();
  renderBlocsList();
}

function setEspaceLigne(idx, val) {
  const v = Math.max(0, Math.min(1000, val || 0));
  const ligneId = blocs[idx].ligne;
  blocs.forEach(b => { if (b.ligne && b.ligne === ligneId) b.espace = v; });
  markDirty();
  renderBlocsList();
}

function ajouterBloc(type, apres) {
  const bloc = blocDefaut(type);
  if (apres === undefined || apres >= blocs.length - 1) {
    blocs.push(bloc);
    selectedIdx = blocs.length - 1;
  } else {
    blocs.splice(apres + 1, 0, bloc);
    selectedIdx = apres + 1;
  }
  markDirty();
  renderBlocsList();
  renderBlocsSettings();
}

function renderPalette() {
  const el = document.getElementById('blocsPalette');
  if (!el) return;
  el.innerHTML = `<div class="blocs-palette-trash-overlay"><i class="fas fa-trash"></i></div>` + CATEGORIES.map(cat => `
    <div class="blocs-palette-cat">${escAttr(cat.nom)}</div>
    ${cat.types.map(type => `
      <div class="blocs-palette-item" draggable="true" data-type="${type}">
        <i class="fas fa-${BLOC_ICONES[type]||'cube'}"></i> ${escAttr(BLOC_LABELS[type]||type)}
      </div>`).join('')}
  `).join('');

  el.querySelectorAll('.blocs-palette-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      dragState = { type: item.dataset.type };
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', 'nouveau-bloc');
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    item.addEventListener('click', () => ajouterBloc(item.dataset.type));
  });

  // Glisser un bloc du canevas jusqu'ici = le supprimer (poubelle).
  el.ondragover = (e) => {
    if (dragState && dragState.fromIdx !== undefined) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
  };
  el.ondrop = (e) => {
    if (!dragState || dragState.fromIdx === undefined) return;
    e.preventDefault();
    const idx = dragState.fromIdx;
    blocs.splice(idx, 1);
    if (selectedIdx === idx) selectedIdx = -1; else if (selectedIdx > idx) selectedIdx--;
    dragState = null;
    markDirty();
    renderBlocsList();
    renderBlocsSettings();
  };
}

let imgPickerCallback = null;

function ouvrirSelecteurImage(onChoisi) {
  imgPickerCallback = onChoisi;
  document.getElementById('imgPickerOverlay').style.display = 'flex';
  document.getElementById('imgPickerUrlInput').value = '';
  activerOngletImgPicker('url');
}
function fermerSelecteurImage() {
  document.getElementById('imgPickerOverlay').style.display = 'none';
  imgPickerCallback = null;
}
function activerOngletImgPicker(tab) {
  document.querySelectorAll('.img-picker-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.img-picker-pane').forEach(p => p.classList.toggle('active', p.dataset.pane === tab));
  if (tab === 'mesfichiers') chargerMesImages();
}
async function chargerMesImages() {
  const el = document.getElementById('mesImagesGrid');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  try {
    const r = await apiFetch(`${API}/mes_images`);
    const data = await r.json();
    const fichiers = data.fichiers || [];
    if (!fichiers.length) { el.innerHTML = `<div class="champ-items-empty">Aucune image dans vos fichiers.</div>`; return; }
    el.innerHTML = fichiers.map(f => `<div class="mes-images-item" data-id="${f.id}" title="${escAttr(f.nom)}"><img src="${API}/fichier_thumb?id=${f.id}" loading="lazy"></div>`).join('');
    el.querySelectorAll('.mes-images-item').forEach(item => item.onclick = () => importerFichier(Number(item.dataset.id)));
  } catch(e) { el.innerHTML = `<div class="champ-items-empty">Erreur de chargement.</div>`; }
}
async function importerFichier(id) {
  try {
    const r = await apiFetch(`${API}/import_fichier`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fichier_id:id}) });
    const data = await r.json();
    if (data.success) { if (imgPickerCallback) imgPickerCallback(data.url); fermerSelecteurImage(); }
    else toast(data.error || I18N.ERREUR, 'err');
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR, 'err'); }
}
function validerUrlImage() {
  const url = document.getElementById('imgPickerUrlInput').value.trim();
  if (!url) return;
  if (imgPickerCallback) imgPickerCallback(url);
  fermerSelecteurImage();
}
function gererUploadImage(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('Fichier trop volumineux (5 Mo maximum).', 'err'); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const b64 = String(reader.result).split(',')[1] || '';
    try {
      const r = await apiFetch(`${API}/media_upload`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({file_b64:b64, mime_type:file.type, file_name:file.name}),
      });
      const data = await r.json();
      if (data.success) { if (imgPickerCallback) imgPickerCallback(data.url); fermerSelecteurImage(); }
      else toast(data.error || I18N.ERREUR, 'err');
    } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR, 'err'); }
  };
  reader.readAsDataURL(file);
}

  document.getElementById('tlNextKeyBtn').onclick = () => tlJumpToKeyframe(1);
  const frameInput = document.getElementById('tlFrameInput');
  frameInput.value = Math.round(tlPlayhead);
  frameInput.addEventListener('change', () => tlSetPlayhead(Number(frameInput.value) || 0));
  const startInput = document.getElementById('tlStartInput');
  const endInput = document.getElementById('tlEndInput');
  startInput.value = tlStart;
  endInput.value = tlEnd;
  startInput.addEventListener('change', () => tlSetRange(Number(startInput.value) || 0, tlEnd));
  endInput.addEventListener('change', () => tlSetRange(tlStart, Number(endInput.value) || tlStart + 100));
}

function quitterBlocsFullView() {
  blocsFullView = false;
  actionsMode = false;
  history.pushState({}, '', `/sitec?open=${encodeURIComponent(current.id)}`);

// ── Vue / Code (édition JSON directe des blocs pour les utilisateurs avancés) ──
function basculerVue(view) {
  const visuel = document.getElementById('blocsCanvasVisuel');
  const code = document.getElementById('blocsCanvasCode');
  if (blocsViewMode === 'code' && view !== 'code') {
    try {
      const parsed = JSON.parse(code.value);
      if (Array.isArray(parsed)) { blocs = parsed; markDirty(); }
      else { toast('Le code doit être un tableau de blocs — changements ignorés.', 'err'); }
    } catch (e) { toast('JSON invalide — changements ignorés.', 'err'); }
  }

// ── Mode Actions : réglage des délais d'animation sur une frise temporelle ──
function basculerModeActions() {
  actionsMode = !actionsMode;
  document.getElementById('vbtnActions').classList.toggle('active', actionsMode);
  document.getElementById('blocsTimeline').classList.toggle('active', actionsMode);
  // Laisse toute la largeur au canevas + a la frise pendant l'edition des
  // animations -- ni le panneau de reglages ni la palette n'y servent.
  const settingsEl = document.getElementById('blocsSettings');
  if (settingsEl) settingsEl.style.display = actionsMode ? 'none' : '';
  const paletteEl = document.getElementById('blocsPalette');

const TL_BASE_PX = 600;
let tlZoomLevel = 1;
function tlZoom(dir) {
  tlZoomLevel = Math.max(1, Math.min(8, tlZoomLevel + dir));
  applyTlZoomWidth();
  renderTlRulerNumbers();
  drawTimelineLinks();
}
function applyTlZoomWidth() {
  const px = `${TL_BASE_PX * tlZoomLevel}px`;
  const rulerWrap = document.getElementById('tlRulerWrap');
  if (rulerWrap) rulerWrap.style.width = px;
  document.querySelectorAll('.timeline-track-ruler').forEach(r => r.style.width = px);
}

// Clic ou glisser sur la règle (hors repère) = déplace le curseur de
// lecture -- câblé une seule fois, le conteneur #tlRulerOuter reste stable
// à travers les re-rendus de renderTimeline().
function wireTlSeek() {
  const outer = document.getElementById('tlRulerOuter');
  if (!outer) return;
  const seek = (ev) => {
    const wrap = document.getElementById('tlRulerWrap');
    const rect = wrap.getBoundingClientRect();
    const rel = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
    tlSetPlayhead(tlStart + rel * (tlEnd - tlStart));
  };
  outer.addEventListener('mousedown', (e) => {
    if (e.target.closest('.timeline-clip')) return; // la poignée gère son propre glisser
    if (e.target.closest('.timeline-track-add')) return; // le bouton "+" gère son propre clic
    if (e.target.closest('.timeline-track-label')) return; // zone d'étiquette, pas la règle
    seek(e);
    const onMove = (ev) => seek(ev);
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function renderTimeline() {
  const tracks = document.getElementById('tlTracks');
  // Le bouton lecture doit fonctionner meme sans aucun bloc anime -- cable
  // en dehors du bloc "liste des pistes" ci-dessous (qui peut etre vide).
  const playBtn = document.getElementById('tlPlayBtn');
  if (playBtn) playBtn.onclick = () => tlTogglePlay(false);
  if (!tracks) return;

  // Toutes les pistes sont affichées (pas seulement celles déjà animées) --
  // c'est ici, via "+", qu'on ajoute le tout premier repère de position
  // d'un bloc ; sans ça il n'y avait aucun moyen d'en créer un.
  const animes = blocs.map((b, i) => ({ b, i }));
  if (!animes.length) {
    tracks.innerHTML = `<div class="hint">Aucun bloc sur la page — ajoutez-en un depuis la palette.</div>`;
    renderTlKfEditor();
    return;
  }
  tracks.innerHTML = animes.map(({ b, i }) => {
    const entryClip = b.animation
      ? `<div class="timeline-clip entry${(tlSelectedIdx===i&&tlSelectedKf===-1)?' selected':''}" data-idx="${i}" data-kf="entry" style="left:calc(${tlPct(b.anim_delai||0)}% - 8px)" title="${b.anim_delai||0} ms"></div>`
      : '';
    const posClips = (b.keyframes||[]).map((k, kf) => `
      <div class="timeline-clip pos${(tlSelectedIdx===i&&tlSelectedKf===kf)?' selected':''}" data-idx="${i}" data-kf="${kf}" style="left:calc(${tlPct(k.t||0)}% - 8px)" title="${k.t||0} ms — x:${k.x||0} y:${k.y||0}"></div>`).join('');
    return `
    <div class="timeline-track">
      <div class="timeline-track-label"><i class="fas fa-${BLOC_ICONES[b.type]||'cube'}"></i> ${escAttr(BLOC_LABELS[b.type]||b.type)}
        <button type="button" class="timeline-track-add" data-idx="${i}" title="Ajouter un repère de position ici"><i class="fas fa-plus"></i></button>
      </div>
      <div class="timeline-track-ruler" data-idx="${i}">${entryClip}${posClips}</div>
    </div>`;
  }).join('');
  applyTlZoomWidth();
  renderTlRulerNumbers();

  tracks.querySelectorAll('.timeline-clip').forEach(clip => {
    clip.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(clip.dataset.idx);
      const kfAttr = clip.dataset.kf;
      const isEntry = kfAttr === 'entry';
      const kf = isEntry ? -1 : Number(kfAttr);
      // Ne PAS appeler selectionnerBloc()/renderBlocsList() ici : ça
      // re-génère #tlTracks (actionsMode oblige) et détache l'élément
      // `clip` qu'on vient de saisir, cassant le glissé en plein milieu
      // (c'était le bug "déplacer une image clé ça bug").
      tlSelectedIdx = idx;
      tlSelectedKf = kf;
      selectedIdx = idx;
      tracks.querySelectorAll('.timeline-clip').forEach(c => c.classList.toggle('selected', c === clip));
      renderTlKfEditor();
      const ruler = clip.parentElement;
      const onMove = (ev) => {
        const rect = ruler.getBoundingClientRect();
        let rel = (ev.clientX - rect.left) / rect.width;
        rel = Math.max(0, Math.min(1, rel));
        const ms = Math.round((tlStart + rel * (tlEnd - tlStart)) / 50) * 50;
        if (isEntry) blocs[idx].anim_delai = ms;
        else blocs[idx].keyframes[kf].t = ms;
        clip.style.left = `calc(${tlPct(ms)}% - 8px)`;
        clip.title = isEntry ? `${ms} ms` : `${ms} ms — x:${blocs[idx].keyframes[kf].x||0} y:${blocs[idx].keyframes[kf].y||0}`;
        markDirty();
        drawTimelineLinks();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (!isEntry) blocs[idx].keyframes.sort((a, b2) => (a.t||0) - (b2.t||0));
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  tracks.querySelectorAll('.timeline-track-add').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = Number(btn.dataset.idx);
      const b = blocs[idx];
      if (!b.keyframes) b.keyframes = [];
      const t = Math.round(tlPlayhead / 50) * 50;
      // Valeur de depart : celle du dernier repere existant (continuite),
      // ou 0 (position/deformation neutre) si c'est le tout premier.
      const last = b.keyframes.length ? b.keyframes[b.keyframes.length - 1] : { x: 0, y: 0, w: 0, h: 0 };
      b.keyframes.push({ t, x: last.x || 0, y: last.y || 0, w: last.w || 0, h: last.h || 0 });
      b.keyframes.sort((a, c) => (a.t||0) - (c.t||0));
      tlSelectedIdx = idx;
      tlSelectedKf = b.keyframes.findIndex(k => k.t === t);
      selectedIdx = idx;
      markDirty();
      renderTimeline();
    });
  });

  drawTimelineLinks();
  renderTlKfEditor();
}

// Petit éditeur X/Y inline dans l'en-tête de la frise, affiché seulement
// quand un repère de POSITION (pas le délai d'entrée) est sélectionné --
// le panneau de réglages classique est masqué en mode Actions.
function renderTlKfEditor() {
  const el = document.getElementById('tlKfEditor');
  if (!el) return;
  if (tlSelectedIdx < 0 || tlSelectedKf < 0 || !blocs[tlSelectedIdx] || !blocs[tlSelectedIdx].keyframes[tlSelectedKf]) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  const k = blocs[tlSelectedIdx].keyframes[tlSelectedKf];
  el.style.display = 'flex';
  el.innerHTML = `
    <span class="champ-label">Repère</span>
    <span class="tl-kf-editor-lbl">X</span><input type="number" id="tlKfX" value="${k.x||0}" step="10" title="Décalage X (px)">
    <span class="tl-kf-editor-lbl">Y</span><input type="number" id="tlKfY" value="${k.y||0}" step="10" title="Décalage Y (px)">
    <span class="tl-kf-editor-lbl">L</span><input type="number" id="tlKfW" value="${k.w||0}" min="0" step="10" title="Largeur (px, 0 = ne pas déformer)">
    <span class="tl-kf-editor-lbl">H</span><input type="number" id="tlKfH" value="${k.h||0}" min="0" step="10" title="Hauteur (px, 0 = ne pas déformer)">
    <button type="button" class="btn btn-secondary btn-xs" id="tlKfDelBtn"><i class="fas fa-trash"></i></button>`;
  document.getElementById('tlKfX').addEventListener('input', (e) => { k.x = Number(e.target.value) || 0; markDirty(); });
  document.getElementById('tlKfY').addEventListener('input', (e) => { k.y = Number(e.target.value) || 0; markDirty(); });
  document.getElementById('tlKfW').addEventListener('input', (e) => { k.w = Math.max(0, Number(e.target.value) || 0); markDirty(); });
  document.getElementById('tlKfH').addEventListener('input', (e) => { k.h = Math.max(0, Number(e.target.value) || 0); markDirty(); });
  document.getElementById('tlKfDelBtn').addEventListener('click', () => supprimerRepereSelectionne());
}

// Enlève le repère sélectionné dans la frise (Suppr) -- soit le repère
// d'entrée (désanime le bloc), soit un repère de position (retiré du
// tableau keyframes), sans supprimer le bloc lui-même de la page.
function supprimerRepereSelectionne() {
  if (tlSelectedIdx < 0 || !blocs[tlSelectedIdx]) return false;
  if (tlSelectedKf >= 0) {
    const kfs = blocs[tlSelectedIdx].keyframes || [];
    kfs.splice(tlSelectedKf, 1);
  } else {
    blocs[tlSelectedIdx].animation = '';
    blocs[tlSelectedIdx].anim_delai = 0;
  }
  tlSelectedIdx = -1;
  tlSelectedKf = -1;
  markDirty();
  renderTimeline();
  renderBlocsSettings();
  return true;
}

// Relie les repères consécutifs (triés par délai) par une ligne, comme les
// images clés reliées dans le dopesheet de Blender -- aide à visualiser
// l'ordre de déclenchement des animations entre blocs différents.
function drawTimelineLinks() {
  const wrap = document.getElementById('tlTracks');
  if (!wrap) return;
  wrap.querySelector('svg.tl-links')?.remove();
  const clips = Array.from(wrap.querySelectorAll('.timeline-clip'));
  if (clips.length < 2) return;
  const wrapRect = wrap.getBoundingClientRect();
  const pts = clips.map(clip => {
    const idx = Number(clip.dataset.idx);
    const kfAttr = clip.dataset.kf;
    const delai = kfAttr === 'entry' ? (blocs[idx].anim_delai || 0) : (blocs[idx].keyframes[Number(kfAttr)]?.t || 0);
    const r = clip.getBoundingClientRect();
    return {
      delai,
      x: r.left + r.width / 2 - wrapRect.left,
      y: r.top + r.height / 2 - wrapRect.top + wrap.scrollTop,
    };
  }).sort((a, b) => a.delai - b.delai);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'tl-links');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', String(wrap.scrollHeight));
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  line.setAttribute('points', pts.map(p => `${p.x},${p.y}`).join(' '));
  line.setAttribute('fill', 'none');
  line.setAttribute('stroke', 'var(--accent)');
  line.setAttribute('stroke-width', '2');
  line.setAttribute('stroke-dasharray', '4 3');
  line.setAttribute('opacity', '0.55');
  svg.appendChild(line);
  wrap.insertBefore(svg, wrap.firstChild);
}

// % de position dans la plage [tlStart, tlEnd] visible sur la règle.
function tlPct(ms) {
  const span = tlEnd - tlStart || 1;
  return (ms - tlStart) / span * 100;
}

function tlSetPlayhead(ms) {
  tlPlayhead = Math.max(tlStart, Math.min(tlEnd, ms));
  const ph = document.getElementById('tlPlayhead');
  if (ph) ph.style.left = `${tlPct(tlPlayhead)}%`;
  const f = document.getElementById('tlFrameInput');
  if (f && document.activeElement !== f) f.value = Math.round(tlPlayhead);
}

// Chiffres au-dessus de la règle (comme la règle d'images de Blender) --
// ~8 graduations réparties entre Début et Fin.
function renderTlRulerNumbers() {
  const el = document.getElementById('tlRulerNumbers');
  if (!el) return;
  const n = 8;
  let html = '';
  for (let k = 0; k <= n; k++) {
    const ms = tlStart + (tlEnd - tlStart) * (k / n);
    html += `<span style="left:${k/n*100}%">${Math.round(ms)}</span>`;
  }
  el.innerHTML = html;
  el.style.width = document.getElementById('tlRulerWrap')?.style.width || '';
}

// dir=false -> lecture avant depuis la position actuelle du curseur ;
// dir=true -> lecture arrière (rembobinage) jusqu'à Début.
function tlTogglePlay(dir = false) {
  const btnFwd = document.getElementById('tlPlayBtn');
  const btnBack = document.getElementById('tlPlayBackBtn');
  if (tlPlaying) {
    tlPlaying = false;
    if (btnFwd) btnFwd.innerHTML = '<i class="fas fa-play"></i>';
    if (btnBack) btnBack.classList.remove('active');
    return;
  }
  tlPlaying = true;
  const reverse = !!dir;
  if (btnFwd) btnFwd.innerHTML = reverse ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
  if (btnBack) btnBack.classList.toggle('active', reverse);
  const start = performance.now();
  const startPlayhead = tlPlayhead;
  function tick(now) {
    if (!tlPlaying) return;
    const elapsed = now - start;
    const ms = reverse ? startPlayhead - elapsed : startPlayhead + elapsed;
    if (ms <= tlStart) { tlSetPlayhead(tlStart); tlTogglePlay(); return; }
    if (ms >= tlEnd) { tlSetPlayhead(tlEnd); tlTogglePlay(); return; }
    tlSetPlayhead(ms);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Repère précédent/suivant (délais d'entrée + repères de position), et bornes Début/Fin.
function tlJumpToKeyframe(dir) {
  const delais = [
    ...blocs.filter(b => b.animation).map(b => b.anim_delai || 0),
    ...blocs.flatMap(b => (b.keyframes||[]).map(k => k.t || 0)),
  ];
  if (!delais.length) return;
  if (dir < 0) {
    const prev = delais.filter(d => d < tlPlayhead);
    tlSetPlayhead(prev.length ? Math.max(...prev) : tlStart);
  } else {
    const next = delais.filter(d => d > tlPlayhead);
    tlSetPlayhead(next.length ? Math.min(...next) : tlEnd);
  }
}

function tlSetRange(start, end) {
  tlStart = Math.max(0, Math.min(start, end - 100));
  tlEnd = Math.max(tlStart + 100, Math.min(TL_ABS_MAX, end));
  tlSetPlayhead(tlPlayhead);
  renderTimeline();
}

// "G" façon Blender (Grab) : la souris déplace le repère sans garder le
// bouton enfoncé -- clic ou Entrée confirme, Échap annule et restaure la
// position d'origine.
function tlStartGrab() {
  if (tlSelectedIdx < 0 || tlGrabbing) return;
  const idx = tlSelectedIdx;
  const kf = tlSelectedKf;
  const isEntry = kf < 0;
  const kfAttr = isEntry ? 'entry' : kf;
  const clip = document.querySelector(`.timeline-clip[data-idx="${idx}"][data-kf="${kfAttr}"]`);
  const ruler = clip ? clip.parentElement : null;
  if (!clip || !ruler) return;
  tlGrabbing = true;
  const origVal = isEntry ? (blocs[idx].anim_delai || 0) : (blocs[idx].keyframes[kf].t || 0);
  const onMove = (ev) => {
    const rect = ruler.getBoundingClientRect();
    let rel = (ev.clientX - rect.left) / rect.width;
    rel = Math.max(0, Math.min(1, rel));
    const ms = Math.round((tlStart + rel * (tlEnd - tlStart)) / 50) * 50;
    if (isEntry) blocs[idx].anim_delai = ms; else blocs[idx].keyframes[kf].t = ms;
    clip.style.left = `calc(${tlPct(ms)}% - 8px)`;
    clip.title = isEntry ? `${ms} ms` : `${ms} ms — x:${blocs[idx].keyframes[kf].x||0} y:${blocs[idx].keyframes[kf].y||0}`;
    drawTimelineLinks();
  };
  const finish = (cancel) => {
    tlGrabbing = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mousedown', onClickConfirm, true);
    document.removeEventListener('keydown', onKey, true);
    if (cancel) { if (isEntry) blocs[idx].anim_delai = origVal; else blocs[idx].keyframes[kf].t = origVal; }
    else if (!isEntry) blocs[idx].keyframes.sort((a, b2) => (a.t||0) - (b2.t||0));
    markDirty();
    renderTimeline();
  };
  const onClickConfirm = (ev) => { ev.preventDefault(); ev.stopPropagation(); finish(false); };
  const onKey = (ev) => {
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); finish(true); }
    else if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); finish(false); }
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mousedown', onClickConfirm, true);
  document.addEventListener('keydown', onKey, true);
}

function markDirty() { dirty = true; }

// ── Sauvegarde / suppression ───────────────────────────────────────
async function savePage(mode) {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  const publicToggle = document.getElementById('publicToggle');
  const payload = {
    id: current.id,
    titre: document.getElementById('titreInput').value.trim() || I18N.SANS_TITRE,
    mode,
    public: publicToggle ? publicToggle.checked : !!current.public,
    contenu_titre: document.getElementById('contenuTitreInput')?.value || '',
    contenu_corps: document.getElementById('contenuCorpsInput')?.value || '',
    contenu_html:  document.getElementById('contenuHtmlInput')?.value || '',
    contenu_blocs: blocs,
  };
  try {
    const r = await apiFetch(`${API}/save`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    const data = await r.json();
    if (data.success) {
      dirty = false;
      toast(I18N.PAGE_ENREGISTREE, 'ok');
      await loadPages();
    } else {
      toast(data.error || I18N.ERREUR, 'err');
    }
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR_ENREGISTREMENT, 'err'); }
  finally { btn.disabled = false; }
}

async function deletePage(id) {
  if (!confirm(I18N.CONFIRM_SUPPRIMER_PAGE)) return;
  try {
    await apiFetch(`${API}/delete`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id})
    });
    current = null; dirty = false;
    document.getElementById('main').innerHTML = `
      <div class="empty-state">
        <img class="ico ico-lg ico-muted" src="${ICO}globe.svg">
        <p>${I18N.SELECTIONNEZ_OU_CREEZ}</p>
      </div>`;
    await loadPages();
    toast(I18N.PAGE_SUPPRIMEE, 'ok');
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR_SUPPRESSION, 'err'); }
}

// ── Partage ─────────────────────────────────────────────────────────
async function addShare(id) {
  const input = document.getElementById('shareEmailInput');
  const email = input.value.trim();
  if (!email) return;
  try {
    const r = await apiFetch(`${API}/share`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, email, action:'add'})
    });
    const data = await r.json();
    if (data.success) { input.value=''; await openPage(id); toast(I18N.ACCES_ACCORDE, 'ok'); }
    else toast(data.error || I18N.ERREUR, 'err');
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR, 'err'); }
}

async function removeShare(id, email) {
  try {
    const r = await apiFetch(`${API}/share`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, email, action:'remove'})
    });
    const data = await r.json();
    if (data.success) { await openPage(id); toast(I18N.ACCES_RETIRE, 'ok'); }
    else toast(data.error || I18N.ERREUR, 'err');
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR, 'err'); }
