function basculerVue(view) {
  const visuel = document.getElementById('blocsCanvasVisuel');
  const code = document.getElementById('blocsCanvasCode');
  if (blocsViewMode === 'code' && view !== 'code') {
    try {
      const parsed = JSON.parse(code.value);
      if (Array.isArray(parsed)) { blocs = parsed; markDirty(); }
      else { toast('Le code doit être un tableau de blocs — changements ignorés.', 'err'); }
    } catch (e) { toast('JSON invalide — changements ignorés.', 'err'); }
  }
  blocsViewMode = view;
  document.getElementById('vbtnVisuel').classList.toggle('active', view === 'visuel');
  document.getElementById('vbtnCode').classList.toggle('active', view === 'code');
  if (view === 'code') {
    code.value = JSON.stringify(blocs, null, 2);
    visuel.style.display = 'none';
    code.style.display = 'block';
  } else {
    code.style.display = 'none';
    visuel.style.display = 'block';
    renderBlocsList();
    renderBlocsSettings();
  }
}

// ── Mode Actions : réglage des délais d'animation sur une frise temporelle ──
let actionsWideMode = false;
function basculerModeActions() {
  actionsMode = !actionsMode;
  document.getElementById('vbtnActions').classList.toggle('active', actionsMode);
  document.getElementById('blocsTimeline').classList.toggle('active', actionsMode);
  // Le canevas se partage naturellement la hauteur fixe du conteneur avec
  // la frise (flex) sans qu'il faille masquer palette/réglages pour gagner
  // de la largeur -- ça reste possible mais optionnel, via le bouton
  // "Élargir" juste à côté (masquer par défaut ferait sortir le canevas de
  // l'écran dès qu'on interagit avec le bas de la frise, sur un conteneur
  // plus grand que la fenêtre : mieux vaut garder tout visible ensemble).
  appliquerLayoutActions();
  if (actionsMode) {
    renderTimeline();
    appliquerApercuKeyframes();
  } else {
    // Revient à la forme/position statique du bloc (celle des champs
    // Largeur/Hauteur du panneau de réglages) en quittant le mode Actions
    // -- sinon le canevas resterait visuellement figé sur le dernier
    // instant de la frise, ce qui serait trompeur hors de ce mode.
    renderBlocsList();
  }
}
function appliquerLayoutActions() {
  // Bouton "Élargir" (voir vbtnWide) : sans effet en mode Actions -- masquer
  // palette/réglages y change la largeur du canevas (flex:1 sur
  // .blocs-center), ce qui déplace la frise/le repère de lecture sous la
  // souris de façon geanante pendant qu'on regle une animation.
  const hide = actionsWideMode && !actionsMode;
  const settingsEl = document.getElementById('blocsSettings');
  if (settingsEl) settingsEl.style.display = hide ? 'none' : '';
  const paletteEl = document.getElementById('blocsPalette');
  if (paletteEl) paletteEl.style.display = hide ? 'none' : '';
}

const TL_BASE_PX = 600;
let tlZoomLevel = 1;
function tlZoom(dir) {
  tlZoomLevel = Math.max(1, Math.min(8, tlZoomLevel + dir));
  applyTlZoomWidth();
  renderTlRulerNumbers();
  drawTimelineLinks();
  const ph = document.getElementById('tlPlayhead');
  if (ph) ph.style.left = `${tlPlayheadLeftPx()}px`;
}
function applyTlZoomWidth() {
  const px = `${TL_BASE_PX * tlZoomLevel}px`;
  const rulerWrap = document.getElementById('tlRulerWrap');
  if (rulerWrap) rulerWrap.style.width = px;
  document.querySelectorAll('.timeline-track-ruler').forEach(r => r.style.width = px);
}

// Clic ou glisser sur la règle (hors repère) = déplace le curseur de
// lecture -- câblé une seule fois, le conteneur #tlRulerOuter reste stable
// à travers les re-rendus de renderTimeline().
function wireTlSeek() {
  const outer = document.getElementById('tlRulerOuter');
  if (!outer) return;
  const seek = (ev) => {
    const wrap = document.getElementById('tlRulerWrap');
    const rect = wrap.getBoundingClientRect();
    const rel = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
    tlSetPlayhead(tlStart + rel * (tlEnd - tlStart));
  };
  outer.addEventListener('mousedown', (e) => {
    if (e.target.closest('.timeline-clip')) return; // la poignée gère son propre glisser
    if (e.target.closest('.timeline-track-add')) return; // le bouton "+" gère son propre clic
    if (e.target.closest('.timeline-track-label')) return; // zone d'étiquette, pas la règle
    seek(e);
    const onMove = (ev) => seek(ev);
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  // Molette = zoom de la frise (comme la molette sur le canevas), sans avoir
  // à passer par les petits boutons +/- dédiés.
  outer.addEventListener('wheel', (e) => {
    e.preventDefault();
    tlZoom(e.deltaY < 0 ? 1 : -1);
  }, { passive: false });
}

// Glisser la poignée en haut de la frise = régler sa hauteur (celle de la
// zone des pistes, qui scrolle déjà verticalement si besoin -- voir
// .blocs-timeline-tracks). Purement une préférence d'affichage, pas
// enregistrée avec la page.
function wireTlHeightResize() {
  const handle = document.getElementById('tlHeightResize');
  const tracks = document.getElementById('tlTracks');
  if (!handle || !tracks) return;
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    handle.classList.add('dragging');
    const startY = e.clientY;
    const startH = tracks.getBoundingClientRect().height;
    const onMove = (ev) => {
      const h = Math.max(30, Math.min(600, Math.round(startH - (ev.clientY - startY))));
      tracks.style.maxHeight = `${h}px`;
    };
    const onUp = () => {
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// Valeur interpolée (x/y/w/h) d'une liste de repères à l'instant `t` --
// même interpolation linéaire que le CSS @keyframes généré côté serveur,
// pour que "insérer ici" capture ce qui est réellement affiché à cet
// instant (état courant, éventuellement à mi-transition), pas la valeur
// du tout dernier repère de la liste.
// Comble les "trous" (null = dimension non fixée à ce repère) avec la
// valeur définie la plus proche (avant puis après) -- même logique que
// `fill_dimension` côté serveur, pour qu'une déformation (ex: largeur 0 ->
// 150) ne soit jamais confondue avec "pas de déformation à ce repère" :
// null = non fixé (taille naturelle), 0 = largeur/hauteur réellement nulle.
function remplirDimensions(tries) {
  const remplir = (getter) => {
    const out = tries.map(getter);
    let last = null;
    for (let i = 0; i < out.length; i++) { if (out[i] != null) last = out[i]; else if (last != null) out[i] = last; }
    let next = null;
    for (let i = out.length - 1; i >= 0; i--) { if (out[i] != null) next = out[i]; else if (next != null) out[i] = next; }
    return out;
  };
  return { ws: remplir(k => k.w == null ? null : k.w), hs: remplir(k => k.h == null ? null : k.h) };
}
function interpolerRepere(keyframes, t) {
  if (!keyframes.length) return { x: 0, y: 0, w: null, h: null };
  const tries = [...keyframes].sort((a, c) => (a.t||0) - (c.t||0));
  const { ws, hs } = remplirDimensions(tries);
  if (t <= (tries[0].t||0)) return { x: tries[0].x||0, y: tries[0].y||0, w: ws[0], h: hs[0] };
  const dernierIdx = tries.length - 1;
  if (t >= (tries[dernierIdx].t||0)) return { x: tries[dernierIdx].x||0, y: tries[dernierIdx].y||0, w: ws[dernierIdx], h: hs[dernierIdx] };
  for (let i = 0; i < tries.length - 1; i++) {
    const a = tries[i], b2 = tries[i+1];
    if (t >= (a.t||0) && t <= (b2.t||0)) {
      const span = (b2.t||0) - (a.t||0) || 1;
      const f = (t - (a.t||0)) / span;
      const mix = (av, bv) => Math.round((av||0) + ((bv||0) - (av||0)) * f);
      const mixDim = (av, bv) => (av == null && bv == null) ? null : Math.round((av==null?0:av) + ((bv==null?0:bv) - (av==null?0:av)) * f);
      return { x: mix(a.x, b2.x), y: mix(a.y, b2.y), w: mixDim(ws[i], ws[i+1]), h: mixDim(hs[i], hs[i+1]) };
    }
  }
  return { x: 0, y: 0, w: null, h: null };
}

// Insère (ou enchaîne après le dernier si un repère existe déjà exactement
// à cet instant) un repère de POSITION sur le bloc `idx`, à la position
// actuelle du curseur -- logique commune au bouton "+" de la piste et au
// raccourci I (qui, comme dans Blender, doit pouvoir en poser autant qu'on
// veut : avant, I ne touchait que le délai d'entrée, une seule valeur, donc
// impossible d'avoir "plusieurs images clés" en le pressant plusieurs fois).
function ajouterRepereDePosition(idx) {
  const b = blocs[idx];
  if (!b.keyframes) b.keyframes = [];
  let t = Math.round(tlPlayhead / 50) * 50;
  // Capture l'état actuellement affiché (interpolé si le curseur est entre
  // deux repères existants) comme point de départ du nouveau repère, avant
  // de calculer son "t" final -- on veut la valeur AU CURSEUR, pas après
  // l'avoir potentiellement décalé pour éviter un doublon.
  const depart = interpolerRepere(b.keyframes, t);
  if (b.keyframes.some(k => k.t === t)) {
    const maxT = Math.max(...b.keyframes.map(k => k.t || 0));
    t = Math.min(TL_ABS_MAX, maxT + 1000);
    while (b.keyframes.some(k => k.t === t) && t < TL_ABS_MAX) t += 1000;
  }
  b.keyframes.push({ t, x: depart.x, y: depart.y, w: depart.w, h: depart.h });
  if (t > tlEnd) {
    tlEnd = Math.min(TL_ABS_MAX, t + 1000);
    const endInput = document.getElementById('tlEndInput');
    if (endInput) endInput.value = tlEnd;
  }
  b.keyframes.sort((a, c) => (a.t||0) - (c.t||0));
  tlSelectedIdx = idx;
  tlSelectedKf = b.keyframes.findIndex(k => k.t === t);
  selectedIdx = idx;
  markDirty();
  // renderBlocsList() (et non renderTimeline() seul) : active tout de suite
  // le glisser-déposer direct du bloc pour ce nouveau repère (classe
  // "editing-kf"), pas seulement le marqueur sur la frise.
  renderBlocsList();
}

function renderTimeline() {
  const tracks = document.getElementById('tlTracks');
  // Le bouton lecture doit fonctionner meme sans aucun bloc anime -- cable
  // en dehors du bloc "liste des pistes" ci-dessous (qui peut etre vide).
  const playBtn = document.getElementById('tlPlayBtn');
  if (playBtn) playBtn.onclick = () => tlTogglePlay(false);
  if (!tracks) return;

  // Toutes les pistes sont affichées (pas seulement celles déjà animées) --
  // c'est ici, via "+", qu'on ajoute le tout premier repère de position
  // d'un bloc ; sans ça il n'y avait aucun moyen d'en créer un.
  const animes = blocs.map((b, i) => ({ b, i }));
  if (!animes.length) {
    tracks.innerHTML = `<div class="hint">Aucun bloc sur la page — ajoutez-en un depuis la palette.</div>`;
    renderTlKfEditor();
    return;
  }
  tracks.innerHTML = animes.map(({ b, i }) => {
    const entryClip = b.animation
      ? `<div class="timeline-clip entry${(tlSelectedIdx===i&&tlSelectedKf===-1)?' selected':''}" data-idx="${i}" data-kf="entry" style="left:calc(${tlPct(b.anim_delai||0)}% - 8px)" title="${b.anim_delai||0} ms"></div>`
      : '';
    const posClips = (b.keyframes||[]).map((k, kf) => `
      <div class="timeline-clip pos${(tlSelectedIdx===i&&tlSelectedKf===kf)?' selected':''}" data-idx="${i}" data-kf="${kf}" style="left:calc(${tlPct(k.t||0)}% - 8px)" title="${k.t||0} ms — x:${k.x||0} y:${k.y||0}"></div>`).join('');
    return `
    <div class="timeline-track">
      <div class="timeline-track-label"><i class="fas fa-${BLOC_ICONES[b.type]||'cube'}"></i> ${escAttr(BLOC_LABELS[b.type]||b.type)}
        <button type="button" class="timeline-track-add" data-idx="${i}" title="Ajouter un repère de position ici"><i class="fas fa-plus"></i></button>
      </div>
      <div class="timeline-track-ruler" data-idx="${i}">${entryClip}${posClips}</div>
    </div>`;
  }).join('');
  applyTlZoomWidth();
  renderTlRulerNumbers();
  const ph = document.getElementById('tlPlayhead');
  if (ph) ph.style.left = `${tlPlayheadLeftPx()}px`;

  tracks.querySelectorAll('.timeline-clip').forEach(clip => {
    clip.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(clip.dataset.idx);
      const kfAttr = clip.dataset.kf;
      const isEntry = kfAttr === 'entry';
      const kf = isEntry ? -1 : Number(kfAttr);
      // Ne PAS appeler selectionnerBloc()/renderBlocsList() ici : ça
      // re-génère #tlTracks (actionsMode oblige) et détache l'élément
      // `clip` qu'on vient de saisir, cassant le glissé en plein milieu
      // (c'était le bug "déplacer une image clé ça bug").
      tlSelectedIdx = idx;
      tlSelectedKf = kf;
      selectedIdx = idx;
      tracks.querySelectorAll('.timeline-clip').forEach(c => c.classList.toggle('selected', c === clip));
      renderTlKfEditor();
      const ruler = clip.parentElement;
      const onMove = (ev) => {
        const rect = ruler.getBoundingClientRect();
        let rel = (ev.clientX - rect.left) / rect.width;
        rel = Math.max(0, Math.min(1, rel));
        const ms = Math.round((tlStart + rel * (tlEnd - tlStart)) / 50) * 50;
        if (isEntry) blocs[idx].anim_delai = ms;
        else blocs[idx].keyframes[kf].t = ms;
        clip.style.left = `calc(${tlPct(ms)}% - 8px)`;
        clip.title = isEntry ? `${ms} ms` : `${ms} ms — x:${blocs[idx].keyframes[kf].x||0} y:${blocs[idx].keyframes[kf].y||0}`;
        markDirty();
        drawTimelineLinks();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (!isEntry) blocs[idx].keyframes.sort((a, b2) => (a.t||0) - (b2.t||0));
        // Sûr ici (on n'est plus en train de glisser SUR la frise) : met à
        // jour le canevas pour activer le glisser-déposer direct du bloc
        // sélectionné (poignée "editing-kf") sur ce repère de position.
        renderBlocsList();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  tracks.querySelectorAll('.timeline-track-add').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      ajouterRepereDePosition(Number(btn.dataset.idx));
    });
  });

  drawTimelineLinks();
  renderTlKfEditor();
}

// Petit éditeur X/Y inline dans l'en-tête de la frise, affiché seulement
// quand un repère de POSITION (pas le délai d'entrée) est sélectionné --
// le panneau de réglages classique est masqué en mode Actions.
function renderTlKfEditor() {
  const el = document.getElementById('tlKfEditor');
  if (!el) return;
  if (tlSelectedIdx < 0 || tlSelectedKf < 0 || !blocs[tlSelectedIdx] || !blocs[tlSelectedIdx].keyframes[tlSelectedKf]) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  const k = blocs[tlSelectedIdx].keyframes[tlSelectedKf];
  el.style.display = 'flex';
  el.innerHTML = `
    <span class="champ-label">Repère</span>
    <span class="tl-kf-editor-lbl">X</span><input type="number" id="tlKfX" value="${k.x||0}" step="10" title="Décalage X (px)">
    <span class="tl-kf-editor-lbl">Y</span><input type="number" id="tlKfY" value="${k.y||0}" step="10" title="Décalage Y (px)">
    <span class="tl-kf-editor-lbl">L</span><input type="number" id="tlKfW" value="${k.w==null?'':k.w}" min="0" step="10" placeholder="auto" title="Largeur (px) -- vide = taille naturelle du bloc, 0 = largeur réellement nulle">
    <span class="tl-kf-editor-lbl">H</span><input type="number" id="tlKfH" value="${k.h==null?'':k.h}" min="0" step="10" placeholder="auto" title="Hauteur (px) -- vide = taille naturelle du bloc, 0 = hauteur réellement nulle">
    <button type="button" class="btn btn-secondary btn-xs" id="tlKfDelBtn"><i class="fas fa-trash"></i></button>`;
  document.getElementById('tlKfX').addEventListener('input', (e) => { k.x = Number(e.target.value) || 0; markDirty(); appliquerApercuKeyframes(); });
  document.getElementById('tlKfY').addEventListener('input', (e) => { k.y = Number(e.target.value) || 0; markDirty(); appliquerApercuKeyframes(); });
  document.getElementById('tlKfW').addEventListener('input', (e) => { const raw = e.target.value.trim(); k.w = raw === '' ? null : Math.max(0, Number(raw) || 0); markDirty(); appliquerApercuKeyframes(); });
  document.getElementById('tlKfH').addEventListener('input', (e) => { const raw = e.target.value.trim(); k.h = raw === '' ? null : Math.max(0, Number(raw) || 0); markDirty(); appliquerApercuKeyframes(); });
  document.getElementById('tlKfDelBtn').addEventListener('click', () => supprimerRepereSelectionne());
}

// Enlève le repère sélectionné dans la frise (Suppr) -- soit le repère
// d'entrée (désanime le bloc), soit un repère de position (retiré du
// tableau keyframes), sans supprimer le bloc lui-même de la page.
function supprimerRepereSelectionne() {
  if (tlSelectedIdx < 0 || !blocs[tlSelectedIdx]) return false;
  if (tlSelectedKf >= 0) {
    const kfs = blocs[tlSelectedIdx].keyframes || [];
    kfs.splice(tlSelectedKf, 1);
  } else {
    blocs[tlSelectedIdx].animation = '';
    blocs[tlSelectedIdx].anim_delai = 0;
  }
  tlSelectedIdx = -1;
  tlSelectedKf = -1;
  markDirty();
  renderTimeline();
  renderBlocsSettings();
  return true;
}

// Le dopesheet de Blender ne relie jamais les images clés par une ligne --
// chaque objet a sa propre piste de losanges, point final. La version
// précédente reliait par erreur les repères de blocs DIFFÉRENTS entre eux
// (zigzag diagonal illisible entre les pistes) : on se contente de retirer
// le tracé précédent, sans le remplacer.
function drawTimelineLinks() {
  const wrap = document.getElementById('tlTracks');
  if (!wrap) return;
  wrap.querySelector('svg.tl-links')?.remove();
}

// % de position dans la plage [tlStart, tlEnd] visible sur la règle.
function tlPct(ms) {
  const span = tlEnd - tlStart || 1;
  return (ms - tlStart) / span * 100;
}

// Le curseur (#tlPlayhead) vit maintenant hors de .timeline-ruler-wrap (pour
// s'étendre visuellement jusqu'en bas des pistes, voir #10) -- sa position
// s'exprime donc en pixels absolus (marge de 160px pour la colonne
// d'étiquettes + position dans la règle elle-même), pas en % de ce wrap.
function tlPlayheadLeftPx() {
  return 160 + (tlPct(tlPlayhead) / 100) * (TL_BASE_PX * tlZoomLevel);
}
function tlSetPlayhead(ms) {
  tlPlayhead = Math.max(tlStart, Math.min(tlEnd, ms));
  const ph = document.getElementById('tlPlayhead');
  if (ph) ph.style.left = `${tlPlayheadLeftPx()}px`;
  const f = document.getElementById('tlFrameInput');
  if (f && document.activeElement !== f) f.value = Math.round(tlPlayhead);
  appliquerApercuKeyframes();
}

// Aperçu en direct dans le canevas : comme dans Blender où l'objet bouge
// réellement dans la vue 3D quand on déplace le curseur, chaque bloc ayant
// des repères de position/déformation doit visuellement suivre le curseur
// de la frise -- avant, seule la page publiée montrait le mouvement, le
// canevas de l'éditeur restait figé sur la forme/position statique du bloc.
// ── Modes de positionnement des blocs libres : Libre / Grille / Guides ──
function definirPosMode(m) {
  posMode = m;
  localStorage.setItem('sitecPosMode', m);
  effacerGuides();
  appliquerPosModeUi();
}
// Zoom du canevas (molette + Ctrl/Cmd, ou boutons) -- purement visuel, les
// données (pos_x/pos_y/largeur/...) restent dans le repère "réel" (zoom
// 1) : voir les divisions par `canvasZoom` dans demarrerRedimLibre et les
// poignées de glissement, qui convertissent le déplacement souris (en
// pixels ÉCRAN) vers ce repère réel.
// Glisser une zone VIDE du canevas (pas un bloc) = se déplacer dans
// l'espace de travail -- la molette servant désormais au zoom, c'est le
// seul moyen de naviguer au clavier/souris sans passer par les barres de
// défilement.
function wireCanvasPan() {
  const wrap = document.querySelector('.blocs-canvas-wrap');
  if (!wrap) return;
  wrap.onmousedown = (e) => {
    if (e.target.closest('.bloc-item') || e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startScrollLeft = wrap.scrollLeft, startScrollTop = wrap.scrollTop;
    wrap.classList.add('panning');
    const onMove = (ev) => {
      wrap.scrollLeft = startScrollLeft - (ev.clientX - startX);
      wrap.scrollTop = startScrollTop - (ev.clientY - startY);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      wrap.classList.remove('panning');
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };
}
// `focal` (optionnel) = point écran {x,y} relatif au coin haut-gauche du
// canevas visible à garder immobile pendant le zoom (position du curseur
// pour la molette) -- sans lui, le zoom partirait toujours du coin
// haut-gauche du contenu (transform-origin:0 0) au lieu de rester centré
// sur ce qu'on regarde déjà : on compense en ajustant le défilement.
function definirCanvasZoom(z, focal) {
  const wrap = document.querySelector('.blocs-canvas-wrap');
  const oldZoom = canvasZoom;
  canvasZoom = Math.max(0.25, Math.min(2, Math.round(z * 100) / 100));
  const el = document.getElementById('blocsListZoom');
  if (el) el.style.transform = `scale(${canvasZoom})`;
  const lbl = document.getElementById('canvasZoomLabel');
  if (lbl) lbl.textContent = `${Math.round(canvasZoom * 100)}%`;
  if (wrap && oldZoom !== canvasZoom) {
    const fx = focal ? focal.x : wrap.clientWidth / 2;
    const fy = focal ? focal.y : wrap.clientHeight / 2;
    // CANVAS_OFFSET (marge de .blocs-list-zoom) n'est PAS mis à l'échelle
    // par le zoom (transform:scale porte seulement sur le contenu) -- il
    // faut le soustraire avant de diviser par l'ancien zoom, sinon le calcul
    // mélange une distance fixe et une distance mise à l'échelle, ce qui
    // fait sauter la vue de façon erratique à chaque zoom/dézoom (surtout
    // visible en dehors de 100%, où l'écart entre les deux devient net).
    const contentX = (wrap.scrollLeft + fx - CANVAS_OFFSET) / oldZoom;
    const contentY = (wrap.scrollTop + fy - CANVAS_OFFSET) / oldZoom;
    wrap.scrollLeft = contentX * canvasZoom + CANVAS_OFFSET - fx;
    wrap.scrollTop = contentY * canvasZoom + CANVAS_OFFSET - fy;
  }
  if ((oldZoom === 1) !== (canvasZoom === 1)) renderBlocsList(); // rectangle de page : masqué/affiché selon le zoom
}
function appliquerPosModeUi() {
  const bLibre = document.getElementById('posModeLibre');
  const bGrille = document.getElementById('posModeGrille');
  const bGuides = document.getElementById('posModeGuides');
  if (bLibre) bLibre.classList.toggle('active', posMode === 'libre');
  if (bGrille) bGrille.classList.toggle('active', posMode === 'grille');
  if (bGuides) bGuides.classList.toggle('active', posMode === 'guides');
  const listEl = document.getElementById('blocsList');
  if (listEl) listEl.classList.toggle('pos-mode-grille', posMode === 'grille');
}
// Calcule, pour le bloc idx en cours de glissement (largeur w, hauteur h,
// à la position brute x/y), la position alignée sur les bords/centres des
// autres blocs libres (et le centre du canevas) -- comme les guides
// magenta de PowerPoint -- et dessine les lignes de guide correspondantes.
function calculerGuides(idx, wEcran, hEcran, listRect, x, y) {
  // x/y/wEcran/hEcran arrivent en unités écran (pixels réels de la souris/
  // getBoundingClientRect) -- tout est ramené au repère "réel" (zoom 1, le
  // même que pos_x/pos_y) en divisant par canvasZoom, pour que
  // l'alignement reste précis quel que soit le niveau de zoom du canevas.
  const w = wEcran / canvasZoom, h = hEcran / canvasZoom;
  // Bords + centre de la "Zone de la page publiée" -- pas seulement le
  // centre du canevas -- pour pouvoir aligner un bloc sur les marges
  // gauche/droite réelles de la page, pas seulement au milieu.
  const listWReel = listRect.width / canvasZoom;
  const pageLeft = (listWReel - pageWidth) / 2;
  const pageRight = pageLeft + pageWidth;
  const targetsX = [listWReel / 2, pageLeft, pageRight];
  const targetsY = [0];
  blocs.forEach((b2, idx2) => {
    if (idx2 === idx || !b2.libre) return;
    const el2 = document.querySelector(`.bloc-item[data-idx="${idx2}"]`);
    if (!el2) return;
    const r2 = el2.getBoundingClientRect();
    const left2 = (r2.left - listRect.left) / canvasZoom, top2 = (r2.top - listRect.top) / canvasZoom;
    const w2 = r2.width / canvasZoom, h2 = r2.height / canvasZoom;
    targetsX.push(left2, left2 + w2 / 2, left2 + w2);
    targetsY.push(top2, top2 + h2 / 2, top2 + h2);
  });
  const mineX = [x, x + w / 2, x + w];
  const mineY = [y, y + h / 2, y + h];
  let bestX = null, bestY = null;
  mineX.forEach((mx, edge) => {
    targetsX.forEach(tx => {
      const d = Math.abs(mx - tx);
      if (d <= POS_SNAP_SEUIL && (!bestX || d < bestX.d)) bestX = { d, target: tx, edge };
    });
  });
  mineY.forEach((my, edge) => {
    targetsY.forEach(ty => {
      const d = Math.abs(my - ty);
      if (d <= POS_SNAP_SEUIL && (!bestY || d < bestY.d)) bestY = { d, target: ty, edge };
    });
  });
  const decale = (best, taille) => best.edge === 0 ? best.target : best.edge === 1 ? best.target - taille / 2 : best.target - taille;
  const nx = bestX ? Math.round(decale(bestX, w)) : x;
  const ny = bestY ? Math.round(decale(bestY, h)) : y;
  dessinerGuides(bestX ? bestX.target : null, bestY ? bestY.target : null);
  return { x: nx, y: ny };
}
function dessinerGuides(vx, hy) {
  effacerGuides();
  const listEl = document.getElementById('blocsList');
  if (!listEl) return;
  if (vx !== null && vx !== undefined) {
    const g = document.createElement('div');
    g.className = 'align-guide-v'; g.id = 'alignGuideV'; g.style.left = `${vx}px`;
    listEl.appendChild(g);
  }
  if (hy !== null && hy !== undefined) {
    const g = document.createElement('div');
    g.className = 'align-guide-h'; g.id = 'alignGuideH'; g.style.top = `${hy}px`;
    listEl.appendChild(g);
  }
}
function effacerGuides() {
  const v = document.getElementById('alignGuideV'); if (v) v.remove();
  const h = document.getElementById('alignGuideH'); if (h) h.remove();
}

// Redimensionnement unifié des blocs libres (largeur/hauteur/position),
// utilisé par les 4 poignées de bord ET les 4 poignées de coin -- un seul
// bord actif ({right:true}) = ne change qu'une dimension en gardant le
// bord opposé fixe ; deux bords actifs (coin, ex: {right:true,bottom:true})
// = "déformation" (largeur+hauteur ensemble).
// Modificateurs : Alt = redimensionne depuis le CENTRE (les deux bords
// opposés bougent en symétrie) ; Maj = garde le ratio largeur/hauteur
// d'origine (uniquement quand un coin -- donc largeur ET hauteur -- est
// actif).
// Déplacement d'un bloc libre (glisser = pos_x/pos_y n'importe où sur le
// canevas) -- partagé par la poignée dédiée (icône "déplacer") ET
// l'en-tête entier du bloc, pour pouvoir l'attraper n'importe où dessus
// plutôt que seulement sur une petite icône facile à manquer.
// Glisser l'en-tête de n'importe quel bloc (pas seulement ceux déjà en
// "position libre") le déplace librement -- convertit le bloc en position
// libre au premier VRAI mouvement (seuil anti-clic de 3px, pour qu'un
// simple clic de sélection ne convertisse pas le bloc par erreur), en
// gardant sa position actuelle comme point de départ.
function demarrerDeplacementBloc(e, idx, item) {
  const b = blocs[idx];
  if (b.libre) { demarrerDeplacementLibre(e, idx, item); return; }
  const startX = e.clientX, startY = e.clientY;
  const onFirstMove = (ev) => {
    if (Math.abs(ev.clientX - startX) < 3 && Math.abs(ev.clientY - startY) < 3) return;
    document.removeEventListener('mousemove', onFirstMove);
    document.removeEventListener('mouseup', onNoMove);
    const listRect = document.getElementById('blocsList').getBoundingClientRect();
    const r = item.getBoundingClientRect();
    b.libre = true;
    b.pos_x = Math.round((r.left - listRect.left) / canvasZoom);
    b.pos_y = Math.round((r.top - listRect.top) / canvasZoom);
    b.ligne = ''; b.decalage = 0;
    renderBlocsList();
    const newItem = document.querySelector(`.bloc-item[data-idx="${idx}"]`);
    if (newItem) demarrerDeplacementLibre(e, idx, newItem);
  };
  const onNoMove = () => {
    document.removeEventListener('mousemove', onFirstMove);
    document.removeEventListener('mouseup', onNoMove);
  };
  document.addEventListener('mousemove', onFirstMove);
  document.addEventListener('mouseup', onNoMove);
}
function demarrerDeplacementLibre(e, idx, item) {
  e.preventDefault();
  e.stopPropagation();
  const listEl = document.getElementById('blocsList');
  const startX = e.clientX, startY = e.clientY;
  const startLeft = blocs[idx].pos_x || 0, startTop = blocs[idx].pos_y || 0;
  const itemRect0 = item.getBoundingClientRect();
  const w = itemRect0.width, h = itemRect0.height;
  // Sélection multiple (Maj+clic) : les autres blocs libres sélectionnés
  // suivent le même déplacement brut (sans grille/guides, qui ne
  // s'appliquent qu'au bloc réellement glissé).
  const groupe = (multiSelectedIndices.has(idx) && multiSelectedIndices.size > 1)
    ? [...multiSelectedIndices].filter(i => i !== idx && blocs[i] && blocs[i].libre).map(i => ({
        idx: i,
        startX: blocs[i].pos_x || 0,
        startY: blocs[i].pos_y || 0,
        el: document.querySelector(`.bloc-item[data-idx="${i}"]`),
      }))
    : [];
  let moved = false;
  const onMove = (ev) => {
    moved = true;
    let x = Math.max(-2000, Math.min(8000, Math.round(startLeft + (ev.clientX - startX) / canvasZoom)));
    let y = Math.max(-2000, Math.min(20000, Math.round(startTop + (ev.clientY - startY) / canvasZoom)));
    // Alt = ignore temporairement la grille/les guides pour ce glisser --
    // pouvoir bouger librement sans changer de mode.
    if (ev.altKey) {
      effacerGuides();
    } else if (posMode === 'grille') {
      x = Math.round(x / POS_GRID) * POS_GRID;
      y = Math.round(y / POS_GRID) * POS_GRID;
      effacerGuides();
    } else if (posMode === 'guides') {
      const listRect = listEl.getBoundingClientRect();
      const snap = calculerGuides(idx, w, h, listRect, x, y);
      x = snap.x; y = snap.y;
    } else {
      effacerGuides();
    }
    blocs[idx].pos_x = x;
    blocs[idx].pos_y = y;
    item.style.left = `${x}px`;
    item.style.top = `${y}px`;
    const netDx = x - startLeft, netDy = y - startTop;
    groupe.forEach(g => {
      const gx = g.startX + netDx, gy = g.startY + netDy;
      blocs[g.idx].pos_x = gx;
      blocs[g.idx].pos_y = gy;
      if (g.el) { g.el.style.left = `${gx}px`; g.el.style.top = `${gy}px`; }
    });
    markDirty();
    if (selectedIdx === idx) {
      const ex = document.getElementById('setPosX'); if (ex) ex.value = x;
      const ey = document.getElementById('setPosY'); if (ey) ey.value = y;
    }
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    effacerGuides();
    // Redimensionne le canevas si besoin (le bloc a peut-être fini plus bas).
    listEl.style.minHeight = `${Math.max(60, Math.max(...blocs.filter(b => b.libre).map(b => (b.pos_y||0) + (b.hauteur||80)), 60))}px`;
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function demarrerRedimLibre(e, idx, item, edges) {
  e.preventDefault();
  e.stopPropagation();
  const b = blocs[idx];
  // Repère "réel" (zoom 1, le même que pos_x/pos_y/largeur) -- toutes les
  // mesures écran (getBoundingClientRect, delta souris) sont ramenées à ce
  // repère en divisant par canvasZoom, pour que le redimensionnement reste
  // précis quel que soit le niveau de zoom du canevas.
  const refWidth = document.getElementById('blocsList').getBoundingClientRect().width / canvasZoom;
  const startX = e.clientX, startY = e.clientY;
  const startLeft = b.pos_x || 0;
  const startTop = b.pos_y || 0;
  const startWidthPx = (b.largeur || 100) / 100 * refWidth;
  const startHeightPx = (item.getBoundingClientRect().height || 40) / canvasZoom;
  const aspect = startWidthPx / startHeightPx;
  const estCoin = (edges.left || edges.right) && (edges.top || edges.bottom);
  const onMove = (ev) => {
    const dx = (ev.clientX - startX) / canvasZoom, dy = (ev.clientY - startY) / canvasZoom;
    const alt = ev.altKey, shift = ev.shiftKey;
    let leftPx = startLeft, rightPx = startLeft + startWidthPx;
    let topPx = startTop, bottomPx = startTop + startHeightPx;
    if (edges.right) { rightPx = startLeft + startWidthPx + dx; if (alt) leftPx = startLeft - dx; }
    if (edges.left) { leftPx = startLeft + dx; if (alt) rightPx = (startLeft + startWidthPx) - dx; }
    if (edges.bottom) { bottomPx = startTop + startHeightPx + dy; if (alt) topPx = startTop - dy; }
    if (edges.top) { topPx = startTop + dy; if (alt) bottomPx = (startTop + startHeightPx) - dy; }
    if (rightPx - leftPx < 20) { if (edges.left) leftPx = rightPx - 20; else rightPx = leftPx + 20; }
    if (bottomPx - topPx < 20) { if (edges.top) topPx = bottomPx - 20; else bottomPx = topPx + 20; }
    let widthPx = rightPx - leftPx, heightPx = bottomPx - topPx;
    if (shift && estCoin) {
      const wRatio = widthPx / startWidthPx, hRatio = heightPx / startHeightPx;
      if (Math.abs(wRatio - 1) >= Math.abs(hRatio - 1)) {
        heightPx = widthPx / aspect;
        if (edges.top) topPx = bottomPx - heightPx; else bottomPx = topPx + heightPx;
      } else {
        widthPx = heightPx * aspect;
        if (edges.left) leftPx = rightPx - widthPx; else rightPx = leftPx + widthPx;
      }
    }
    const largeurPct = Math.max(5, Math.min(100, Math.round(widthPx / refWidth * 100)));
    b.largeur = largeurPct;
    b.hauteur = Math.max(10, Math.round(heightPx));
    b.pos_x = Math.round(leftPx);
    b.pos_y = Math.round(topPx);
    item.style.width = `${largeurPct}%`;
    item.style.minHeight = `${b.hauteur}px`;
    item.style.left = `${b.pos_x}px`;
    item.style.top = `${b.pos_y}px`;
    markDirty();
    if (selectedIdx === idx) {
      const elL = document.getElementById('setLargeur'); if (elL) elL.value = largeurPct;
      const elH = document.getElementById('setHauteur'); if (elH) elH.value = b.hauteur;
      const elX = document.getElementById('setPosX'); if (elX) elX.value = b.pos_x;
      const elY = document.getElementById('setPosY'); if (elY) elY.value = b.pos_y;
    }
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function appliquerApercuKeyframes() {
  if (!actionsMode) return;
  blocs.forEach((b, idx) => {
    if (!b.keyframes || b.keyframes.length < 1) return;
    const el = document.querySelector(`#blocsList > .bloc-item[data-idx="${idx}"], #blocsList .blocs-row > .bloc-item[data-idx="${idx}"]`);
    if (!el) return;
    const v = interpolerRepere(b.keyframes, tlPlayhead);
    el.style.transform = `${b.rotation ? `rotate(${b.rotation}deg) ` : ''}translate(${v.x}px,${v.y}px)`;
    // v.w/h === null = ce repère ne fixe pas la dimension (taille naturelle
    // du bloc) -- distinct de 0 (largeur/hauteur réellement nulle, ex: un
    // bloc qui se réduit à rien pour "disparaître"). Dans le cas null, on
    // restaure le style statique normal du bloc (celui posé par cardHtml)
    // plutôt que de le laisser figé sur la dernière valeur appliquée.
    const largeur = b.largeur || 100;
    if (v.w != null) { el.style.width = `${v.w}px`; el.style.flex = 'none'; el.style.maxWidth = 'none'; }
    else if (b.ligne) { el.style.width = ''; el.style.flex = `0 0 ${largeur}%`; el.style.maxWidth = `${largeur}%`; }
    else { el.style.width = `${largeur}%`; el.style.flex = ''; el.style.maxWidth = ''; }
    if (v.h != null) { el.style.minHeight = `${v.h}px`; }
    else { el.style.minHeight = b.hauteur ? `${b.hauteur}px` : ''; }
  });
}

// Chiffres au-dessus de la règle (comme la règle d'images de Blender) --
// graduations à un pas "rond" (10, 50, 100, 500, 1000ms…) choisi selon le
// zoom, plutôt qu'un nombre fixe de graduations réparties uniformément.
const TL_PALIERS = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000];
function renderTlRulerNumbers() {
  const el = document.getElementById('tlRulerNumbers');
  if (!el) return;
  const span = tlEnd - tlStart || 1;
  const pasApprox = span / 10;
  const pas = TL_PALIERS.find(p => p >= pasApprox) || TL_PALIERS[TL_PALIERS.length - 1];
  let html = '';
  for (let ms = Math.ceil(tlStart / pas) * pas; ms <= tlEnd; ms += pas) {
    html += `<span style="left:${(ms - tlStart) / span * 100}%">${ms}</span>`;
  }
  el.innerHTML = html;
  el.style.width = document.getElementById('tlRulerWrap')?.style.width || '';
}

// dir=false -> lecture avant depuis la position actuelle du curseur ;
// dir=true -> lecture arrière (rembobinage) jusqu'à Début.
function tlTogglePlay(dir = false) {
  const btnFwd = document.getElementById('tlPlayBtn');
  const btnBack = document.getElementById('tlPlayBackBtn');
  if (tlPlaying) {
    tlPlaying = false;
    if (btnFwd) btnFwd.innerHTML = '<i class="fas fa-play"></i>';
    if (btnBack) btnBack.classList.remove('active');
    return;
  }
  tlPlaying = true;
  const reverse = !!dir;
  // Un seul bouton pause visible pendant la lecture, qu'elle soit avant ou
  // arrière (avant : le bouton principal remontrait "play" pendant une
  // lecture arrière en cours, ambigu -- "2 boutons play" plutôt qu'un
  // vrai bouton pause unique). Le bouton "lecture arrière" reste surligné
  // (.active) pour indiquer le sens en cours.
  if (btnFwd) btnFwd.innerHTML = '<i class="fas fa-pause"></i>';
  if (btnBack) btnBack.classList.toggle('active', reverse);
  const start = performance.now();
  const startPlayhead = tlPlayhead;
  function tick(now) {
    if (!tlPlaying) return;
    const elapsed = now - start;
    const ms = reverse ? startPlayhead - elapsed : startPlayhead + elapsed;
    if (ms <= tlStart) { tlSetPlayhead(tlStart); tlTogglePlay(); return; }
    if (ms >= tlEnd) { tlSetPlayhead(tlEnd); tlTogglePlay(); return; }
    tlSetPlayhead(ms);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Repère précédent/suivant (délais d'entrée + repères de position), et bornes Début/Fin.
function tlJumpToKeyframe(dir) {
  const delais = [
    ...blocs.filter(b => b.animation).map(b => b.anim_delai || 0),
    ...blocs.flatMap(b => (b.keyframes||[]).map(k => k.t || 0)),
  ];
  if (!delais.length) return;
  if (dir < 0) {
    const prev = delais.filter(d => d < tlPlayhead);
    tlSetPlayhead(prev.length ? Math.max(...prev) : tlStart);
  } else {
    const next = delais.filter(d => d > tlPlayhead);
    tlSetPlayhead(next.length ? Math.min(...next) : tlEnd);
  }
}

function tlSetRange(start, end) {
  tlStart = Math.max(0, Math.min(start, end - 100));
  tlEnd = Math.max(tlStart + 100, Math.min(TL_ABS_MAX, end));
  tlSetPlayhead(tlPlayhead);
  renderTimeline();
}

// "G" façon Blender (Grab) : la souris déplace le repère sans garder le
// bouton enfoncé -- clic ou Entrée confirme, Échap annule et restaure la
// position d'origine.
function tlStartGrab() {
  if (tlSelectedIdx < 0 || tlGrabbing) return;
  const idx = tlSelectedIdx;
  const kf = tlSelectedKf;
  const isEntry = kf < 0;
  const kfAttr = isEntry ? 'entry' : kf;
  const clip = document.querySelector(`.timeline-clip[data-idx="${idx}"][data-kf="${kfAttr}"]`);
  const ruler = clip ? clip.parentElement : null;
  if (!clip || !ruler) return;
  tlGrabbing = true;
  const origVal = isEntry ? (blocs[idx].anim_delai || 0) : (blocs[idx].keyframes[kf].t || 0);
  const onMove = (ev) => {
    const rect = ruler.getBoundingClientRect();
    let rel = (ev.clientX - rect.left) / rect.width;
    rel = Math.max(0, Math.min(1, rel));
    const ms = Math.round((tlStart + rel * (tlEnd - tlStart)) / 50) * 50;
    if (isEntry) blocs[idx].anim_delai = ms; else blocs[idx].keyframes[kf].t = ms;
    clip.style.left = `calc(${tlPct(ms)}% - 8px)`;
    clip.title = isEntry ? `${ms} ms` : `${ms} ms — x:${blocs[idx].keyframes[kf].x||0} y:${blocs[idx].keyframes[kf].y||0}`;
    drawTimelineLinks();
  };
  const finish = (cancel) => {
    tlGrabbing = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mousedown', onClickConfirm, true);
    document.removeEventListener('keydown', onKey, true);
    if (cancel) { if (isEntry) blocs[idx].anim_delai = origVal; else blocs[idx].keyframes[kf].t = origVal; }
    else if (!isEntry) blocs[idx].keyframes.sort((a, b2) => (a.t||0) - (b2.t||0));
    markDirty();
    renderTimeline();
  };
  const onClickConfirm = (ev) => { ev.preventDefault(); ev.stopPropagation(); finish(false); };
  const onKey = (ev) => {
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); finish(true); }
    else if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); finish(false); }
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mousedown', onClickConfirm, true);
  document.addEventListener('keydown', onKey, true);
}

function markDirty() { dirty = true; }

// ── Sauvegarde / suppression ───────────────────────────────────────
async function savePage(mode) {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  const publicToggle = document.getElementById('publicToggle');
  const payload = {
    id: current.id,
    titre: document.getElementById('titreInput').value.trim() || I18N.SANS_TITRE,
    mode,
    public: publicToggle ? publicToggle.checked : !!current.public,
    contenu_titre: document.getElementById('contenuTitreInput')?.value || '',
    // En mode "blocs", ce champ (inutilisé pour le texte) porte la largeur
    // de page (rectangle repère) et la fin de frise réglées dans l'éditeur,
    // au format "LARGEURxFIN" -- voir parsePageMeta au chargement.
    contenu_corps: mode === 'blocs' ? `${pageWidth}x${tlEnd}x${pageHeight}` : (document.getElementById('contenuCorpsInput')?.value || ''),
    contenu_html:  document.getElementById('contenuHtmlInput')?.value || '',
    contenu_blocs: blocs,
  };
  try {
    const r = await apiFetch(`${API}/save`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    const data = await r.json();
    if (data.success) {
      dirty = false;
      toast(I18N.PAGE_ENREGISTREE, 'ok');
      await loadPages();
    } else {
      toast(data.error || I18N.ERREUR, 'err');
    }
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR_ENREGISTREMENT, 'err'); }
  finally { btn.disabled = false; }
}

async function deletePage(id) {
  if (!confirm(I18N.CONFIRM_SUPPRIMER_PAGE)) return;
  try {
    await apiFetch(`${API}/delete`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id})
    });
    current = null; dirty = false;
    document.getElementById('main').innerHTML = `
      <div class="empty-state">
        <img class="ico ico-lg ico-muted" src="${ICO}globe.svg">
        <p>${I18N.SELECTIONNEZ_OU_CREEZ}</p>
      </div>`;
    await loadPages();
    toast(I18N.PAGE_SUPPRIMEE, 'ok');
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR_SUPPRESSION, 'err'); }
}

// ── Partage ─────────────────────────────────────────────────────────
async function addShare(id) {
  const input = document.getElementById('shareEmailInput');
  const email = input.value.trim();
  if (!email) return;
  try {
    const r = await apiFetch(`${API}/share`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, email, action:'add'})
    });
    const data = await r.json();
    if (data.success) { input.value=''; await openPage(id); toast(I18N.ACCES_ACCORDE, 'ok'); }
    else toast(data.error || I18N.ERREUR, 'err');
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR, 'err'); }
}

async function removeShare(id, email) {
  try {
    const r = await apiFetch(`${API}/share`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, email, action:'remove'})
    });
    const data = await r.json();
    if (data.success) { await openPage(id); toast(I18N.ACCES_RETIRE, 'ok'); }
    else toast(data.error || I18N.ERREUR, 'err');

// ── Helpers ───────────────────────────────────────────────────────
function toast(msg, type='', dur=3000) {
  const icons = {ok:'circle-check', err:'circle-xmark'};
  const area = document.getElementById('toast-area');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<img class="ico ico-sm" src="${ICO}${icons[type]||'circle-info'}.svg"><span>${esc(msg)}</span>`;
  area.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>area.removeChild(el),300); }, dur);
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return esc(s).replace(/"/g,'&quot;');
}

// ── Raccourcis clavier (actifs uniquement dans l'éditeur de blocs plein écran) ──
document.addEventListener('keydown', (e) => {
  if (!blocsFullView) return;
  if (tlGrabbing) return; // le mode "G" gère lui-même Échap/Entrée/clic
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    savePage('blocs');
    return;
  }
  // Ctrl/Cmd+C et Ctrl/Cmd+V : copier/coller le bloc sélectionné -- sans
  // interférer avec le copier/coller natif d'un champ texte en cours
  // d'édition (typing).
  if (!typing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && selectedIdx >= 0) {
    e.preventDefault();
    blocClipboard = JSON.parse(JSON.stringify(blocs[selectedIdx]));
    toast(I18N.BLOC_COPIE || 'Bloc copié', 'ok');
    return;
  }
  if (!typing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v' && blocClipboard) {
    e.preventDefault();
    const copie = JSON.parse(JSON.stringify(blocClipboard));
    const at = selectedIdx >= 0 ? selectedIdx + 1 : blocs.length;
    blocs.splice(at, 0, copie);
    selectedIdx = at;
    markDirty(); renderBlocsList(); renderBlocsSettings();
    return;
  }
  if (actionsMode && !typing) {
    if (e.code === 'Space') { e.preventDefault(); tlTogglePlay(); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); tlSetPlayhead(tlPlayhead - 100); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); tlSetPlayhead(tlPlayhead + 100); return; }
    // "I" façon Blender (Insert Keyframe) : pose un repère de POSITION sur
    // le bloc sélectionné à l'instant courant -- exactement comme le bouton
    // "+" de sa piste, pour qu'on puisse en poser autant qu'on veut en
    // avançant le curseur et en repressant I (avant, I ne gérait que le
    // délai d'entrée, une seule valeur : impossible d'en avoir plusieurs).
    if ((e.key === 'i' || e.key === 'I') && selectedIdx >= 0) {
      e.preventDefault();
      ajouterRepereDePosition(selectedIdx);
      renderBlocsSettings();
      return;
    }
    // "G" façon Blender (Grab) : déplace le repère sélectionné en suivant
    // la souris jusqu'à clic/Entrée (confirme) ou Échap (annule).
    if ((e.key === 'g' || e.key === 'G') && tlSelectedIdx >= 0) {
      e.preventDefault();
      tlStartGrab();
      return;
    }
    // Suppr/Retour arrière sur un repère sélectionné dans la frise = on
    // l'enlève de la frise (priorité sur la suppression du bloc entier).
    if ((e.key === 'Delete' || e.key === 'Backspace') && tlSelectedIdx >= 0) {
      e.preventDefault();
      supprimerRepereSelectionne();
      return;
    }
  }
  if (typing) return;
  if (e.key === 'Escape') { selectedIdx = -1; multiSelectedIndices.clear(); renderBlocsList(); renderBlocsSettings(); return; }
  if (selectedIdx < 0) return;
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    blocs.splice(selectedIdx, 1);
    selectedIdx = -1;
    multiSelectedIndices.clear();
    markDirty(); renderBlocsList(); renderBlocsSettings();
  } else if (e.altKey && e.key === 'ArrowUp' && selectedIdx > 0) {
    e.preventDefault();
    [blocs[selectedIdx-1], blocs[selectedIdx]] = [blocs[selectedIdx], blocs[selectedIdx-1]];
    selectedIdx--; markDirty(); renderBlocsList(); renderBlocsSettings();
  } else if (e.altKey && e.key === 'ArrowDown' && selectedIdx < blocs.length-1) {
    e.preventDefault();
    [blocs[selectedIdx+1], blocs[selectedIdx]] = [blocs[selectedIdx], blocs[selectedIdx+1]];
    selectedIdx++; markDirty(); renderBlocsList(); renderBlocsSettings();
  }
});

// Réamorce la session de chiffrement ExoDrive (même pattern que fchier.html)
// à partir des valeurs posées en sessionStorage au login -- nécessaire pour
// déchiffrer côté client un fichier importé depuis "Mes fichiers" (voir
// importerFichier) : le serveur ne détient jamais la clé, chiffrement de
// bout en bout.
function initCryptoSession() {
  try {
    if (!window.VEX) throw new Error('module crypto absent');
    const mdp = sessionStorage.getItem('vex_mdp');
    const hash = sessionStorage.getItem('vex_hash');
    const email = sessionStorage.getItem('vex_email');
    if (!mdp || !hash || !email) throw new Error('session crypto incomplète');
    VEX.setSession(mdp, hash, email);
    return VEX.isConnected();
  } catch (e) {
    console.warn('VEX : session crypto indisponible :', e);
    return false;
  }
}

// ── Bootstrap ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  initCryptoSession();
  await initUI();
  await loadPages();
  document.getElementById('createBtn').onclick = createPage;

  // Ouvre automatiquement la page ciblée par ?open=ID (lien depuis fchier),
  // et l'éditeur de blocs plein écran si l'URL le précise (&blocs=1) --
  // permet un vrai lien/retour/rafraîchissement vers cet écran dédié.
  const params = new URLSearchParams(window.location.search);
  const openId = params.get('open');
  if (openId) {
    await openPage(openId);
    if (params.get('blocs') === '1' && current) { blocsFullView = true; renderEditor(); }
  }

  window.addEventListener('popstate', async () => {
    const p2 = new URLSearchParams(window.location.search);
    const id2 = p2.get('open');
    if (!id2) {
      current = null; blocsFullView = false; actionsMode = false;
      const sidebarEl = document.querySelector('.sidebar');
      if (sidebarEl) sidebarEl.style.display = '';
      renderList();
      document.getElementById('main').innerHTML = `
        <div class="empty-state">
          <img class="ico ico-lg ico-muted" src="${ICO}globe.svg">
          <p>${I18N.SELECTIONNEZ_OU_CREEZ}</p>
        </div>`;
      return;
    }
    if (!current || current.id !== id2) await openPage(id2);
    blocsFullView = p2.get('blocs') === '1';
    if (!blocsFullView) actionsMode = false;
    renderEditor();
  });
});
</script>
