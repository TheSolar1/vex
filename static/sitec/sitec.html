// Dépose sur une zone vide du canevas (pas sur un bloc existant) : nouveau
// bloc depuis la palette, ou bloc existant renvoyé en fin de page. Câblée
// systématiquement (canevas vide ou non) -- voir les deux appels dans
// renderBlocsList().
function wireCanvasEmptyDrop(list) {
  list.ondragover = (e) => { if (!e.target.closest('.bloc-item')) e.preventDefault(); };
  list.ondrop = (e) => {
    if (e.target.closest('.bloc-item')) return;
    e.preventDefault();
    if (dragState && dragState.type) {
      ajouterBloc(dragState.type);
    } else if (dragState && dragState.fromIdx !== undefined) {
      const [moved] = blocs.splice(dragState.fromIdx, 1);
      moved.ligne = ''; moved.largeur = 100;
      blocs.push(moved);
      markDirty();
      renderBlocsList();
    }
    dragState = null;
  };
}

// Rectangle repère (largeur de contenu de la page publiée, voir pageWidth)
// -- poignées gauche/droite pour la largeur, préréglages d'appareil, et
// ligne de pli (pageHeight, ce qui est visible sans défiler) glissable.
function pageRectHtml(hauteurContenu) {
  const h = Math.max(pageHeight, hauteurContenu);
  return `<div class="page-boundary-rect" style="width:${pageWidth}px;height:${h}px">
    <span>Zone de la page publiée (${pageWidth}×${pageHeight}px)</span>
    <div class="page-boundary-devices">
      <button type="button" class="pbd-btn${pageWidth===1200&&pageHeight===800?' active':''}" data-device="pc" title="Ordinateur (1200×800)"><i class="fas fa-desktop"></i> PC</button>
      <button type="button" class="pbd-btn${pageWidth===768&&pageHeight===1024?' active':''}" data-device="tablette" title="Tablette (768×1024)"><i class="fas fa-tablet-screen-button"></i> Tablette</button>
      <button type="button" class="pbd-btn${pageWidth===390&&pageHeight===844?' active':''}" data-device="mobile" title="Mobile (390×844)"><i class="fas fa-mobile-screen-button"></i> Mobile</button>
    </div>
    <div class="page-boundary-resize page-boundary-resize-l"></div>
    <div class="page-boundary-resize page-boundary-resize-r"></div>
    <div class="page-fold-line" style="top:${pageHeight}px" title="Le pli -- glisser pour ajuster la hauteur visible sans défiler"></div>
  </div>`;
}
function wirePageRectResize(list) {
  list.querySelectorAll('.page-boundary-resize').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const gauche = handle.classList.contains('page-boundary-resize-l');
      const startX = e.clientX, startW = pageWidth;
      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / canvasZoom;
        // Symétrique (le rectangle reste centré) : glisser un bord de dx
        // change la largeur totale de 2×dx.
        pageWidth = Math.max(320, Math.min(1600, Math.round(startW + (gauche ? -2 * dx : 2 * dx))));
        renderBlocsList();
        markDirty();
      };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
  list.querySelectorAll('.pbd-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const preset = DEVICE_PRESETS[btn.dataset.device];
      if (!preset) return;
      [pageWidth, pageHeight] = preset;
      markDirty();
      renderBlocsList();
    });
  });
  const fold = list.querySelector('.page-fold-line');
  if (fold) {
    fold.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const startY = e.clientY, startH = pageHeight;
      const onMove = (ev) => {
        const dy = (ev.clientY - startY) / canvasZoom;
        pageHeight = Math.max(200, Math.min(4000, Math.round(startH + dy)));
        renderBlocsList();
        markDirty();
      };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }
}

// ── Rendu du canevas : rangées de blocs, sélection, glisser-déposer ────
function renderBlocsList() {
  const list = document.getElementById('blocsList');
  if (!list) return;
  if (!blocs.length) {
    const canvasVisibleH0 = document.querySelector('.blocs-canvas-wrap')?.clientHeight || 400;
    const hauteurRect0 = Math.max(pageHeight, canvasVisibleH0 - 32);
    // Espace de travail panoramique : sans lui (bug corrigé), une page vide
    // n'avait presque aucune zone de défilement autour du rectangle repère
    // -- le calcul de recentrage initial (voir plus bas) pouvait alors
    // demander un défilement hors de la plage réellement disponible, que le
    // navigateur ramène à sa valeur max, montrant une zone vide sans rapport
    // avec le rectangle au lieu de le centrer.
    const espaceTravailHtml0 = `<div class="canvas-espace-travail" style="width:2400px;height:${Math.max(1600, hauteurRect0)}px"></div>`;
    list.innerHTML = espaceTravailHtml0 + pageRectHtml(hauteurRect0) + `<div class="blocs-empty">${I18N.BLOCS_VIDE}</div>`;
    wirePageRectResize(list);
    // Sans ça, glisser un bloc depuis la palette sur un canevas encore vide
    // ne faisait rien : cette poignée n'était câblée que plus bas, dans la
    // branche jamais atteinte tant qu'aucun bloc n'existe déjà.
    wireCanvasEmptyDrop(list);
    return;
  }

  // Regroupe les blocs consécutifs qui partagent "ligne" en rangées visuelles
  // -- les blocs en "position libre" n'y participent pas du tout, ils sont
  // sortis du flux et positionnés en absolu (voir plus bas).
  const flowIdx = blocs.map((b, i) => i).filter(i => !blocs[i].libre);
  const libreIdx = blocs.map((b, i) => i).filter(i => blocs[i].libre);
  const rows = [];
  {
    let k = 0;
    while (k < flowIdx.length) {
      const i = flowIdx[k];
      const ligne = blocs[i].ligne || '';
      if (!ligne) { rows.push([i]); k++; continue; }
      const grp = [i];
      let k2 = k + 1;
      while (k2 < flowIdx.length && (blocs[flowIdx[k2]].ligne || '') === ligne) { grp.push(flowIdx[k2]); k2++; }
      rows.push(grp);
      k = k2;
    }
  }

  const cardHtml = (idx, forceStyle) => {
    const b = blocs[idx];
    let style;
    if (forceStyle) {
      style = ` style="${forceStyle}"`;
    } else if (b.ligne) {
      style = ` style="flex:0 0 ${b.largeur||100}%;max-width:${b.largeur||100}%;${b.hauteur?`min-height:${b.hauteur}px;`:''}"`;
    } else {
      // Bloc seul : "largeur" (si <100) devient une vraie largeur (pas un
      // flex-basis de rangée) + "decalage" un margin-left, pour pouvoir le
      // rétrécir et le déplacer horizontalement même hors d'une rangée.
      const l = b.largeur || 100;
      style = ` style="width:${l}%;margin-left:${b.decalage||0}%;${b.hauteur?`min-height:${b.hauteur}px;`:''}"`;
    }
    const widthHandle = `<div class="bloc-resize-handle" data-idx="${idx}" title="Glisser pour ajuster la largeur"></div>`;
    // Poignées gauche/haut : en plus des poignées droite/bas existantes --
    // redimensionnent en gardant le bord OPPOSÉ fixe (comme dans un éditeur
    // graphique classique), au lieu de ne pouvoir agrandir/rétrécir que
    // vers la droite/le bas.
    const leftHandle = !b.ligne
      ? `<div class="bloc-resize-handle-left" data-idx="${idx}" title="Glisser pour ajuster la largeur (depuis la gauche)"></div>` : '';
    const topHandle = b.libre
      ? `<div class="bloc-height-handle-top" data-idx="${idx}" title="Glisser pour ajuster la hauteur (depuis le haut)"></div>` : '';
    const moveHandle = (!b.libre && !b.ligne && (b.largeur||100) < 100)
      ? `<button type="button" class="bloc-act bloc-move-handle" data-idx="${idx}" title="Glisser pour déplacer horizontalement"><i class="fas fa-up-down-left-right"></i></button>` : '';
    const libreHandle = b.libre
      ? `<button type="button" class="bloc-act bloc-libre-handle" data-idx="${idx}" title="Glisser pour placer où vous voulez"><i class="fas fa-up-down-left-right"></i></button>` : '';
    // Poignées de coin (déformation : largeur+hauteur ensemble) et de
    // rotation -- blocs libres uniquement (seuls eux ont une position/
    // taille réelles, indépendantes du flux normal de la page).
    const cornerHandles = b.libre ? `
      <div class="bloc-corner-handle bloc-corner-tl" data-idx="${idx}" data-corner="tl" title="Glisser pour déformer (largeur + hauteur)"></div>
      <div class="bloc-corner-handle bloc-corner-tr" data-idx="${idx}" data-corner="tr" title="Glisser pour déformer (largeur + hauteur)"></div>
      <div class="bloc-corner-handle bloc-corner-bl" data-idx="${idx}" data-corner="bl" title="Glisser pour déformer (largeur + hauteur)"></div>
      <div class="bloc-corner-handle bloc-corner-br" data-idx="${idx}" data-corner="br" title="Glisser pour déformer (largeur + hauteur)"></div>
    ` : '';
    const rotateHandle = b.libre
      ? `<div class="bloc-rotate-handle" data-idx="${idx}" title="Glisser en cercle pour tourner (Maj = pas de 15°)"><i class="fas fa-rotate"></i></div>` : '';
    const editingKf = actionsMode && tlSelectedIdx === idx && tlSelectedKf >= 0;
    return `<div class="bloc-item${selectedIdx===idx?' selected':''}${b.libre?' libre':''}${editingKf?' editing-kf':''}${multiSelectedIndices.has(idx)?' multi-selected':''}" data-idx="${idx}" draggable="${(b.libre||actionsMode)?'false':'true'}"${style}>
      <div class="bloc-item-hdr">
        <span class="bloc-item-type">
          <i class="fas fa-grip-vertical bloc-drag-handle"></i>
          <i class="fas fa-${BLOC_ICONES[b.type]||'cube'} bloc-type-ico"></i>
          ${escAttr(BLOC_LABELS[b.type]||b.type)}
          ${blocSummary(b) ? `<span class="bloc-item-summary">— ${escAttr(blocSummary(b))}</span>` : ''}
        </span>
        <div class="bloc-item-actions">
          ${libreHandle}${moveHandle}
          <button type="button" class="bloc-act" data-act="up" ${idx===0?'disabled':''} title="${escAttr(I18N.BLOC_MONTER_TITLE)}"><i class="fas fa-arrow-up"></i></button>
          <button type="button" class="bloc-act" data-act="down" ${idx===blocs.length-1?'disabled':''} title="${escAttr(I18N.BLOC_DESCENDRE_TITLE)}"><i class="fas fa-arrow-down"></i></button>
          <button type="button" class="bloc-act bloc-act-danger" data-act="del" title="${escAttr(I18N.BLOC_SUPPRIMER_TITLE)}"><i class="fas fa-trash"></i></button>
        </div>
      </div>
      ${blocApercuHtml(b)}
      ${widthHandle}${leftHandle}${topHandle}${cornerHandles}${rotateHandle}
      <div class="bloc-height-handle" data-idx="${idx}" title="Glisser pour ajuster la hauteur"></div>
    </div>`;
  };

  const flowHtml = rows.map(grp => grp.length === 1
    ? cardHtml(grp[0])
    : `<div class="blocs-row">${grp.map(i => cardHtml(i)).join('')}</div>`
  ).join('');
  const libreHtml = libreIdx.map(idx => {
    const b = blocs[idx];
    const style = `position:absolute;left:${b.pos_x||0}px;top:${b.pos_y||0}px;width:${b.largeur||100}%;${b.hauteur?`min-height:${b.hauteur}px;`:''}${b.rotation?`transform:rotate(${b.rotation}deg);`:''}z-index:${10+idx};`;
    return cardHtml(idx, style);
  }).join('');
  // Rectangle repère : matérialise la largeur réelle de la zone de contenu
  // de la page publiée (820px, voir le CSS généré par serve_page_view) --
  // le canevas de l'éditeur, lui, n'a pas cette limite (les blocs libres
  // peuvent être placés n'importe où, même en dehors), d'où ce repère
  // visuel pour savoir ce qui sera dans le cadre une fois publié. Toujours
  // affiché (pas seulement s'il y a des blocs libres) pour qu'on voie la
  // largeur de page même en éditant des blocs normaux.
  // Hauteur minimale = la zone visible du canevas (pas une valeur fixe
  // arbitraire) -- sinon le rectangle dépassait toujours l'écran à 100% de
  // zoom et forçait un défilement vertical sans raison.
  const canvasVisibleH = document.querySelector('.blocs-canvas-wrap')?.clientHeight || 400;
  const pageRectBas = Math.max(canvasVisibleH - 32, ...libreIdx.map(idx => (blocs[idx].pos_y || 0) + (blocs[idx].hauteur || 80) + 100));
  // Espace de travail élargi : un espace vide qu'on peut atteindre en se
  // déplaçant (glisser une zone vide, voir wireCanvasPan) même si aucun
  // bloc n'y est encore placé -- toujours présent (la barre de défilement
  // qu'il implique est masquée visuellement, voir .blocs-canvas-wrap, pour
  // ne pas gêner l'édition normale).
  const espaceTravailHtml = `<div class="canvas-espace-travail" style="width:2400px;height:${Math.max(1600, pageRectBas)}px"></div>`;
  list.innerHTML = espaceTravailHtml + pageRectHtml(pageRectBas) + flowHtml + libreHtml;
  wirePageRectResize(list);

  list.querySelectorAll('.bloc-item').forEach(item => {
    const idx = Number(item.dataset.idx);

    item.querySelector('.bloc-item-hdr').addEventListener('click', (e) => {
      if (e.target.closest('.bloc-act')) return;
      // Maj+clic : sélection multiple (en plus de la sélection normale, qui
      // pilote le panneau de réglages) -- permet de choisir plusieurs blocs
      // dans leur état actuel puis de les glisser ensemble par la poignée
      // libre de l'un d'eux (voir plus bas).
      if (e.shiftKey) {
        if (multiSelectedIndices.has(idx)) multiSelectedIndices.delete(idx);
        else multiSelectedIndices.add(idx);
        selectionnerBloc(idx);
        return;
      }
      multiSelectedIndices.clear();
      selectionnerBloc(idx);
    });

    // Glisser le bloc DIRECTEMENT dans le canevas pour placer le repère de
    // position sélectionné -- pas besoin de taper des nombres dans les
    // champs X/Y : on enregistre une position en le déplaçant à la souris,
    // comme le déplacement d'un objet dans la vue 3D de Blender.
    item.querySelector('.bloc-item-hdr').addEventListener('mousedown', (e) => {
      if (!(actionsMode && tlSelectedIdx === idx && tlSelectedKf >= 0)) {
        if (e.target.closest('.bloc-act')) return;
        // Hors édition de repère : glisser l'en-tête de N'IMPORTE QUEL bloc
        // le déplace librement (voir demarrerDeplacementBloc).
        demarrerDeplacementBloc(e, idx, item);
        return;
      }
      if (e.target.closest('.bloc-act')) return;
      e.preventDefault();
      const kf = blocs[idx].keyframes[tlSelectedKf];
      const startX = e.clientX, startY = e.clientY;
      const origX = kf.x || 0, origY = kf.y || 0;
      let moved = false;
      const onMove = (ev) => {
        moved = true;
        kf.x = origX + Math.round((ev.clientX - startX) / canvasZoom);
        kf.y = origY + Math.round((ev.clientY - startY) / canvasZoom);
        item.style.transform = `${blocs[idx].rotation ? `rotate(${blocs[idx].rotation}deg) ` : ''}translate(${kf.x}px,${kf.y}px)`;
        const ex = document.getElementById('tlKfX'); if (ex) ex.value = kf.x;
        const ey = document.getElementById('tlKfY'); if (ey) ey.value = kf.y;
        markDirty();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (moved) drawTimelineLinks();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    item.addEventListener('dragstart', (e) => {
      dragState = { fromIdx: idx };
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'reorder');
      document.getElementById('blocsPalette')?.classList.add('trash-armed');
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      dragState = null;
      list.querySelectorAll('.blocs-drop-side').forEach(el => el.classList.remove('blocs-drop-side','side-left','side-right'));
      document.getElementById('blocsPalette')?.classList.remove('trash-armed');
    });

    // Survol : bord gauche/droit = rejoindre une rangée, centre = insérer seul
    // (les blocs en position libre ne participent pas au flux/aux rangées).
    item.addEventListener('dragover', (e) => {
      if (blocs[idx].libre) return;
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const rel = (e.clientX - rect.left) / rect.width;
      item.classList.remove('blocs-drop-side','side-left','side-right');
      if (rel < 0.22) item.classList.add('blocs-drop-side','side-left');
      else if (rel > 0.78) item.classList.add('blocs-drop-side','side-right');
    });
    item.addEventListener('dragleave', () => item.classList.remove('blocs-drop-side','side-left','side-right'));

    item.addEventListener('drop', (e) => {
      if (blocs[idx].libre) return;
      e.preventDefault();
      e.stopPropagation();
      const rect = item.getBoundingClientRect();
      const rel = (e.clientX - rect.left) / rect.width;
      item.classList.remove('blocs-drop-side','side-left','side-right');
      const side = rel < 0.22 ? 'left' : (rel > 0.78 ? 'right' : null);
      deposerSur(idx, side);
    });

    item.querySelectorAll(':scope > .bloc-item-hdr .bloc-act').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'up' && idx > 0) {
          [blocs[idx-1], blocs[idx]] = [blocs[idx], blocs[idx-1]];
          if (selectedIdx === idx) selectedIdx = idx-1; else if (selectedIdx === idx-1) selectedIdx = idx;
        }
        if (act === 'down' && idx < blocs.length-1) {
          [blocs[idx+1], blocs[idx]] = [blocs[idx], blocs[idx+1]];
          if (selectedIdx === idx) selectedIdx = idx+1; else if (selectedIdx === idx+1) selectedIdx = idx;
        }
        if (act === 'del') {
          blocs.splice(idx, 1);
          if (selectedIdx === idx) selectedIdx = -1; else if (selectedIdx > idx) selectedIdx--;
          multiSelectedIndices.clear();
        }
        markDirty();
        renderBlocsList();
        renderBlocsSettings();
      });
    });
  });

  // Poignée de redimensionnement (largeur) : marche pour un bloc en rangée
  // (flex-basis, référence = la rangée) comme pour un bloc seul (largeur
  // réelle, référence = le canevas) -- avant, seuls les blocs en rangée
  // étaient redimensionnables.
  list.querySelectorAll('.bloc-resize-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      // En mode Actions avec un repère de position sélectionné sur ce bloc,
      // la poignée règle la largeur (L) DE CE REPÈRE (déformation animée),
      // pas la largeur statique du bloc.
      if (actionsMode && tlSelectedIdx === idx && tlSelectedKf >= 0) {
        const kf = blocs[idx].keyframes[tlSelectedKf];
        const startX = e.clientX;
        const startW = item.getBoundingClientRect().width;
        const onMoveKf = (ev) => {
          kf.w = Math.max(0, Math.round((startW + (ev.clientX - startX)) / canvasZoom));
          item.style.width = `${kf.w}px`;
          const el = document.getElementById('tlKfW'); if (el) el.value = kf.w;
          markDirty();
        };
        const onUpKf = () => {
          document.removeEventListener('mousemove', onMoveKf);
          document.removeEventListener('mouseup', onUpKf);
        };
        document.addEventListener('mousemove', onMoveKf);
        document.addEventListener('mouseup', onUpKf);
        return;
      }
      if (blocs[idx].libre) {
        demarrerRedimLibre(e, idx, item, { right: true });
        return;
      }
      const enLigne = !!blocs[idx].ligne;
      const ref = enLigne ? item.closest('.blocs-row') : document.getElementById('blocsList');
      if (!ref) return;
      const onMove = (ev) => {
        const refRect = ref.getBoundingClientRect();
        const decalagePx = enLigne ? 0 : (blocs[idx].decalage || 0) / 100 * refRect.width;
        const rel = (ev.clientX - refRect.left - decalagePx) / refRect.width;
        const largeur = Math.max(10, Math.min(100, Math.round(rel * 100)));
        blocs[idx].largeur = largeur;
        if (enLigne) {
          item.style.flex = `0 0 ${largeur}%`;
          item.style.maxWidth = `${largeur}%`;
        } else {
          item.style.width = `${largeur}%`;
        }
        markDirty();
        if (selectedIdx === idx) {
          const el = document.getElementById('setLargeur');
          if (el) el.value = largeur;
        }
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (!enLigne) renderBlocsList(); // fait apparaître/disparaître la poignée de déplacement
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Poignée de redimensionnement DEPUIS LA GAUCHE : garde le bord DROIT
  // fixe (comme un éditeur graphique classique) au lieu de ne pouvoir
  // agrandir/rétrécir que vers la droite.
  list.querySelectorAll('.bloc-resize-handle-left').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      if (actionsMode && tlSelectedIdx === idx && tlSelectedKf >= 0) {
        const kf = blocs[idx].keyframes[tlSelectedKf];
        const startX = e.clientX;
        const startW = item.getBoundingClientRect().width;
        const startKfX = kf.x || 0;
        const onMoveKf = (ev) => {
          const dx = (ev.clientX - startX) / canvasZoom;
          kf.w = Math.max(0, Math.round(startW / canvasZoom - dx));
          kf.x = Math.round(startKfX + dx);
          item.style.width = `${kf.w}px`;
          item.style.transform = `${blocs[idx].rotation ? `rotate(${blocs[idx].rotation}deg) ` : ''}translate(${kf.x}px,${kf.y||0}px)`;
          const elW = document.getElementById('tlKfW'); if (elW) elW.value = kf.w;
          const elX = document.getElementById('tlKfX'); if (elX) elX.value = kf.x;
          markDirty();
        };
        const onUpKf = () => {
          document.removeEventListener('mousemove', onMoveKf);
          document.removeEventListener('mouseup', onUpKf);
        };
        document.addEventListener('mousemove', onMoveKf);
        document.addEventListener('mouseup', onUpKf);
        return;
      }
      const b = blocs[idx];
      if (b.libre) {
        demarrerRedimLibre(e, idx, item, { left: true });
        return;
      }
      const refRect = document.getElementById('blocsList').getBoundingClientRect();
      const startX = e.clientX;
      // Bloc seul (hors rangée) : largeur + décalage ajustés ensemble pour
      // garder le bord droit à la même position pendant qu'on tire le
      // gauche.
      const startLargeur = b.largeur || 100;
      const startDecalage = b.decalage || 0;
      const onMove = (ev) => {
        const dx = ev.clientX - startX;
        const deltaPct = dx / refRect.width * 100;
        const largeur = Math.max(10, Math.min(100, Math.round(startLargeur - deltaPct)));
        const decalage = Math.max(0, Math.min(100 - largeur, Math.round(startDecalage + deltaPct)));
        blocs[idx].largeur = largeur;
        blocs[idx].decalage = decalage;
        item.style.width = `${largeur}%`;
        item.style.marginLeft = `${decalage}%`;
        markDirty();
        if (selectedIdx === idx) {
          const el = document.getElementById('setLargeur'); if (el) el.value = largeur;
          const ed = document.getElementById('setDecalage'); if (ed) ed.value = decalage;
        }
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        renderBlocsList();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Poignée de déplacement horizontal (bloc seul, rétréci) : glisser = ajuste "decalage"
  list.querySelectorAll('.bloc-move-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      const listEl = document.getElementById('blocsList');
      const onMove = (ev) => {
        const listRect = listEl.getBoundingClientRect();
        const largeur = blocs[idx].largeur || 100;
        let rel = (ev.clientX - listRect.left) / listRect.width * 100;
        const decalage = Math.max(0, Math.min(100 - largeur, Math.round(rel)));
        blocs[idx].decalage = decalage;
        item.style.marginLeft = `${decalage}%`;
        markDirty();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Poignée de position libre : glisser = place le bloc n'importe où sur le
  // canevas (position:absolute left/top en px), sans contrainte d'être
  // avant/après/à côté d'un autre bloc. La même logique est aussi câblée
  // sur l'en-tête entier du bloc (voir demarrerDeplacementLibre) : la
  // poignée reste disponible mais n'est plus le seul endroit où attraper
  // le bloc pour le déplacer.
  list.querySelectorAll('.bloc-libre-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => demarrerDeplacementLibre(e, Number(handle.dataset.idx), handle.closest('.bloc-item')));
  });

  // Poignée de redimensionnement (hauteur) : glisser = ajuste "hauteur" (px)
  list.querySelectorAll('.bloc-height-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      if (actionsMode && tlSelectedIdx === idx && tlSelectedKf >= 0) {
        const kf = blocs[idx].keyframes[tlSelectedKf];
        const startY0 = e.clientY;
        const startH0 = item.getBoundingClientRect().height;
        const onMoveKf = (ev) => {
          kf.h = Math.max(0, Math.round((startH0 + (ev.clientY - startY0)) / canvasZoom));
          item.style.minHeight = `${kf.h}px`;
          const el = document.getElementById('tlKfH'); if (el) el.value = kf.h;
          markDirty();
        };
        const onUpKf = () => {
          document.removeEventListener('mousemove', onMoveKf);
          document.removeEventListener('mouseup', onUpKf);
        };
        document.addEventListener('mousemove', onMoveKf);
        document.addEventListener('mouseup', onUpKf);
        return;
      }
      if (blocs[idx].libre) {
        demarrerRedimLibre(e, idx, item, { bottom: true });
        return;
      }
      const startY = e.clientY;
      const startH = item.getBoundingClientRect().height;
      const onMove = (ev) => {
        const hauteur = Math.max(0, Math.round((startH + (ev.clientY - startY)) / canvasZoom));
        blocs[idx].hauteur = hauteur;
        item.style.minHeight = `${hauteur}px`;
        markDirty();
        if (selectedIdx === idx) {
          const el = document.getElementById('setHauteur');
          if (el) el.value = hauteur;
        }
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Poignée de redimensionnement DEPUIS LE HAUT (blocs libres uniquement --
  // seuls eux ont une position Y réelle) : garde le bord BAS fixe pendant
  // qu'on tire le haut.
  list.querySelectorAll('.bloc-height-handle-top').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      if (actionsMode && tlSelectedIdx === idx && tlSelectedKf >= 0) {
        const kf = blocs[idx].keyframes[tlSelectedKf];
        const startY = e.clientY;
        const startH = item.getBoundingClientRect().height;
        const startKfY = kf.y || 0;
        const onMoveKf = (ev) => {
          const dy = (ev.clientY - startY) / canvasZoom;
          kf.h = Math.max(0, Math.round(startH / canvasZoom - dy));
          kf.y = Math.round(startKfY + dy);
          item.style.minHeight = `${kf.h}px`;
          item.style.transform = `${blocs[idx].rotation ? `rotate(${blocs[idx].rotation}deg) ` : ''}translate(${kf.x||0}px,${kf.y}px)`;
          const elH = document.getElementById('tlKfH'); if (elH) elH.value = kf.h;
          const elY = document.getElementById('tlKfY'); if (elY) elY.value = kf.y;
          markDirty();
        };
        const onUpKf = () => {
          document.removeEventListener('mousemove', onMoveKf);
          document.removeEventListener('mouseup', onUpKf);
        };
        document.addEventListener('mousemove', onMoveKf);
        document.addEventListener('mouseup', onUpKf);
        return;
      }
      demarrerRedimLibre(e, idx, item, { top: true });
    });
  });

  // Poignées de coin (blocs libres) : déforment largeur + hauteur ensemble
  // (voir demarrerRedimLibre -- Alt = centre, Maj = garde le ratio).
  list.querySelectorAll('.bloc-corner-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      const corner = handle.dataset.corner; // 'tl' | 'tr' | 'bl' | 'br'
      demarrerRedimLibre(e, idx, item, {
        left: corner.includes('l'), right: corner.includes('r'),
        top: corner.includes('t'), bottom: corner.includes('b'),
      });
    });
  });

  // Poignée de rotation (blocs libres) : glisser en cercle autour du
  // centre du bloc. Maj = accroche par pas de 15°.
  list.querySelectorAll('.bloc-rotate-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(handle.dataset.idx);
      const item = handle.closest('.bloc-item');
      const startRotation = blocs[idx].rotation || 0;
      const onMove = (ev) => {
        const rect = item.getBoundingClientRect();
        const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
        // 0° pointe vers le haut (poignée au-dessus du bloc) -- +90 pour
        // recaler l'angle atan2 (0 = droite) sur cette convention.
        let deg = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI + 90;
        deg = Math.round(deg);
        if (ev.shiftKey) deg = Math.round(deg / 15) * 15;
        deg = ((deg % 360) + 360) % 360;
        blocs[idx].rotation = deg;
        item.style.transform = `rotate(${deg}deg)`;
        markDirty();
        if (selectedIdx === idx) {
          const el = document.getElementById('setRotation'); if (el) el.value = deg;
        }
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Zone vide du canevas : dépose = bloc seul en fin de page
  wireCanvasEmptyDrop(list);

  // Le canevas doit rester assez grand pour contenir les blocs en position
  // libre les plus bas, même s'ils sont bien en dessous du flux normal.
  const libreBottoms = blocs.filter(b => b.libre).map(b => (b.pos_y||0) + (b.hauteur||80) + 40);
  if (libreBottoms.length) list.style.minHeight = `${Math.max(60, ...libreBottoms)}px`;

  if (actionsMode) { renderTimeline(); appliquerApercuKeyframes(); }
  // Recale une seule fois le défilement sur le contenu réel (0,0 logique =
  // CANVAS_OFFSET,CANVAS_OFFSET à l'écran) -- sinon la vue s'ouvrirait sur
  // l'espace vide ajouté pour pouvoir se déplacer vers le haut/la gauche.
  if (!canvasScrollCentre) {
    const wrap = document.querySelector('.blocs-canvas-wrap');
    const rectEl = document.querySelector('.page-boundary-rect');
    if (wrap && rectEl && wrap.scrollHeight > wrap.clientHeight) {
      // Centre horizontalement sur la "Zone de la page publiée" réellement
      // affichée (mesurée via getBoundingClientRect, comme focalSurPageRect)
      // -- au lieu de recalculer sa position à la main (marge CANVAS_OFFSET
      // non mise à l'échelle + largeur × zoom), calcul fragile qui pouvait
      // scroller hors de la zone réellement défilable sur une page encore
      // vide (dont l'espace de travail panoramique est plus petit).
      const wrapR = wrap.getBoundingClientRect();
      const pageR = rectEl.getBoundingClientRect();
      const centreX = pageR.left + pageR.width / 2 - wrapR.left + wrap.scrollLeft;
      wrap.scrollLeft = Math.max(0, centreX - wrap.clientWidth / 2);
      wrap.scrollTop = CANVAS_OFFSET;
      canvasScrollCentre = true;
    }
  }
}

// Point écran (relatif à .blocs-canvas-wrap) sur le centre horizontal de la
// "Zone de la page publiée" -- focal par défaut des boutons de zoom, pour
// rester centré sur la page plutôt que sur un point arbitraire du canevas.
function focalSurPageRect() {
  const wrap = document.querySelector('.blocs-canvas-wrap');
  const rect = document.querySelector('.page-boundary-rect');
  if (!wrap || !rect) return undefined;
  const wrapR = wrap.getBoundingClientRect();
  const pageR = rect.getBoundingClientRect();
  return { x: pageR.left + pageR.width / 2 - wrapR.left, y: wrap.clientHeight / 2 };
}

function selectionnerBloc(idx) {
  selectedIdx = idx;
  renderBlocsList();
  renderBlocsSettings();
}

// ── Panneau de réglages (droite) : contenu complet + disposition + animation du bloc sélectionné ──
function renderBlocsSettings() {
  const panel = document.getElementById('blocsSettings');
  if (!panel) return;
  if (selectedIdx < 0 || !blocs[selectedIdx]) {
    panel.innerHTML = `<div class="blocs-settings-empty"><i class="fas fa-arrow-pointer" style="display:block;font-size:20px;margin-bottom:8px;"></i>Sélectionnez un bloc dans le canevas pour modifier tous ses réglages ici.</div>`;
    return;
  }
  const idx = selectedIdx;
  const b = blocs[idx];
  const enLigne = !!b.ligne;
  panel.innerHTML = `
    <div class="blocs-settings-hdr"><i class="fas fa-${BLOC_ICONES[b.type]||'cube'}"></i> ${escAttr(BLOC_LABELS[b.type]||b.type)}</div>
    <div class="blocs-settings-section-title">Contenu</div>
    ${blocItemBodyHtml(b)}
    <div class="blocs-settings-section-title">Disposition</div>
    <label class="champ-checkbox-row"><input type="checkbox" id="setLibre" ${b.libre?'checked':''}> Position libre — placer où je veux, indépendamment des autres blocs</label>
    ${b.libre ? `
    <div class="layout-grid-2" style="margin-top:8px">
      <div><span class="champ-label">X (px)</span><input type="number" id="setPosX" value="${b.pos_x||0}" step="10"></div>
      <div><span class="champ-label">Y (px)</span><input type="number" id="setPosY" value="${b.pos_y||0}" step="10"></div>
    </div>
    <div class="hint" style="margin-top:6px">Glissez le bloc par la poignée <i class="fas fa-up-down-left-right"></i> dans son en-tête pour le placer n'importe où sur le canevas, y compris tout en bas.</div>
    <div class="layout-grid-2" style="margin-top:8px">
      <div><span class="champ-label">Largeur (%)</span><input type="number" id="setLargeur" min="10" max="100" value="${b.largeur||100}"></div>
      <div><span class="champ-label">Hauteur forcée (px, 0 = auto)</span><input type="number" id="setHauteur" min="0" max="2000" value="${b.hauteur||0}"></div>
    </div>
    <div style="margin-top:8px"><span class="champ-label">Rotation (°)</span><input type="number" id="setRotation" min="0" max="359" step="5" value="${b.rotation||0}"></div>
    <div class="hint" style="margin-top:6px">Ou glissez la poignée <i class="fas fa-rotate"></i> au-dessus du bloc (Maj = pas de 15°) ; les poignées de coin déforment largeur+hauteur ensemble (Alt = depuis le centre, Maj = garde le ratio).</div>
    ` : `
    <div class="layout-grid-2" style="margin-top:8px">
      <div><span class="champ-label">Largeur (%)</span><input type="number" id="setLargeur" min="10" max="100" value="${b.largeur||100}"></div>
      ${enLigne
        ? `<div><span class="champ-label">Espace ligne (px)</span><input type="number" id="setEspace" min="0" max="1000" value="${b.espace||16}"></div>`
        : `<div><span class="champ-label">Décalage gauche (%)</span><input type="number" id="setDecalage" min="0" max="90" value="${b.decalage||0}" ${(b.largeur||100)>=100?'disabled':''}></div>`}
    </div>
    <div style="margin-top:8px"><span class="champ-label">Hauteur forcée (px, 0 = auto)</span><input type="number" id="setHauteur" min="0" max="2000" value="${b.hauteur||0}"></div>
    ${enLigne
      ? `<button type="button" class="btn btn-secondary btn-xs" id="sortirLigneBtn" style="margin-top:8px"><i class="fas fa-arrows-left-right"></i> Sortir de la ligne</button>`
      : `<div class="hint" style="margin-top:6px">Glissez ce bloc sur le bord gauche/droit d'un autre bloc dans le canevas pour les mettre côte à côte, ou réduisez sa largeur et utilisez le décalage pour le positionner librement.</div>`}
    `}
    <div class="blocs-settings-section-title">Délai d'animation</div>
    <div><span class="champ-label">Avant déclenchement (ms)</span><input type="number" id="setDelai" min="0" max="120000" step="50" value="${b.anim_delai||0}"></div>
    <div class="hint" style="margin-top:6px">Réglable aussi en glissant le repère de ce bloc dans le mode Actions (barre d'outils verticale).</div>
    ${(b.keyframes && b.keyframes.length >= 2) ? `
    <label class="champ-checkbox-row" style="margin-top:8px"><input type="checkbox" id="setBoucle" ${b.boucle?'checked':''}> Boucle — répète l'animation de repères en continu</label>
    ` : ''}`;

  wireBlocFields(panel, idx);

  const libreEl = document.getElementById('setLibre');
  if (libreEl) libreEl.addEventListener('change', (e) => {
    blocs[idx].libre = e.target.checked;
    if (blocs[idx].libre) { blocs[idx].ligne = ''; blocs[idx].decalage = 0; }
    markDirty(); renderBlocsList(); renderBlocsSettings();
  });
  const posXEl = document.getElementById('setPosX');
  if (posXEl) posXEl.addEventListener('input', (e) => { blocs[idx].pos_x = Number(e.target.value) || 0; markDirty(); renderBlocsList(); });
  const posYEl = document.getElementById('setPosY');
  if (posYEl) posYEl.addEventListener('input', (e) => { blocs[idx].pos_y = Number(e.target.value) || 0; markDirty(); renderBlocsList(); });
  const rotationEl = document.getElementById('setRotation');
  if (rotationEl) rotationEl.addEventListener('input', (e) => { blocs[idx].rotation = ((Number(e.target.value) || 0) % 360 + 360) % 360; markDirty(); renderBlocsList(); });
  const largeurEl = document.getElementById('setLargeur');
  if (largeurEl) largeurEl.addEventListener('input', (e) => setLargeurLigne(idx, Number(e.target.value)));
  const espaceEl = document.getElementById('setEspace');
  if (espaceEl) espaceEl.addEventListener('input', (e) => setEspaceLigne(idx, Number(e.target.value)));
  const decalageEl = document.getElementById('setDecalage');
  if (decalageEl) decalageEl.addEventListener('input', (e) => {
    const largeur = blocs[idx].largeur || 100;
    blocs[idx].decalage = Math.max(0, Math.min(100 - largeur, Number(e.target.value) || 0));
    markDirty(); renderBlocsList();
  });
  const hauteurEl = document.getElementById('setHauteur');
  if (hauteurEl) hauteurEl.addEventListener('input', (e) => { blocs[idx].hauteur = Math.max(0, Math.min(2000, Number(e.target.value)||0)); markDirty(); renderBlocsList(); });
  const delaiEl = document.getElementById('setDelai');
  if (delaiEl) delaiEl.addEventListener('input', (e) => { blocs[idx].anim_delai = Math.max(0, Math.min(120000, Number(e.target.value)||0)); markDirty(); if (actionsMode) renderTimeline(); });
  const boucleEl = document.getElementById('setBoucle');
  if (boucleEl) boucleEl.addEventListener('change', (e) => { blocs[idx].boucle = e.target.checked; markDirty(); });
  const sortirBtn = document.getElementById('sortirLigneBtn');
  if (sortirBtn) sortirBtn.onclick = () => sortirDeLaLigne(idx);
}

// Câble les champs (texte, checkgroup, image, icône, sous-listes) d'un
// panneau de réglages sur le bloc `idx` -- utilisé par le panneau latéral.
function wireBlocFields(container, idx) {
  container.querySelectorAll('[data-field]').forEach(field => {
    if (field.closest('.champ-image') || field.closest('.champ-items') || field.closest('.champ-icon')) return;
    field.addEventListener('input', () => { blocs[idx][field.dataset.field] = field.value; markDirty(); });
    field.addEventListener('change', () => renderBlocsList());
  });

  container.querySelectorAll('[data-checkgroup]').forEach(group => {
    group.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        const key = group.dataset.checkgroup;
        blocs[idx][key] = Array.from(group.querySelectorAll('input:checked')).map(c => c.value);
        markDirty();
      });
    });
  });

  container.querySelectorAll('[data-img-pick]').forEach(btn => {
    if (btn.closest('.champ-items')) return;
    btn.addEventListener('click', () => {
      const key = btn.dataset.imgPick;
      // renderBlocsList() en plus de renderBlocsSettings() : la carte du
      // canevas affiche elle aussi un aperçu de l'image (voir
      // blocApercuHtml) qui doit se rafraîchir immédiatement, pas seulement
      // le panneau de réglages.
      ouvrirSelecteurImage(url => { blocs[idx][key] = url; markDirty(); renderBlocsSettings(); renderBlocsList(); });
    });
  });
  container.querySelectorAll('[data-img-clear]').forEach(btn => {
    if (btn.closest('.champ-items')) return;
    btn.addEventListener('click', () => { blocs[idx][btn.dataset.imgClear] = ''; markDirty(); renderBlocsSettings(); renderBlocsList(); });
  });

  container.querySelectorAll('[data-icon-pick]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.iconPick;
      ouvrirSelecteurIcone(slug => { blocs[idx][key] = slug; markDirty(); renderBlocsSettings(); });
    });
  });

  // Sous-listes (items)
  container.querySelectorAll('.champ-items').forEach(wrap => {
    const key = wrap.dataset.field;
    const champ = (BLOC_SPECS[blocs[idx].type] || []).find(c => c.k === key);
    wrap.querySelectorAll('.champ-item-row').forEach(row => {
      const j = Number(row.dataset.subidx);
      row.querySelectorAll('[data-field]').forEach(field => {
        if (field.closest('.champ-image')) return;
        field.addEventListener('input', () => { blocs[idx][key][j][field.dataset.field] = field.value; markDirty(); });
      });
      row.querySelectorAll('[data-img-pick]').forEach(btn => {
        btn.addEventListener('click', () => {
          const fk = btn.dataset.imgPick;
          ouvrirSelecteurImage(url => { blocs[idx][key][j][fk] = url; markDirty(); renderBlocsSettings(); });
        });
      });
      row.querySelectorAll('[data-img-clear]').forEach(btn => {
        btn.addEventListener('click', () => { blocs[idx][key][j][btn.dataset.imgClear] = ''; markDirty(); renderBlocsSettings(); });
      });
      row.querySelectorAll('[data-subact]').forEach(btn => {
        btn.addEventListener('click', () => {
          const items = blocs[idx][key];
          if (btn.dataset.subact === 'up' && j > 0) [items[j-1], items[j]] = [items[j], items[j-1]];
          if (btn.dataset.subact === 'down' && j < items.length-1) [items[j+1], items[j]] = [items[j], items[j+1]];
          if (btn.dataset.subact === 'del') items.splice(j, 1);
          markDirty();
          renderBlocsSettings();
        });
      });
    });
    const addBtn = wrap.querySelector('[data-add-item]');
    if (addBtn) addBtn.addEventListener('click', () => {
      const nouvel = {};
      champ.sousChamps.forEach(sc => { nouvel[sc.k] = ''; });
      blocs[idx][key].push(nouvel);
      markDirty();
      renderBlocsSettings();
    });
  });
}

// ── Disposition en rangées (plusieurs blocs par ligne) ──────────────
function deposerSur(targetIdx, side) {
  if (!dragState) return;
  let novo;
  if (dragState.type) {
    novo = blocDefaut(dragState.type);
  } else if (dragState.fromIdx !== undefined) {
    [novo] = blocs.splice(dragState.fromIdx, 1);
    if (dragState.fromIdx < targetIdx) targetIdx--;
  } else {
    dragState = null;
    return;
  }

  if (side === 'left' || side === 'right') {
    const target = blocs[targetIdx];
    const ligneId = target.ligne || ('r' + Date.now().toString(36));
    if (!target.ligne) target.ligne = ligneId;
    novo.ligne = ligneId;
    novo.espace = target.espace || 16;
    const insertAt = side === 'left' ? targetIdx : targetIdx + 1;
    blocs.splice(insertAt, 0, novo);
    equilibrerLigne(ligneId);
  } else {
    novo.ligne = ''; novo.largeur = 100;
    blocs.splice(targetIdx + 1, 0, novo);
  }
  selectedIdx = blocs.indexOf(novo);
  markDirty();
  renderBlocsList();
  renderBlocsSettings();
  dragState = null;
}

function equilibrerLigne(ligneId) {
  const idxs = blocs.map((b, i) => b.ligne === ligneId ? i : -1).filter(i => i >= 0);
  if (!idxs.length) return;
  const w = Math.round(100 / idxs.length);
  idxs.forEach(i => { blocs[i].largeur = w; });
}

function sortirDeLaLigne(idx) {
  const ligneId = blocs[idx].ligne;
  blocs[idx].ligne = '';
  blocs[idx].largeur = 100;
  if (ligneId) equilibrerLigne(ligneId);
  markDirty();
  renderBlocsList();
  renderBlocsSettings();
}

function setLargeurLigne(idx, val) {
  blocs[idx].largeur = Math.max(10, Math.min(100, val || 100));
  markDirty();
  renderBlocsList();
}

function setEspaceLigne(idx, val) {
  const v = Math.max(0, Math.min(1000, val || 0));
  const ligneId = blocs[idx].ligne;
  blocs.forEach(b => { if (b.ligne && b.ligne === ligneId) b.espace = v; });
  markDirty();
  renderBlocsList();
}

// Centre de la "Zone de la page publiée" en coordonnées réelles (repère
// pos_x/pos_y, zoom 1) -- utilisé pour faire apparaître un nouveau bloc
// directement dedans plutôt qu'à l'origine du canevas (hors champ de vue).
function centreDeLaPage() {
  const list = document.getElementById('blocsList');
  const rect = document.querySelector('.page-boundary-rect');
  if (!list || !rect) return { x: 100, y: 100 };
  const listR = list.getBoundingClientRect();
  const pageR = rect.getBoundingClientRect();
  return {
    x: Math.round((pageR.left + pageR.width / 2 - listR.left) / canvasZoom),
    y: Math.round((pageR.top + 80 - listR.top) / canvasZoom),
  };
}

// Un nouveau bloc depuis la palette (clic ou glisser sur une zone vide)
// apparaît directement en position libre, déjà sélectionné -- avec ses
// poignées de déplacement/déformation visibles sans manip supplémentaire.
function ajouterBloc(type) {
  const bloc = blocDefaut(type);
  bloc.libre = true;
  const c = centreDeLaPage();
  bloc.pos_x = Math.max(0, c.x - 100);
  bloc.pos_y = Math.max(0, c.y);
  blocs.push(bloc);
  selectedIdx = blocs.length - 1;
  markDirty();
  renderBlocsList();
  renderBlocsSettings();
}

function renderPalette() {
  const el = document.getElementById('blocsPalette');
  if (!el) return;
  el.innerHTML = `<div class="blocs-palette-trash-overlay"><i class="fas fa-trash"></i></div>` + CATEGORIES.map(cat => `
    <div class="blocs-palette-cat">${escAttr(cat.nom)}</div>
    ${cat.types.map(type => `
      <div class="blocs-palette-item" draggable="true" data-type="${type}">
        <i class="fas fa-${BLOC_ICONES[type]||'cube'}"></i> ${escAttr(BLOC_LABELS[type]||type)}
      </div>`).join('')}
  `).join('');

  el.querySelectorAll('.blocs-palette-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      dragState = { type: item.dataset.type };
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', 'nouveau-bloc');
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    item.addEventListener('click', () => ajouterBloc(item.dataset.type));
  });

  // Glisser un bloc du canevas jusqu'ici = le supprimer (poubelle).
  el.ondragover = (e) => {
    if (dragState && dragState.fromIdx !== undefined) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
  };
  el.ondrop = (e) => {
    if (!dragState || dragState.fromIdx === undefined) return;
    e.preventDefault();
    const idx = dragState.fromIdx;
    blocs.splice(idx, 1);
    if (selectedIdx === idx) selectedIdx = -1; else if (selectedIdx > idx) selectedIdx--;
    multiSelectedIndices.clear();
    dragState = null;
    markDirty();
    renderBlocsList();
    renderBlocsSettings();
  };
}

// ── Sélecteur d'image (URL / téléchargement / mes fichiers) ────────
let imgPickerCallback = null;

function ouvrirSelecteurImage(onChoisi) {
  imgPickerCallback = onChoisi;
  document.getElementById('imgPickerOverlay').style.display = 'flex';
  document.getElementById('imgPickerUrlInput').value = '';
  activerOngletImgPicker('url');
}
function fermerSelecteurImage() {
  document.getElementById('imgPickerOverlay').style.display = 'none';
  imgPickerCallback = null;
}
function activerOngletImgPicker(tab) {
  document.querySelectorAll('.img-picker-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.img-picker-pane').forEach(p => p.classList.toggle('active', p.dataset.pane === tab));
  if (tab === 'mesfichiers') chargerMesImages();
}
async function chargerMesImages() {
  const el = document.getElementById('mesImagesGrid');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  try {
    const r = await apiFetch(`${API}/mes_images`);
    const data = await r.json();
    const fichiers = data.fichiers || [];
    if (!fichiers.length) { el.innerHTML = `<div class="champ-items-empty">Aucune image dans vos fichiers.</div>`; return; }
    // Les fichiers ExoDrive sont chiffrés de bout en bout (le serveur ne
    // détient jamais la clé) -- une <img src="/api/.../fichier_thumb?..">
    // classique servirait directement les octets chiffrés, illisibles pour
    // le navigateur. On récupère et déchiffre chaque miniature côté client
    // (voir recupererFichierDechiffre) puis on l'affiche via une object URL.
    el.innerHTML = fichiers.map(f => `<div class="mes-images-item" data-id="${f.id}" title="${escAttr(f.nom)}"><div class="spinner-wrap"><div class="spinner"></div></div></div>`).join('');
    el.querySelectorAll('.mes-images-item').forEach(item => {
      item.onclick = () => importerFichier(Number(item.dataset.id));
      recupererFichierDechiffre(Number(item.dataset.id)).then(({ blob }) => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(blob);
        img.loading = 'lazy';
        item.innerHTML = '';
        item.appendChild(img);
      }).catch(() => { item.innerHTML = `<i class="fas fa-triangle-exclamation"></i>`; });
    });
  } catch(e) { el.innerHTML = `<div class="champ-items-empty">Erreur de chargement.</div>`; }
}
// Récupère un fichier ExoDrive par son id et le déchiffre côté client
// (même logique que le téléchargement dans fchier.html) -- le serveur ne
// stocke et ne renvoie que du contenu chiffré, jamais la clé.
async function recupererFichierDechiffre(id) {
  const r = await apiFetch(`/api/fchier/download?id=${id}`);
  const data = await r.json();
  if (!data.success) throw new Error(data.error || I18N.ERREUR);
  const bytes = VEX.fromBase64(data.contenu);
  let blob;
  if (window.VEX && VEX.isConnected()) {
    try {
      blob = await VEX.dechiffrerFichier(new Blob([bytes]), data.mime);
    } catch (e) {
      if (!e.message || !e.message.includes('non chiffré')) throw e;
      blob = new Blob([bytes], { type: data.mime || 'application/octet-stream' });
    }
  } else {
    blob = new Blob([bytes], { type: data.mime || 'application/octet-stream' });
  }
  return { blob, mime: data.mime, nom: data.nom };
}
async function importerFichier(id) {
  try {
    const { blob, mime, nom } = await recupererFichierDechiffre(id);
    if (blob.size > 5 * 1024 * 1024) { toast('Fichier trop volumineux (5 Mo maximum).', 'err'); return; }
    const b64 = VEX.toBase64(new Uint8Array(await blob.arrayBuffer()));
    const r = await apiFetch(`${API}/media_upload`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({file_b64:b64, mime_type: mime, file_name: nom}),
    });
    const data = await r.json();
    if (data.success) { if (imgPickerCallback) imgPickerCallback(data.url); fermerSelecteurImage(); }
    else toast(data.error || I18N.ERREUR, 'err');
  } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR, 'err'); }
}
function validerUrlImage() {
  const url = document.getElementById('imgPickerUrlInput').value.trim();
  if (!url) return;
  if (imgPickerCallback) imgPickerCallback(url);
  fermerSelecteurImage();
}
function gererUploadImage(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('Fichier trop volumineux (5 Mo maximum).', 'err'); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const b64 = String(reader.result).split(',')[1] || '';
    try {
      const r = await apiFetch(`${API}/media_upload`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({file_b64:b64, mime_type:file.type, file_name:file.name}),
      });
      const data = await r.json();
      if (data.success) { if (imgPickerCallback) imgPickerCallback(data.url); fermerSelecteurImage(); }
      else toast(data.error || I18N.ERREUR, 'err');
    } catch(e) { if (e.message !== 'Session expirée') toast(I18N.ERREUR, 'err'); }
  };
  reader.readAsDataURL(file);
}

// "LARGEURxFINxHAUTEUR" (ex: "820x30000x900") -- rétro-compatible avec les
// pages enregistrées avant l'ajout de la fin de frise et/ou de la hauteur de
// pli (juste un nombre = largeur seule ; "largeurxfin" = sans hauteur).
function parsePageMeta(raw) {
  const m = /^(\d+)(?:x(\d+)(?:x(\d+))?)?$/.exec(String(raw || '').trim());
  return {
    width: Math.max(320, Math.min(1600, (m && parseInt(m[1], 10)) || 820)),
    tlEnd: Math.max(1000, Math.min(TL_ABS_MAX, (m && m[2] && parseInt(m[2], 10)) || 30000)),
    height: Math.max(200, Math.min(4000, (m && m[3] && parseInt(m[3], 10)) || 900)),
  };
}
