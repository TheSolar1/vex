// ── Helpers ───────────────────────────────────────────────────────
function toast(msg, type='', dur=3000) {
  const icons = {ok:'circle-check', err:'circle-xmark'};
  const area = document.getElementById('toast-area');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<img class="ico ico-sm" src="${ICO}${icons[type]||'circle-info'}.svg"><span>${esc(msg)}</span>`;
  area.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>area.removeChild(el),300); }, dur);
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return esc(s).replace(/"/g,'&quot;');
}

// ── Raccourcis clavier (actifs uniquement dans l'éditeur de blocs plein écran) ──
document.addEventListener('keydown', (e) => {
  if (!blocsFullView) return;
  if (tlGrabbing) return; // le mode "G" gère lui-même Échap/Entrée/clic
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    savePage('blocs');
    return;
  }
  if (actionsMode && !typing) {
    if (e.code === 'Space') { e.preventDefault(); tlTogglePlay(); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); tlSetPlayhead(tlPlayhead - 100); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); tlSetPlayhead(tlPlayhead + 100); return; }
    // "I" façon Blender (Insert Keyframe) : place -- ou déplace si déjà
    // présent -- le repère du bloc sélectionné sur la position actuelle
    // du curseur de lecture.
    if ((e.key === 'i' || e.key === 'I') && selectedIdx >= 0) {
      e.preventDefault();
      const b = blocs[selectedIdx];
      if (!b.animation) b.animation = 'fade';
      b.anim_delai = Math.round(tlPlayhead / 50) * 50;
      tlSelectedIdx = selectedIdx;
      tlSelectedKf = -1;
      markDirty();
      renderTimeline();
      renderBlocsSettings();
      return;
    }
    // "G" façon Blender (Grab) : déplace le repère sélectionné en suivant
    // la souris jusqu'à clic/Entrée (confirme) ou Échap (annule).
    if ((e.key === 'g' || e.key === 'G') && tlSelectedIdx >= 0) {
      e.preventDefault();
      tlStartGrab();
      return;
    }
    // Suppr/Retour arrière sur un repère sélectionné dans la frise = on
    // l'enlève de la frise (priorité sur la suppression du bloc entier).
    if ((e.key === 'Delete' || e.key === 'Backspace') && tlSelectedIdx >= 0) {
      e.preventDefault();
      supprimerRepereSelectionne();
      return;
    }
  }
  if (typing) return;
  if (e.key === 'Escape') { selectedIdx = -1; renderBlocsList(); renderBlocsSettings(); return; }
  if (selectedIdx < 0) return;
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    blocs.splice(selectedIdx, 1);
    selectedIdx = -1;
    markDirty(); renderBlocsList(); renderBlocsSettings();
  } else if (e.altKey && e.key === 'ArrowUp' && selectedIdx > 0) {
    e.preventDefault();
    [blocs[selectedIdx-1], blocs[selectedIdx]] = [blocs[selectedIdx], blocs[selectedIdx-1]];
    selectedIdx--; markDirty(); renderBlocsList(); renderBlocsSettings();
  } else if (e.altKey && e.key === 'ArrowDown' && selectedIdx < blocs.length-1) {
    e.preventDefault();
    [blocs[selectedIdx+1], blocs[selectedIdx]] = [blocs[selectedIdx], blocs[selectedIdx+1]];
    selectedIdx++; markDirty(); renderBlocsList(); renderBlocsSettings();
  }
});

// ── Bootstrap ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  await initUI();
  await loadPages();
  document.getElementById('createBtn').onclick = createPage;

  // Ouvre automatiquement la page ciblée par ?open=ID (lien depuis fchier),
  // et l'éditeur de blocs plein écran si l'URL le précise (&blocs=1) --
  // permet un vrai lien/retour/rafraîchissement vers cet écran dédié.
  const params = new URLSearchParams(window.location.search);
  const openId = params.get('open');
  if (openId) {
    await openPage(openId);
    if (params.get('blocs') === '1' && current) { blocsFullView = true; renderEditor(); }
  }

  window.addEventListener('popstate', async () => {
    const p2 = new URLSearchParams(window.location.search);
    const id2 = p2.get('open');
    if (!id2) {
      current = null; blocsFullView = false; actionsMode = false;
      const sidebarEl = document.querySelector('.sidebar');
      if (sidebarEl) sidebarEl.style.display = '';
      renderList();
      document.getElementById('main').innerHTML = `
        <div class="empty-state">
          <img class="ico ico-lg ico-muted" src="${ICO}globe.svg">
          <p>${I18N.SELECTIONNEZ_OU_CREEZ}</p>
        </div>`;
      return;
    }
    if (!current || current.id !== id2) await openPage(id2);
    blocsFullView = p2.get('blocs') === '1';
    if (!blocsFullView) actionsMode = false;
    renderEditor();
  });
});
</script>
