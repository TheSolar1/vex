<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{T_TITRE_ONGLET}}</title>
  <link rel="icon" href="/static/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4fa553">
  <link rel="apple-touch-icon" href="/static/img/icon-192.png">
  <style>
.ico { display:inline-block; width:16px; height:16px; vertical-align:middle; flex-shrink:0; }
.ico-sm { width:14px; height:14px; }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.main-container { display:flex; min-height:100vh; }
.contenu { flex:1; padding:32px 24px; max-width:760px; margin:0 auto; width:100%; }
h1 { font-size:1.4rem; margin-bottom:18px; display:flex; align-items:center; gap:10px; }
.search-box { display:flex; gap:10px; margin-bottom:6px; position:relative; }
.search-box input {
  flex:1; padding:13px 16px 13px 42px; border-radius:24px; border:1px solid var(--border);
  background:var(--input, var(--surface)); color:var(--text); font-size:15px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.search-box input:focus { outline:none; border-color:var(--accent); box-shadow:0 1px 8px rgba(0,0,0,.1); }
.search-box .ico-loupe { position:absolute; left:15px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none; }
.barre-actions { display:flex; justify-content:flex-end; margin:14px 0; }
.abonnement-card {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:16px 18px; margin-bottom:20px; display:flex; align-items:center; gap:14px;
  font-size:13.5px;
}
.abonnement-card .badge {
  padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px;
  background:var(--accent); color:#fff;
}
.abonnement-card .badge.inactif { background:var(--border); color:var(--text-m,var(--text)); }
.resultats { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
.vide { text-align:center; padding:40px 20px; opacity:.6; font-size:13.5px; }

/* ── Resultats : cartes VEX (meme idiome que les cartes ext-card/wiki-card
   utilisees ailleurs sur le site), pas des lignes plates "moteur de
   recherche generique" -- une bordure gauche coloree par source, comme les
   badges de statut admin, identifie l'origine du resultat d'un coup d'oeil. ── */
.res-item {
  display:block; text-decoration:none; color:inherit; cursor:pointer;
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border);
  border-radius:10px; padding:14px 16px; transition:border-color .15s;
}
.res-item:hover { border-color:var(--accent); }
.res-item.t-wiki      { border-left-color:#8b5cf6; }
.res-item.t-wikipedia { border-left-color:#3b82f6; }
.res-item.t-extension { border-left-color:var(--accent); }
.res-item .res-type {
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  opacity:.65; margin-bottom:5px; display:flex; align-items:center; gap:5px;
}
.res-item .res-titre { font-size:15px; font-weight:700; color:var(--text); margin-bottom:4px; }
.res-item .res-extrait { font-size:13px; opacity:.75; line-height:1.5; }
.res-item .res-meta { font-size:11.5px; opacity:.55; margin-top:6px; }
.res-item a.res-dl { color:var(--accent); text-decoration:none; font-weight:600; font-size:12.5px; }

.btn-primaire {
  padding:9px 16px; border-radius:8px; background:var(--accent); color:#fff; border:none;
  font-size:13.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
}
.btn-secondaire {
  padding:9px 16px; border-radius:8px; background:var(--surface); border:1px solid var(--border); color:var(--text);
  font-size:13.5px; font-weight:600; cursor:pointer;
}
.modal-bg2 {
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
  z-index:6000; padding:20px;
}
.modal-box2 {
  background:var(--surface); border-radius:12px; padding:22px; width:100%; max-width:640px;
  max-height:85vh; overflow-y:auto;
}
.modal-box2 input, .modal-box2 textarea {
  width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--input,var(--bg)); color:var(--text); font-size:14px; margin-bottom:12px; font-family:inherit;
}
.modal-box2 textarea { resize:vertical; min-height:160px; line-height:1.5; }
.article-full .contenu { white-space:pre-wrap; line-height:1.7; font-size:14.5px; margin:16px 0; }
.article-full .actions { display:flex; gap:8px; margin-top:16px; }
.retour { background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; font-size:13.5px; margin-bottom:14px; display:inline-flex; align-items:center; gap:6px; }

/* ── Lecteur Wikipedia -- retour utilisateur ("c'est infame") sur la
   premiere version (titre souligne + sommaire encadre + filets sous
   chaque titre, trop charge) : version allegee, juste des titres et du
   texte, meme densite visuelle que le lecteur du wiki interne. ── */
.wp-titre { font-size:1.4rem; font-weight:700; margin-bottom:4px; }
.wp-sommaire { font-size:12.5px; opacity:.8; margin:10px 0 18px; line-height:1.8; }
.wp-sommaire a { color:var(--accent); text-decoration:none; margin-right:12px; }
.wp-sommaire a:hover { text-decoration:underline; }
.wp-contenu h2 { font-size:1.05rem; font-weight:700; margin:22px 0 8px; scroll-margin-top:16px; }
.wp-contenu h3 { font-size:.95rem; font-weight:700; margin:16px 0 6px; opacity:.9; scroll-margin-top:16px; }
.wp-contenu h4 { font-size:.9rem; font-weight:700; margin:14px 0 6px; opacity:.8; scroll-margin-top:16px; }
.wp-contenu p { line-height:1.7; font-size:14px; margin:0 0 12px; }
  </style>
</head>
<body>

__NAV_HTML__

<div class="main-container">
  <div class="contenu">
    <h1><img class="ico" src="/static/img/solid/magnifying-glass.svg" alt=""> {{T_TITRE}}</h1>

    <div class="abonnement-card" id="abonnement-card" style="display:none">
      <span class="badge" id="abonnement-badge"></span>
      <span id="abonnement-texte"></span>
    </div>

    <!-- ── Vue resultats (une seule barre, resultats melanges Wiki + Extensions) ── -->
    <div id="vue-resultats">
      <div class="search-box">
        <img class="ico ico-loupe" src="/static/img/solid/magnifying-glass.svg" alt="">
        <input type="text" id="q" placeholder="{{T_PLACEHOLDER}}" autocomplete="off">
      </div>
      <div class="resultats" id="resultats"></div>
    </div>

    <!-- ── Vue article wiki ouvert ── -->
    <div id="wiki-article-vue" style="display:none">
      <button class="retour" onclick="wikiFermerArticle()"><img class="ico ico-sm" src="/static/img/solid/arrow-left.svg" alt=""> Retour aux résultats</button>
      <div class="article-full" id="wiki-article-contenu"></div>
    </div>
  </div>
</div>

<!-- ── Modale édition wiki ── -->
<div class="modal-bg2" id="wiki-modal" style="display:none">
  <div class="modal-box2">
    <h2 style="margin-bottom:14px;font-size:1.1rem">Article du wiki</h2>
    <input type="hidden" id="wiki-edit-id">
    <input type="text" id="wiki-edit-titre" placeholder="Titre de l'article">
    <textarea id="wiki-edit-contenu" placeholder="Contenu de l'article..."></textarea>
    <div style="display:flex;gap:10px">
      <button class="btn-primaire" onclick="wikiEnregistrer()"><img class="ico ico-sm" src="/static/img/solid/check.svg" alt=""> Enregistrer</button>
      <button class="btn-secondaire" onclick="document.getElementById('wiki-modal').style.display='none'">Annuler</button>
    </div>
  </div>
</div>

<div id="toast-area" style="position:fixed;bottom:24px;right:24px;z-index:5000;display:flex;flex-direction:column;gap:10px;pointer-events:none;"></div>

<script>
{{I18N_JS}}
function escHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Met en gras le terme recherche dans un texte -- toujours escHtml() en
// premier (le texte affiche reste sur, aucun contenu externe n'est jamais
// injecte tel quel), la mise en gras ne fait qu'entourer des morceaux du
// texte deja echappe avec des balises <strong> fixes.
function surligner(texte, q){
  const echappe = escHtml(texte);
  const requete = (q||'').trim();
  if(!requete) return echappe;
  const motif = escHtml(requete).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return echappe.replace(new RegExp('('+motif+')', 'ig'), '<strong>$1</strong>');
}
const S={};

function toast(msg, type='info'){
  const area=document.getElementById('toast-area');
  const el=document.createElement('div');
  el.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15);';
  el.textContent=msg;
  area.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>area.removeChild(el),300); }, 3500);
}

async function chargerAbonnement(){
  try{
    const r=await fetch('/api/recherche/abonnement', {credentials:'include'});
    const d=await r.json();
    if(!d.success) return;
    const card=document.getElementById('abonnement-card');
    const badge=document.getElementById('abonnement-badge');
    const texte=document.getElementById('abonnement-texte');
    card.style.display='flex';
    if(d.data.actif){
      badge.textContent = d.data.plan_nom || 'VIP';
      badge.classList.remove('inactif');
      texte.textContent = d.data.montant_eur > 0
        ? `${d.data.montant_eur.toFixed(2)} € / mois`
        : d.data.plan_nom;
    }else{
      badge.textContent = 'Free';
      badge.classList.add('inactif');
      texte.textContent = d.data.plan_nom || '';
    }
  }catch(e){ /* pas bloquant */ }
}

/* ══════════════ Recherche unifiee (style moteur de recherche) ══════════════
   Une seule barre : chaque app de Recherche (Wiki, Extensions...) pousse
   directement ses resultats dans la meme liste, pas d'onglets separes. */
let rechercheMinuteur=null;
function lancerRecherche(q){
  clearTimeout(rechercheMinuteur);
  rechercheMinuteur=setTimeout(async ()=>{
    const zone=document.getElementById('resultats');
    zone.innerHTML=`<div class="vide">Recherche…</div>`;
    try{
      const r=await fetch('/api/recherche/global?q='+encodeURIComponent(q), {credentials:'include'});
      const d=await r.json();
      if(!d.success){ zone.innerHTML=`<div class="vide">${escHtml(d.error||'Erreur')}</div>`; return; }
      const items=d.data.items||[];
      if(!items.length){
        zone.innerHTML = q.trim()
          ? `<div class="vide">{{T_AUCUN_RESULTAT}}</div>`
          : `<div class="vide">Tapez pour rechercher dans le wiki VEX, Wikipédia et les extensions.</div>`;
        return;
      }
      // Un seul type par icone/libelle -- evite de repeter la logique dans
      // chaque branche et rend l'ajout d'une future source (ex: Recherche >
      // Fichiers partages) triviale.
      const TYPES = {
        wiki:      { icone:'book',        label:'Wiki VEX' },
        wikipedia: { icone:'globe',       label:'Wikipédia' },
        extension: { icone:'puzzle-piece',label:'Extension' },
      };
      // Items gardes en memoire (indexes par position) plutot que le titre
      // serialise dans l'attribut onclick -- un titre Wikipedia avec une
      // apostrophe, ex. "Cote d'Ivoire", casserait une chaine JS inline.
      S.derniersItems = items;
      zone.innerHTML=items.map((it,i)=>{
        const t = TYPES[it.type] || { icone:'circle-question', label:it.type };
        const enTete = `<div class="res-type"><img class="ico ico-sm" src="/static/img/solid/${t.icone}.svg" alt=""> ${escHtml(t.label)}</div>
          <div class="res-titre">${surligner(it.titre, q)}</div>
          <div class="res-extrait">${surligner(it.extrait, q)}</div>`;

        if(it.type==='wiki'){
          return `<div class="res-item t-wiki" onclick="wikiOuvrirArticle(${it.id})">${enTete}
            <div class="res-meta">${escHtml(it.meta)}</div>
          </div>`;
        }
        // Wikipedia : ouvre l'article DANS VEX (meme lecteur que le wiki
        // interne), jamais un nouvel onglet vers wikipedia.org -- demande
        // utilisateur : une vraie interface unifiee, pas juste un lien.
        if(it.type==='wikipedia'){
          return `<div class="res-item t-wikipedia" onclick="wikipediaOuvrirArticle(${i})">${enTete}
            <div class="res-meta">${escHtml(it.meta)}</div>
          </div>`;
        }
        return `<div class="res-item t-extension">${enTete}
          <div class="res-meta">${it.url?`<a class="res-dl" href="${escHtml(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Télécharger</a>`:''}</div>
        </div>`;
      }).join('');
    }catch(e){
      // FIX (debug) : affiche le vrai message d'erreur au lieu d'un
      // "Erreur réseau" generique qui masquait tout probleme de rendu
      // (ex: exception JS pendant la construction du HTML) -- si ca
      // recasse un jour, le message visible dira exactement pourquoi.
      console.error('[recherche] lancerRecherche a échoué :', e);
      zone.innerHTML=`<div class="vide">Erreur : ${escHtml(e && e.message || String(e))}</div>`;
    }
  }, 300);
}
document.getElementById('q').addEventListener('input', e => lancerRecherche(e.target.value));

/* ══════════════ Wiki (lecture/ecriture d'un article) ══════════════ */
async function wikiOuvrirArticle(id){
  try{
    const r=await fetch('/api/recherche/wiki/article?id='+id, {credentials:'include'});
    const d=await r.json();
    if(!d.success){ toast(d.error||'Erreur'); return; }
    const a=d.data;
    S.articleActuel=a;
    const peutModifier = (a.auteur_id===MON_ID) || MON_PRIVILEGE<=6;
    document.getElementById('wiki-article-contenu').innerHTML=`
      <h2 style="font-size:1.25rem">${escHtml(a.titre)}</h2>
      <div class="res-meta" style="margin-top:6px">Par ${escHtml(a.auteur_nom||'?')} · maj ${escHtml(a.maj)} · ${a.vues||0} vue(s)</div>
      <div class="contenu">${escHtml(a.contenu)}</div>
      ${peutModifier?`<div class="actions">
        <button class="btn-secondaire" onclick="wikiOuvrirEdition(${a.id})"><img class="ico ico-sm" src="/static/img/solid/pen.svg" alt=""> Modifier</button>
        <button class="btn-secondaire" onclick="wikiSupprimer(${a.id})"><img class="ico ico-sm" src="/static/img/solid/trash.svg" alt=""> Supprimer</button>
      </div>`:''}
    `;
    document.getElementById('vue-resultats').style.display='none';
    document.getElementById('wiki-article-vue').style.display='block';
  }catch(e){ toast('Erreur réseau'); }
}
function wikiFermerArticle(){
  document.getElementById('wiki-article-vue').style.display='none';
  document.getElementById('vue-resultats').style.display='block';
  lancerRecherche(document.getElementById('q').value);
}

/* ══════════════ Wikipedia (lecture seule, ouverte DANS VEX) ══════════════
   Meme lecteur que le wiki interne (#wiki-article-vue) -- une seule
   interface unifiee, pas de redirection vers wikipedia.org. Le contenu est
   mis en cache localement des la premiere ouverture (wikipedia_cache cote
   serveur) : relire le meme article ne refait plus d'appel reseau. */
// L'API Wikipedia (prop=extracts&explaintext=1) renvoie du texte brut ou
// les sections gardent leur marquage wiki litteral ("== Titre ==",
// "=== Sous-titre ===") -- affiche tel quel avec escHtml + pre-wrap, ca
// ressemble a un dump de fichier, pas a une page d'encyclopedie. Convertit
// ici ce marquage en vrais titres HTML (avec ancre) + un sommaire cliquable
// genere a partir des titres de section, comme sur une vraie page
// Wikipedia -- mais stylise avec les couleurs du theme VEX (voir .wp-*
// dans le <style>), pas celles de Wikipedia.
function formaterArticleWikipedia(texte){
  const lignes = String(texte||'').split('\n');
  let html = '';
  const sommaire = []; // {niveau, ancre, titre}
  let compteur = 0;
  let paragrapheCourant = [];
  const viderParagraphe = () => {
    const t = paragrapheCourant.join(' ').trim();
    if(t) html += `<p>${escHtml(t)}</p>`;
    paragrapheCourant = [];
  };
  for(const ligne of lignes){
    const m = ligne.match(/^(={2,6})\s*(.+?)\s*\1$/);
    if(m){
      viderParagraphe();
      const niveau = Math.min(m[1].length, 4); // == -> h2 (le titre principal est deja affiche a part, en .wp-titre)
      const titreSection = m[2].trim();
      const ancre = 'wp-sec-'+(++compteur);
      html += `<h${niveau} id="${ancre}">${escHtml(titreSection)}</h${niveau}>`;
      sommaire.push({niveau, ancre, titre: titreSection});
    }else if(ligne.trim()===''){
      viderParagraphe();
    }else{
      paragrapheCourant.push(ligne.trim());
    }
  }
  viderParagraphe();
  return { html: html || `<p>${escHtml(texte)}</p>`, sommaire };
}

function rendreSommaire(sommaire){
  if(sommaire.length < 2) return ''; // pas utile pour un article a une seule section
  // Version allegee : une simple ligne de liens (pas un encadre), les
  // sous-sections (niveau 3+) en plus discret.
  const items = sommaire.map(s=>`<a href="#${s.ancre}" style="${s.niveau>2?'opacity:.7;font-size:.95em':''}">${escHtml(s.titre)}</a>`).join('');
  return `<div class="wp-sommaire">${items}</div>`;
}

async function wikipediaOuvrirArticle(index){
  const it = S.derniersItems && S.derniersItems[index];
  if(!it){ toast('Article introuvable'); return; }
  try{
    const r=await fetch('/api/recherche/wikipedia/article?titre='+encodeURIComponent(it.titre), {credentials:'include'});
    const d=await r.json();
    if(!d.success){ toast(d.error||'Erreur'); return; }
    const a=d.data;
    const { html, sommaire } = formaterArticleWikipedia(a.contenu);
    document.getElementById('wiki-article-contenu').innerHTML=`
      <div class="wp-titre">${escHtml(a.titre)}</div>
      <div class="res-meta">Wikipédia ${a.source_locale?'· servi depuis le cache local VEX':'· mis en cache localement'}</div>
      ${rendreSommaire(sommaire)}
      <div class="wp-contenu">${html}</div>
    `;
    document.getElementById('vue-resultats').style.display='none';
    document.getElementById('wiki-article-vue').style.display='block';
  }catch(e){ toast('Erreur réseau'); }
}
function wikiOuvrirEdition(id){
  const article = id ? S.articleActuel : null;
  document.getElementById('wiki-edit-id').value = id||'';
  document.getElementById('wiki-edit-titre').value = article ? article.titre : '';
  document.getElementById('wiki-edit-contenu').value = article ? article.contenu : '';
  document.getElementById('wiki-modal').style.display='flex';
}
async function wikiEnregistrer(){
  const id=document.getElementById('wiki-edit-id').value;
  const titre=document.getElementById('wiki-edit-titre').value.trim();
  const contenu=document.getElementById('wiki-edit-contenu').value.trim();
  if(!titre||!contenu){ toast('Titre et contenu obligatoires'); return; }
  try{
    const r=await fetch('/api/recherche/wiki/save', {method:'POST', credentials:'include',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'id='+encodeURIComponent(id)+'&titre='+encodeURIComponent(titre)+'&contenu='+encodeURIComponent(contenu)});
    const d=await r.json();
    toast(d.success?d.message:d.error);
    if(d.success){
      document.getElementById('wiki-modal').style.display='none';
      if(id){ wikiOuvrirArticle(id); } else { document.getElementById('q').value=titre; lancerRecherche(titre); }
    }
  }catch(e){ toast('Erreur réseau'); }
}
async function wikiSupprimer(id){
  if(!window.confirm('Supprimer cet article du wiki ?')) return;
  try{
    const r=await fetch('/api/recherche/wiki/delete', {method:'POST', credentials:'include',
      headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'id='+encodeURIComponent(id)});
    const d=await r.json();
    toast(d.success?d.message:d.error);
    if(d.success) wikiFermerArticle();
  }catch(e){ toast('Erreur réseau'); }
}

document.addEventListener('DOMContentLoaded', () => {
  chargerAbonnement();
  lancerRecherche('');
});
</script>
  <script src="/static/pwa-register.js" defer></script>
