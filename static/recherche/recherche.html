<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{T_TITRE_ONGLET}}</title>
  <link rel="icon" href="/static/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4fa553">
  <link rel="apple-touch-icon" href="/static/img/icon-192.png">
  <style>
.ico { display:inline-block; width:16px; height:16px; vertical-align:middle; flex-shrink:0; }
.ico-sm { width:14px; height:14px; }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.main-container { display:flex; min-height:100vh; }
.contenu { flex:1; padding:32px 24px; max-width:900px; margin:0 auto; width:100%; }
h1 { font-size:1.4rem; margin-bottom:18px; display:flex; align-items:center; gap:10px; }
.search-box { display:flex; gap:10px; margin-bottom:24px; }
.search-box input {
  flex:1; padding:11px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--input, var(--surface)); color:var(--text); font-size:14px;
}
.abonnement-card {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:16px 18px; margin-bottom:24px; display:flex; align-items:center; gap:14px;
  font-size:13.5px;
}
.abonnement-card .badge {
  padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px;
  background:var(--accent); color:#fff;
}
.abonnement-card .badge.inactif { background:var(--border); color:var(--text-m,var(--text)); }
.resultats { display:flex; flex-direction:column; gap:10px; }
.ext-card {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px;
}
.ext-card .nom { font-weight:600; font-size:14px; word-break:break-all; }
.ext-card .meta { font-size:12px; color:var(--text-m,var(--text)); opacity:.75; }
.ext-card a.btn {
  padding:7px 12px; border-radius:7px; background:var(--accent); color:#fff;
  text-decoration:none; font-size:12.5px; font-weight:600; flex-shrink:0;
}
.vide { text-align:center; padding:30px; opacity:.65; font-size:13.5px; }

/* ── Onglets (apps de recherche, visibles UNIQUEMENT ici) ── */
.tabs { display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.tab {
  padding:9px 16px; border:none; background:none; color:var(--text-m,var(--text)); opacity:.7;
  font-size:13.5px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
  display:flex; align-items:center; gap:7px; margin-bottom:-1px;
}
.tab:hover { opacity:1; }
.tab.actif { opacity:1; color:var(--accent); border-bottom-color:var(--accent); }
.vue { display:none; }
.vue.actif { display:block; }

/* ── Wiki / FAQ ── */
.wiki-card {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; margin-bottom:10px; cursor:pointer;
}
.wiki-card:hover { border-color:var(--accent); }
.wiki-card .titre { font-weight:700; font-size:14.5px; margin-bottom:4px; }
.wiki-card .extrait { font-size:13px; opacity:.8; line-height:1.5; margin-bottom:6px; }
.wiki-card .meta { font-size:11.5px; opacity:.6; }
.btn-primaire {
  padding:9px 16px; border-radius:8px; background:var(--accent); color:#fff; border:none;
  font-size:13.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
}
.btn-secondaire {
  padding:9px 16px; border-radius:8px; background:var(--surface); border:1px solid var(--border); color:var(--text);
  font-size:13.5px; font-weight:600; cursor:pointer;
}
.barre-actions { display:flex; justify-content:flex-end; margin-bottom:14px; }
.modal-bg2 {
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
  z-index:6000; padding:20px;
}
.modal-box2 {
  background:var(--surface); border-radius:12px; padding:22px; width:100%; max-width:640px;
  max-height:85vh; overflow-y:auto;
}
.modal-box2 input, .modal-box2 textarea {
  width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--input,var(--bg)); color:var(--text); font-size:14px; margin-bottom:12px; font-family:inherit;
}
.modal-box2 textarea { resize:vertical; min-height:160px; line-height:1.5; }
.article-full .contenu { white-space:pre-wrap; line-height:1.7; font-size:14.5px; margin:16px 0; }
.article-full .actions { display:flex; gap:8px; margin-top:16px; }
.retour { background:none; border:none; color:var(--accent); font-weight:600; cursor:pointer; font-size:13.5px; margin-bottom:14px; display:inline-flex; align-items:center; gap:6px; }
  </style>
</head>
<body>

__NAV_HTML__

<div id="toast-area" style="position:fixed;bottom:24px;right:24px;z-index:5000;display:flex;flex-direction:column;gap:10px;pointer-events:none;"></div>

<script>
{{I18N_JS}}
function escHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toast(msg, type='info'){
  const area=document.getElementById('toast-area');
  const el=document.createElement('div');
  el.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15);';
  el.textContent=msg;
  area.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>area.removeChild(el),300); }, 3500);
}

function formatTaille(o){
  if(!o || o<1024) return (o||0)+' o';
  const u=['Ko','Mo','Go']; let n=o, i=-1;
  do{ n/=1024; i++; }while(n>=1024 && i<u.length-1);
  return n.toFixed(1)+' '+u[i];
}

async function chargerAbonnement(){
  try{
    const r=await fetch('/api/recherche/abonnement', {credentials:'include'});
    const d=await r.json();
    if(!d.success) return;
    const card=document.getElementById('abonnement-card');
    const badge=document.getElementById('abonnement-badge');
    const texte=document.getElementById('abonnement-texte');
    card.style.display='flex';
    if(d.data.actif){
      badge.textContent = d.data.plan_nom || 'VIP';
      badge.classList.remove('inactif');
      texte.textContent = d.data.montant_eur > 0
        ? `${d.data.montant_eur.toFixed(2)} € / mois`
        : d.data.plan_nom;
    }else{
      badge.textContent = 'Free';
      badge.classList.add('inactif');
      texte.textContent = d.data.plan_nom || '';
    }
  }catch(e){ /* pas bloquant */ }
}

let rechercheMinuteur=null;
function rechercherExtensions(q){
  clearTimeout(rechercheMinuteur);
  rechercheMinuteur=setTimeout(async ()=>{
    const zone=document.getElementById('resultats');
    try{
      const r=await fetch('/api/recherche/extensions?q='+encodeURIComponent(q), {credentials:'include'});
      const d=await r.json();
      if(!d.success){ zone.innerHTML=`<div class="vide">${escHtml(d.error||'Erreur')}</div>`; return; }
      const items=d.data.items||[];
      if(!items.length){ zone.innerHTML=`<div class="vide">{{T_AUCUN_RESULTAT}}</div>`; return; }
      zone.innerHTML=items.map(it=>`
        <div class="ext-card">
          <div>
            <div class="nom">${escHtml(it.nom)}</div>
            <div class="meta">${formatTaille(it.taille)} · ${it.telechargements||0} {{T_TELECHARGEMENTS}}</div>
          </div>
          ${it.url ? `<a class="btn" href="${escHtml(it.url)}" target="_blank" rel="noopener">Télécharger</a>` : ''}
        </div>`).join('');
    }catch(e){
      zone.innerHTML=`<div class="vide">Erreur réseau</div>`;
    }
  }, 300);
}

document.getElementById('q').addEventListener('input', e => rechercherExtensions(e.target.value));

/* ══════════════ Onglets (apps de recherche) ══════════════ */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('actif'));
    document.querySelectorAll('.vue').forEach(v=>v.classList.remove('actif'));
    btn.classList.add('actif');
    document.getElementById('vue-'+btn.dataset.tab).classList.add('actif');
    if(btn.dataset.tab==='wiki' && !S.wikiCharge){ S.wikiCharge=true; rechercherWiki(''); }
    if(btn.dataset.tab==='faq' && !S.faqCharge){ S.faqCharge=true; rechercherFaq(''); }
  });
});
const S={wikiCharge:false,faqCharge:false};

/* ══════════════ Wiki ══════════════ */
let wikiMinuteur=null;
function rechercherWiki(q){
  clearTimeout(wikiMinuteur);
  wikiMinuteur=setTimeout(async ()=>{
    const zone=document.getElementById('wiki-resultats');
    try{
      const r=await fetch('/api/recherche/wiki?q='+encodeURIComponent(q), {credentials:'include'});
      const d=await r.json();
      if(!d.success){ zone.innerHTML=`<div class="vide">${escHtml(d.error||'Erreur')}</div>`; return; }
      const items=d.data.items||[];
      if(!items.length){ zone.innerHTML=`<div class="vide">Aucun article. Soyez le premier à en créer un !</div>`; return; }
      zone.innerHTML=items.map(it=>`
        <div class="wiki-card" onclick="wikiOuvrirArticle(${it.id})">
          <div class="titre">${escHtml(it.titre)}</div>
          <div class="extrait">${escHtml(it.extrait)}</div>
          <div class="meta">Par ${escHtml(it.auteur_nom||'?')} · maj ${escHtml(it.maj)} · ${it.vues||0} vue(s)</div>
        </div>`).join('');
    }catch(e){
      zone.innerHTML=`<div class="vide">Erreur réseau</div>`;
    }
  }, 300);
}
document.getElementById('wiki-q').addEventListener('input', e => rechercherWiki(e.target.value));

async function wikiOuvrirArticle(id){
  try{
    const r=await fetch('/api/recherche/wiki/article?id='+id, {credentials:'include'});
    const d=await r.json();
    if(!d.success){ toast(d.error||'Erreur'); return; }
    const a=d.data;
    S.articleActuel=a;
    const peutModifier = (a.auteur_id===MON_ID) || MON_PRIVILEGE<=6;
    document.getElementById('wiki-article-contenu').innerHTML=`
      <h2 style="font-size:1.25rem">${escHtml(a.titre)}</h2>
      <div class="meta" style="margin-top:6px;font-size:12px;opacity:.65">Par ${escHtml(a.auteur_nom||'?')} · maj ${escHtml(a.maj)} · ${a.vues||0} vue(s)</div>
      <div class="contenu">${escHtml(a.contenu)}</div>
      ${peutModifier?`<div class="actions">
        <button class="btn-secondaire" onclick="wikiOuvrirEdition(${a.id})"><img class="ico ico-sm" src="/static/img/solid/pen.svg" alt=""> Modifier</button>
        <button class="btn-secondaire" onclick="wikiSupprimer(${a.id})"><img class="ico ico-sm" src="/static/img/solid/trash.svg" alt=""> Supprimer</button>
      </div>`:''}
    `;
    document.getElementById('wiki-liste-vue').style.display='none';
    document.getElementById('wiki-article-vue').style.display='block';
  }catch(e){ toast('Erreur réseau'); }
}
function wikiFermerArticle(){
  document.getElementById('wiki-article-vue').style.display='none';
  document.getElementById('wiki-liste-vue').style.display='block';
  rechercherWiki(document.getElementById('wiki-q').value);
}
function wikiOuvrirEdition(id){
  const article = id ? S.articleActuel : null;
  document.getElementById('wiki-edit-id').value = id||'';
  document.getElementById('wiki-edit-titre').value = article ? article.titre : '';
  document.getElementById('wiki-edit-contenu').value = article ? article.contenu : '';
  document.getElementById('wiki-modal').style.display='flex';
}
async function wikiEnregistrer(){
  const id=document.getElementById('wiki-edit-id').value;
  const titre=document.getElementById('wiki-edit-titre').value.trim();
  const contenu=document.getElementById('wiki-edit-contenu').value.trim();
  if(!titre||!contenu){ toast('Titre et contenu obligatoires'); return; }
  try{
    const r=await fetch('/api/recherche/wiki/save', {method:'POST', credentials:'include',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'id='+encodeURIComponent(id)+'&titre='+encodeURIComponent(titre)+'&contenu='+encodeURIComponent(contenu)});
    const d=await r.json();
    toast(d.success?d.message:d.error);
    if(d.success){
      document.getElementById('wiki-modal').style.display='none';
      if(id){ wikiOuvrirArticle(id); } else { wikiFermerArticle(); }
    }
  }catch(e){ toast('Erreur réseau'); }
}
async function wikiSupprimer(id){
  if(!await confirmerDialogueLocal('Supprimer cet article du wiki ?')) return;
  try{
    const r=await fetch('/api/recherche/wiki/delete', {method:'POST', credentials:'include',
      headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'id='+encodeURIComponent(id)});
    const d=await r.json();
    toast(d.success?d.message:d.error);
    if(d.success) wikiFermerArticle();
  }catch(e){ toast('Erreur réseau'); }
}

/* ══════════════ FAQ ══════════════ */
if(MON_PRIVILEGE<=6) document.getElementById('faq-actions').style.display='flex';
let faqMinuteur=null;
function rechercherFaq(q){
  clearTimeout(faqMinuteur);
  faqMinuteur=setTimeout(async ()=>{
    const zone=document.getElementById('faq-resultats');
    try{
      const r=await fetch('/api/recherche/faq?q='+encodeURIComponent(q), {credentials:'include'});
      const d=await r.json();
      if(!d.success){ zone.innerHTML=`<div class="vide">${escHtml(d.error||'Erreur')}</div>`; return; }
      const items=d.data.items||[];
      if(!items.length){ zone.innerHTML=`<div class="vide">Aucune question pour l'instant.</div>`; return; }
      // Items gardes en memoire (indexes par id) plutot que serialises dans
      // un attribut onclick -- une reponse contenant un guillemet simple
      // casserait l'attribut HTML et permettrait une injection de script.
      S.faqItems={};
      items.forEach(it=>{ S.faqItems[it.id]=it; });
      const peutModifier = MON_PRIVILEGE<=6;
      zone.innerHTML=items.map(it=>`
        <div class="wiki-card" style="cursor:default">
          <div class="titre">${escHtml(it.question)}</div>
          <div class="extrait">${escHtml(it.reponse)}</div>
          ${peutModifier?`<div class="actions">
            <button class="btn-secondaire" onclick="faqOuvrirEdition(${it.id})"><img class="ico ico-sm" src="/static/img/solid/pen.svg" alt=""> Modifier</button>
            <button class="btn-secondaire" onclick="faqSupprimer(${it.id})"><img class="ico ico-sm" src="/static/img/solid/trash.svg" alt=""> Supprimer</button>
          </div>`:''}
        </div>`).join('');
    }catch(e){
      zone.innerHTML=`<div class="vide">Erreur réseau</div>`;
    }
  }, 300);
}
document.getElementById('faq-q').addEventListener('input', e => rechercherFaq(e.target.value));

function faqOuvrirEdition(id){
  const entree = id ? S.faqItems[id] : null;
  document.getElementById('faq-edit-id').value = entree ? entree.id : '';
  document.getElementById('faq-edit-question').value = entree ? entree.question : '';
  document.getElementById('faq-edit-reponse').value = entree ? entree.reponse : '';
  document.getElementById('faq-modal').style.display='flex';
}
async function faqEnregistrer(){
  const id=document.getElementById('faq-edit-id').value;
  const question=document.getElementById('faq-edit-question').value.trim();
  const reponse=document.getElementById('faq-edit-reponse').value.trim();
  if(!question||!reponse){ toast('Question et réponse obligatoires'); return; }
  try{
    const r=await fetch('/api/recherche/faq/save', {method:'POST', credentials:'include',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'id='+encodeURIComponent(id)+'&question='+encodeURIComponent(question)+'&reponse='+encodeURIComponent(reponse)});
    const d=await r.json();
    toast(d.success?d.message:d.error);
    if(d.success){ document.getElementById('faq-modal').style.display='none'; rechercherFaq(document.getElementById('faq-q').value); }
  }catch(e){ toast('Erreur réseau'); }
}
async function faqSupprimer(id){
  if(!await confirmerDialogueLocal('Supprimer cette entrée FAQ ?')) return;
  try{
    const r=await fetch('/api/recherche/faq/delete', {method:'POST', credentials:'include',
      headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'id='+encodeURIComponent(id)});
    const d=await r.json();
    toast(d.success?d.message:d.error);
    if(d.success) rechercherFaq(document.getElementById('faq-q').value);
  }catch(e){ toast('Erreur réseau'); }
}

/* ── Petit dialogue de confirmation local (recherche.html n'a pas la
   modale complete de admin.html) -- utilise le confirm() natif. ── */
function confirmerDialogueLocal(message){ return Promise.resolve(window.confirm(message)); }

document.addEventListener('DOMContentLoaded', () => {
  chargerAbonnement();
  rechercherExtensions('');
});
</script>
  <script src="/static/pwa-register.js" defer></script>
</body>
