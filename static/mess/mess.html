<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Messagerie — VEX</title>
<link rel="icon" href="/static/img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/static/css/theme.css">
<style>

/* ══ Icônes SVG (système VEX standard) ══ */
.ico     { display:inline-block; width:16px; height:16px; vertical-align:middle; flex-shrink:0; }
.ico-lg  { width:48px; height:48px; }
.ico-md  { width:24px; height:24px; }
.ico-sm  { width:14px; height:14px; }
.ico-18  { width:18px; height:18px; }
.ico-20  { width:20px; height:20px; }
.ico-32  { width:32px; height:32px; }
.ico-52  { width:52px; height:52px; }
.ico-primary { filter: invert(48%) sepia(79%) saturate(476%) hue-rotate(86deg) brightness(95%) contrast(89%); }
.ico-muted   { filter: invert(44%) sepia(9%)  saturate(322%) hue-rotate(182deg) brightness(92%) contrast(89%); }
.ico-white   { filter: brightness(0) invert(1); }
.ico-red     { filter: invert(27%) sepia(88%) saturate(1200%) hue-rotate(335deg) brightness(92%) contrast(95%); }
[data-theme="dark"] .ico-muted { filter: invert(72%) sepia(5%) saturate(400%) hue-rotate(180deg) brightness(85%); }
@keyframes ico-spin { to { transform:rotate(360deg); } }
.ico-spin { animation: ico-spin .8s linear infinite; }

/* ══ Reset ══ */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  padding-top: 56px;
  -webkit-font-smoothing: antialiased;
}

/* ══ Layout ══ */
.app  { display:flex; height:calc(100vh - 56px); overflow:hidden; }

/* ══ Sidebar ══ */
.sidebar {
  width: 240px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  padding: 16px 10px;
}

/* Recherche dans la sidebar */
.sidebar-search {
  position: relative;
  margin-bottom: 16px;
}
.sidebar-search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  background: var(--input);
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-search .ico-search {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
}

/* Bouton Nouveau */
.btn-nouveau {
  width: 100%;
  padding: 10px 16px;
  background: var(--accent);
  color: var(--surface);
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  transition: background .2s;
  font-family: inherit;
}
.btn-nouveau:hover { background: var(--vex-green-2); }

/* Dossiers */
.folder-section { margin-bottom: 6px; }
.folder-label-sep {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 4px 12px 8px;
  letter-spacing: .06em;
}
.folder {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  border: none;
  background: none;
  width: 100%;
  font-family: inherit;
  transition: background .15s;
  margin: 2px 0;
}
.folder:hover { background: var(--sidebar-hover); }
.folder.active { background: var(--accent); color: var(--surface); font-weight: 600; }
.folder.active .ico { filter: brightness(0) invert(1); }
.folder-badge {
  margin-left: auto;
  background: var(--danger);
  color: var(--surface);
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  display: none;
}

/* Pied sidebar */
.sidebar-foot {
  margin-top: auto;
  padding: 14px 12px 4px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
}
.key-info {
  margin-top: 8px;
  padding: 8px 10px;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
  border-radius: 6px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ══ Liste messages ══ */
.msg-list {
  width: 310px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
}
.msg-item {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  position: relative;
}
.msg-item:hover  { background: var(--sidebar-hover); }
.msg-item.active { background: var(--alt); border-left: 3px solid var(--accent); }
.msg-item.unread .msg-from,
.msg-item.unread .msg-subj { font-weight: 700; }
.msg-row  { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.msg-from { font-size:14px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.msg-date { font-size:11px; color:var(--text-dim); white-space:nowrap; margin-left:6px; }
.msg-subj { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:2px; }
.msg-prev { font-size:12px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.msg-lock { position:absolute; right:10px; bottom:10px; opacity:.4; }

/* ══ Contenu message ══ */
.msg-content {
  flex: 1;
  overflow-y: auto;
  padding: 28px 32px;
  background: var(--bg);
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  text-align: center;
}
.empty-state p     { margin-top: 14px; font-size: 15px; }
.empty-state small { margin-top: 6px; font-size: 12px; opacity:.6; }

.msg-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.msg-card-hdr {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}
.msg-actions { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.msg-title   { font-size:20px; font-weight:600; margin-bottom:14px; }
.sender-row  { display:flex; gap:14px; align-items:flex-start; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--blue));
  display: flex; align-items: center; justify-content: center;
  color: var(--surface); font-size: 17px; font-weight: 700; flex-shrink: 0;
}
.sender-name  { font-weight:600; font-size:14px; margin-bottom:2px; }
.sender-email { color:var(--text-dim); font-size:12px; margin-bottom:4px; }
.msg-meta     { font-size:12px; color:var(--text-dim); }
.enc-stamp {
  display: inline-flex; align-items: center; gap:5px;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
  border-radius: 4px; padding: 3px 8px;
  font-size: 11px; color: var(--accent); margin-top: 6px;
}
.msg-body-wrap { padding: 20px 24px; }
.msg-body { line-height:1.75; white-space:pre-wrap; font-size:14px; }
.decrypt-err {
  color: var(--danger); font-size:13px; padding:12px;
  background: color-mix(in srgb, var(--danger) 5%, transparent); border-radius:6px;
  border: 1px solid color-mix(in srgb, var(--danger) 20%, transparent);
  display: flex; align-items:center; gap:8px;
}

/* ══ Boutons génériques ══ */
.btn {
  padding: 8px 14px; border:none; border-radius:6px;
  cursor:pointer; font-size:13px; font-weight:600;
  transition: all .2s; display:inline-flex; align-items:center;
  gap:7px; font-family:inherit;
}
.btn-primary   { background: var(--accent); color:var(--surface); }
.btn-primary:hover   { background: var(--vex-green-2); }
.btn-secondary { background: transparent; color:var(--text-dim); border:1px solid var(--border); }
.btn-secondary:hover { background: var(--sidebar-hover); }
.btn-danger    { background: var(--danger); color:var(--surface); }
.btn-danger:hover    { background: color-mix(in srgb, var(--danger) 85%, black); }

/* ══ Modal ══ */
.modal {
  display:none; position:fixed; inset:0;
  background: color-mix(in srgb, var(--text) 50%, transparent); z-index:2000;
  align-items:center; justify-content:center;
}
.modal.active { display:flex; }
.modal-content {
  background: var(--surface);
  border-radius: 12px; width:90%; max-width:560px;
  max-height: 90vh; overflow-y:auto;
  box-shadow: 0 8px 32px color-mix(in srgb, var(--text) 25%, transparent);
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content:space-between; align-items:center;
  font-size: 17px; font-weight:600;
}
.modal-header-title { display:flex; align-items:center; gap:10px; }
.close-btn {
  background:none; border:none; font-size:22px;
  cursor:pointer; color:var(--text-dim); line-height:1;
}
.close-btn:hover { color:var(--text); }
.modal-body   { padding: 20px 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; justify-content:space-between; align-items:center;
}
.enc-note { font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:5px; }

/* ══ Formulaire ══ */
.form-group { margin-bottom: 14px; }
.form-group label {
  display:block; margin-bottom:5px;
  font-weight:600; font-size:13px; color:var(--text);
}
.form-group input,
.form-group textarea {
  width:100%; padding: 9px 12px;
  border: 1px solid var(--border); border-radius:6px;
  font-size:14px; outline:none;
  background: var(--input); color:var(--text);
  transition: border-color .2s; font-family:inherit;
}
.form-group input:focus,
.form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { min-height:160px; resize:vertical; }

/* Autocomplétion */
.ac { position:relative; }
.ac-list {
  position:absolute; top:100%; left:0; right:0; z-index:100;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top:none; border-radius:0 0 6px 6px;
  max-height:150px; overflow-y:auto; display:none;
}
.ac-item { padding:8px 12px; cursor:pointer; font-size:13px; }
.ac-item:hover { background: var(--sidebar-hover); }
.ac-item small { color:var(--text-dim); font-size:11px; display:block; }

/* ══ Spinner / Toast ══ */
.spinner-wrap { display:flex; align-items:center; justify-content:center; padding:40px; }
.spinner {
  border: 3px solid var(--border);
  border-top: 3px solid var(--accent);
  border-radius:50%; width:32px; height:32px;
  animation: ico-spin .8s linear infinite;
}

#toast-area {
  position:fixed; bottom:24px; right:24px;
  z-index:5000; display:flex; flex-direction:column;
  gap:10px; pointer-events:none;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius:8px; box-shadow:0 4px 12px color-mix(in srgb, var(--text) 15%, transparent);
  padding:12px 18px; font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:10px;
  animation: toast-in .25s ease; pointer-events:all; max-width:340px;
}
@keyframes toast-in { from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);} }
.toast.ok   { border-left: 4px solid var(--accent); }
.toast.err  { border-left: 4px solid var(--danger); }
.toast.warn { border-left: 4px solid var(--orange); }
</style>
</head>
<body>

<!-- Navbar VEX injectée (position:fixed, z-index:1000) -->
<div id="vex-navbar"></div>

<div class="app">

  <!-- ══ Sidebar ══ -->
  <aside class="sidebar">

    <button class="btn-nouveau" id="composeBtn">

      Nouveau message

    <div class="folder-section">

  <!-- ══ Liste messages ══ -->

    <div class="empty-state">
      <img class="ico ico-52 ico-muted" src="/static/img/solid/lock.svg">

      <small>Déchiffrement local · clé privée</small>
    </div>
  </div>

</div>

<!-- ══ Modal composer ══ -->
<div class="modal" id="composeModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-header-title">
        <img class="ico ico-20 ico-primary" src="/static/img/solid/lock.svg">
        Nouveau message
      </div>
      <button class="close-btn" id="closeModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group ac">
        <label>À (email)</label>
        <input type="text" id="toInput" placeholder="destinataire@…" autocomplete="off">
        <div class="ac-list" id="acList"></div>
      </div>
      <div class="form-group">
        <label>Objet</label>

      </div>

      <div class="enc-note">
        <img class="ico ico-sm ico-primary" src="/static/img/solid/shield-halved.svg">
        Chiffré E2E · clé publique du destinataire
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-secondary" id="cancelBtn">Annuler</button>
        <button class="btn btn-primary" id="sendBtn">
          <img class="ico ico-sm ico-white" src="/static/img/solid/paper-plane.svg">
          Envoyer
        </button>
      </div>

  </div>
</div>

<div id="toast-area"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════
const API      = '/api/mess';
const ICO      = '/static/img/solid/';
const KEY_STORE= 'vex_mess_privkey';
const THEMES   = ['light','dark','solarized','rose'];

let ME           = '';
let privateKey   = null;
let messages     = [];
let decrypted    = {};
let allUsers     = [];
let currentFolder= 'inbox';
let selectedMsg  = null;

// ════════════════════════════════════════════════════════════════
// AUTH — redirige vers /login si session invalide (401)
// ════════════════════════════════════════════════════════════════
function redirectLogin() {
  window.location.href = '/login/login';
}

async function apiFetch(url, options = {}) {
  const r = await fetch(url, { ...options, credentials: 'include' });
  if (r.status === 401) {
    redirectLogin();
    throw new Error('Session expirée');
  }
  return r;
}

// ════════════════════════════════════════════════════════════════
// CRYPTO — ECDH P-256 + AES-GCM 256
// ════════════════════════════════════════════════════════════════
const ECDH = { name:'ECDH', namedCurve:'P-256' };

const genKP    = ()       => crypto.subtle.generateKey(ECDH, true, ['deriveKey','deriveBits']);
const expPub   = k        => crypto.subtle.exportKey('spki',  k).then(r => btoa(String.fromCharCode(...new Uint8Array(r))));
const expPriv  = k        => crypto.subtle.exportKey('pkcs8', k).then(r => btoa(String.fromCharCode(...new Uint8Array(r))));
const impPub   = b64      => crypto.subtle.importKey('spki',  Uint8Array.from(atob(b64),c=>c.charCodeAt(0)), ECDH, true, []);
const impPriv  = b64      => crypto.subtle.importKey('pkcs8', Uint8Array.from(atob(b64),c=>c.charCodeAt(0)), ECDH, true, ['deriveKey','deriveBits']);
const deriveAES= (pr,pu)  => crypto.subtle.deriveBits({name:'ECDH',public:pu},pr,256)
  .then(b => crypto.subtle.importKey('raw',b,{name:'AES-GCM'},false,['encrypt','decrypt']));

async function encryptFor(text, recipPub) {
  const eph    = await genKP();
  const ephPub = await expPub(eph.publicKey);
  const aes    = await deriveAES(eph.privateKey, recipPub);
  const iv     = crypto.getRandomValues(new Uint8Array(12));
  const ct     = await crypto.subtle.encrypt({name:'AES-GCM',iv}, aes, new TextEncoder().encode(text));
  return JSON.stringify({ eph_pub:ephPub, iv:btoa(String.fromCharCode(...iv)), ct:btoa(String.fromCharCode(...new Uint8Array(ct))) });
}

async function decryptWith(payload, myPriv) {
  const {eph_pub,iv:ivB64,ct:ctB64} = JSON.parse(payload);
  const aes = await deriveAES(myPriv, await impPub(eph_pub));
  const iv  = Uint8Array.from(atob(ivB64),c=>c.charCodeAt(0));
  const ct  = Uint8Array.from(atob(ctB64),c=>c.charCodeAt(0));
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},aes,ct));
}

// ════════════════════════════════════════════════════════════════
// CLÉS — automatique
// ════════════════════════════════════════════════════════════════
async function initKeys() {
  const stored = localStorage.getItem(KEY_STORE);
  if (stored) {
    try {
      const {priv,pub} = JSON.parse(stored);
      privateKey = await impPriv(priv);
      const r    = await apiFetch(`${API}/pubkey`);
      const d    = await r.json();
      if (!d.pub_key) await publishPubKey(pub);
      setKeyOk();
      return;
    } catch(e) {
      if (e.message === 'Session expirée') return;
      console.warn('Clé invalide, régénération', e);
      localStorage.removeItem(KEY_STORE);
    }
  }
  const kp     = await genKP();
  const pub    = await expPub(kp.publicKey);
  const priv   = await expPriv(kp.privateKey);
  localStorage.setItem(KEY_STORE, JSON.stringify({priv,pub}));
  privateKey = kp.privateKey;
  await publishPubKey(pub);
  setKeyOk();
}

async function publishPubKey(pub) {
  await apiFetch(`${API}/pubkey`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({pub_key:pub}),
  });
}

function setKeyOk() {
  document.getElementById('keyIco').classList.remove('ico-spin');
  document.getElementById('keyIco').src = `${ICO}circle-check.svg`;
  document.getElementById('keyLabel').textContent = 'Clés E2E actives';
}

// ════════════════════════════════════════════════════════════════
// INIT UI — navbar + thème + email
// ════════════════════════════════════════════════════════════════
async function initUI() {
  // Navbar VEX
  try {
    const r   = await fetch('/api/mess/navbar');
    if (r.status === 401) { redirectLogin(); return; }
    const html= await r.text();
    const nav = document.getElementById('vex-navbar');
    nav.innerHTML = html;
    nav.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      if (old.src) s.src = old.src; else s.textContent = old.textContent;
      document.body.appendChild(s); old.remove();
    });
  } catch {}

  // Prefs : thème + email (utilise verifier_session côté Rust)
  try {
    const r    = await apiFetch(`${API}/prefs`);
    const data = await r.json();
    if (!data.success) { redirectLogin(); return; }
    document.documentElement.setAttribute('data-theme', THEMES[data.teme] || 'light');
    if (data.user?.email) {
      ME = data.user.email;
      document.getElementById('userEmail').textContent = ME;
    }
  } catch(e) {
    if (e.message !== 'Session expirée') redirectLogin();
  }
}

// ════════════════════════════════════════════════════════════════
// MESSAGES
// ════════════════════════════════════════════════════════════════
async function loadMessages() {
  document.getElementById('msgList').innerHTML =
    '<div class="spinner-wrap"><div class="spinner"></div></div>';
  decrypted = {};
  try {
    const r    = await apiFetch(`${API}/list?folder=${currentFolder}`);
    const data = await r.json();
    if (!data.success) throw new Error(data.error);
    messages = data.messages || [];
    updateBadge(data.unread || 0);
    renderList();
    messages.forEach(m => decryptMsgBg(m));
  } catch(e) {
    if (e.message === 'Session expirée') return;
    document.getElementById('msgList').innerHTML =
      `<div class="empty-state" style="padding:40px;">
        <img class="ico ico-32 ico-red" src="${ICO}circle-exclamation.svg">
        <p style="margin-top:12px;">Erreur de chargement</p>
       </div>`;
  }
}

async function decryptMsg(m) {
  if (decrypted[m.id]) return decrypted[m.id];
  try {
    decrypted[m.id] = {
      subject: await decryptWith(m.subj_enc, privateKey),
      body:    await decryptWith(m.body_enc, privateKey),
      ok: true,
    };
  } catch {
    decrypted[m.id] = { subject:'[Déchiffrement impossible]', body:'', ok:false };
  }
  return decrypted[m.id];
}

async function decryptMsgBg(m) {
  await decryptMsg(m);
  const el = document.querySelector(`.msg-item[data-id="${m.id}"]`);
  if (!el) return;
  const d = decrypted[m.id];
  el.querySelector('.msg-subj').textContent = d.subject;
  el.querySelector('.msg-prev').textContent = d.body.slice(0,60);
}

// ════════════════════════════════════════════════════════════════
// RENDU LISTE
// ════════════════════════════════════════════════════════════════
function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = messages.filter(m => {
    if (!q) return true;
    const d = decrypted[m.id];
    const hay = [m.from_email, m.to_email, d?.subject||'', d?.body||''].join(' ').toLowerCase();
    return hay.includes(q);
  });

  const el = document.getElementById('msgList');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state" style="padding:40px;">
      <img class="ico ico-32 ico-muted" src="${ICO}inbox.svg">
      <p style="margin-top:12px;">Aucun message</p>
    </div>`;
    return;
  }

  el.innerHTML = filtered.map(m => {
    const d      = decrypted[m.id];
    const from   = currentFolder === 'sent' ? m.to_email : m.from_email;
    const subj   = d ? d.subject : '🔒 …';
    const prev   = d ? d.body.slice(0,55) : '';
    const unread = !m.lu && currentFolder !== 'sent';
    const active = selectedMsg?.id === m.id;
    const date   = new Date(m.created_at * 1000).toLocaleDateString('fr-FR');
    return `<div class="msg-item${unread?' unread':''}${active?' active':''}" data-id="${m.id}">
      <div class="msg-row">
        <div class="msg-from">${esc(from.split('@')[0])}</div>
        <span class="msg-date">${date}</span>
      </div>
      <div class="msg-subj">${esc(subj)}</div>
      <div class="msg-prev">${esc(prev)}</div>
      <span class="msg-lock"><img class="ico ico-sm ico-primary" src="${ICO}lock.svg"></span>
    </div>`;
  }).join('');

  el.querySelectorAll('.msg-item').forEach(item =>
    item.onclick = () => selectMessage(+item.dataset.id)
  );
}

// ════════════════════════════════════════════════════════════════
// SÉLECTION MESSAGE
// ════════════════════════════════════════════════════════════════
async function selectMessage(id) {
  const m = messages.find(x => x.id === id); if (!m) return;
  selectedMsg = m;
  if (!m.lu && currentFolder !== 'sent') {
    m.lu = true;
    apiFetch(`${API}/read`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    updateBadge();
  }
  renderList();
  document.getElementById('msgContent').innerHTML =
    '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const d   = await decryptMsg(m);
  const who = currentFolder === 'sent' ? m.to_email : m.from_email;
  const date= new Date(m.created_at*1000).toLocaleString('fr-FR');

  document.getElementById('msgContent').innerHTML = `
    <div class="msg-card">
      <div class="msg-card-hdr">
        <div class="msg-actions">
          <button class="btn btn-secondary" onclick="deselect()">
            <img class="ico ico-sm ico-muted" src="${ICO}arrow-left.svg"> Retour
          </button>
          <button class="btn btn-primary" onclick="replyTo(${m.id})">
            <img class="ico ico-sm ico-white" src="${ICO}reply.svg"> Répondre
          </button>
          ${currentFolder!=='sent'?`<button class="btn btn-danger" onclick="deleteMsg(${m.id})">
            <img class="ico ico-sm ico-white" src="${ICO}trash.svg"> Supprimer
          </button>`:''}
        </div>
        <h2 class="msg-title">${esc(d.subject)}</h2>
        <div class="sender-row">
          <div class="avatar">${esc(who[0].toUpperCase())}</div>
          <div>
            <div class="sender-name">${esc(who.split('@')[0])}</div>
            <div class="sender-email">${esc(who)}</div>
            <div class="msg-meta">${date}</div>
            <div class="enc-stamp">
              <img class="ico ico-sm ico-primary" src="${ICO}shield-halved.svg">
              Déchiffré localement · ECDH P-256 + AES-256-GCM
            </div>
          </div>
        </div>
      </div>
      <div class="msg-body-wrap">
        ${d.ok
          ? `<div class="msg-body">${esc(d.body)}</div>`
          : `<div class="decrypt-err">
              <img class="ico ico-18 ico-red" src="${ICO}circle-exclamation.svg">
              Impossible de déchiffrer ce message.
             </div>`
        }
      </div>
    </div>`;
}

function deselect() {
  selectedMsg = null;
  document.getElementById('msgContent').innerHTML = `
    <div class="empty-state">
      <img class="ico ico-52 ico-muted" src="${ICO}lock.svg">
      <p>Sélectionnez un message</p>
      <small>Déchiffrement local · clé privée</small>
    </div>`;
  renderList();
}

// ════════════════════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════════════════════
async function deleteMsg(id) {
  if (!confirm('Supprimer ce message ?')) return;
  await apiFetch(`${API}/delete`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  messages = messages.filter(m => m.id !== id);
  deselect();
  toast('Supprimé','ok');
}

function replyTo(id) {
  const m = messages.find(x=>x.id===id); if(!m) return;
  const d = decrypted[m.id];
  document.getElementById('toInput').value   = m.from_email;
  document.getElementById('subjInput').value = d ? 'Re: '+d.subject : 'Re:';
  document.getElementById('msgInput').value  = '';
  openModal('composeModal');
}

// ════════════════════════════════════════════════════════════════
// ENVOI
// ════════════════════════════════════════════════════════════════
async function sendMessage() {
  const to   = document.getElementById('toInput').value.trim();
  const subj = document.getElementById('subjInput').value.trim();
  const body = document.getElementById('msgInput').value.trim();
  if (!to||!subj||!body) { toast('Champs obligatoires','err'); return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.innerHTML = `<img class="ico ico-sm ico-white ico-spin" src="${ICO}arrows-rotate.svg"> Chiffrement…`;

  try {
    const kr = await apiFetch(`${API}/pubkey/${encodeURIComponent(to)}`);
    const kd = await kr.json();
    if (!kd.success||!kd.pub_key) {
      toast('Destinataire sans clé — doit ouvrir la messagerie une fois','warn'); return;
    }
    const recipPub = await impPub(kd.pub_key);
    const r = await apiFetch(`${API}/send`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        to_email: to,
        subj_enc: await encryptFor(subj, recipPub),
        body_enc: await encryptFor(body, recipPub),
      }),
    });
    const data = await r.json();
    if (data.success) { closeModal('composeModal'); toast('Message envoyé ✓','ok'); }
    else toast('Erreur : '+(data.error||'?'),'err');
  } catch(e) {
    if (e.message!=='Session expirée') toast('Erreur : '+e.message,'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<img class="ico ico-sm ico-white" src="${ICO}paper-plane.svg"> Envoyer`;
  }
}

// ════════════════════════════════════════════════════════════════
// AUTOCOMPLETE
// ════════════════════════════════════════════════════════════════
async function loadUsers() {
  try {
    const r = await apiFetch(`${API}/users`);
    const d = await r.json();
    allUsers = d.users || [];
  } catch { allUsers = []; }
}

function setupAC() {
  const inp  = document.getElementById('toInput');
  const list = document.getElementById('acList');
  inp.oninput = () => {
    const q = inp.value.toLowerCase();
    if (q.length < 1) { list.style.display='none'; return; }
    const m = allUsers.filter(u =>
      u.nom.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)
    ).slice(0,6);
    if (!m.length) { list.style.display='none'; return; }
    list.innerHTML = m.map(u =>
      `<div class="ac-item" data-email="${esc(u.email)}">${esc(u.nom)}<small>${esc(u.email)}</small></div>`
    ).join('');
    list.style.display = 'block';
    list.querySelectorAll('.ac-item').forEach(i =>
      i.onclick = () => { inp.value=i.dataset.email; list.style.display='none'; }
    );
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('.ac')) list.style.display='none';
  });
}

// ════════════════════════════════════════════════════════════════
// HELPERS UI
// ════════════════════════════════════════════════════════════════
function updateBadge(n) {
  const u = n!==undefined ? n : messages.filter(m=>!m.lu).length;
  const b = document.getElementById('inboxBadge');
  b.textContent  = u;
  b.style.display= u>0 ? 'block':'none';
}

function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  if (id==='composeModal') {
    ['toInput','subjInput','msgInput'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('acList').style.display='none';
  }
}

function toast(msg, type='', dur=3500) {
  const icons = {ok:'circle-check',err:'circle-xmark',warn:'circle-exclamation'};
  const area  = document.getElementById('toast-area');
  const el    = document.createElement('div');
  el.className= `toast ${type}`;
  el.innerHTML= `<img class="ico ico-sm" src="${ICO}${icons[type]||'circle-info'}.svg"><span>${esc(msg)}</span>`;
  area.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>area.removeChild(el),300); }, dur);
}

function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ════════════════════════════════════════════════════════════════
// BOOTSTRAP
// ════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  await initUI();
  await initKeys();
  await loadUsers();
  setupAC();
  await loadMessages();

  document.getElementById('composeBtn').onclick = () => openModal('composeModal');
  document.getElementById('closeModal').onclick  = () => closeModal('composeModal');
  document.getElementById('cancelBtn').onclick   = () => closeModal('composeModal');
  document.getElementById('sendBtn').onclick     = sendMessage;
  document.getElementById('searchInput').oninput = renderList;

  // Bouton refresh dans la navbar (si présent)
  const rb = document.getElementById('refreshBtn');
  if (rb) rb.onclick = loadMessages;

  document.querySelectorAll('.folder').forEach(f =>
    f.onclick = () => {
      document.querySelectorAll('.folder').forEach(x=>x.classList.remove('active'));
      f.classList.add('active');
      currentFolder = f.dataset.folder;
      deselect();
      loadMessages();
    }
  );

  // Fermer modal en cliquant hors
  document.getElementById('composeModal').addEventListener('click', e => {
    if (e.target===document.getElementById('composeModal')) closeModal('composeModal');
  });
  document.addEventListener('keydown', e => {
    if (e.key==='Escape') closeModal('composeModal');
  });
});
</script>
<script src="/static/extensions/vexia/vexia-widget.js"></script>
