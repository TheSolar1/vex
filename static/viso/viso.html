<!DOCTYPE html>
<html lang="fr" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{T_TITRE_ONGLET}}</title>
<link rel="icon" href="/static/img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/static/css/theme.css?v=10">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4fa553">
  <link rel="apple-touch-icon" href="/static/img/icon-192.png">

<style>
/* ══════════════════════════════════════════════════════════════
   VEX Viso — mêmes tokens que build_nav_html (function.rs)
   Toutes les couleurs viennent de theme.css. Les teintes qui
   n'ont pas de token direct sont recréées via color-mix().
   Icônes : fichiers Font Awesome de /static/img/solid/, affichés
   en masque CSS (classe .ic) pour suivre la couleur du texte.
   ══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-top: 72px; margin: 0; }
body > .gate-wrap, body > .call-wrap, body > .controls-bar { position: relative; z-index: 1; }
button { font-family: inherit; }
.ic { display: inline-block; width: 18px; height: 18px; flex-shrink: 0; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; vertical-align: middle; }
.ic.sm { width: 13px; height: 13px; }
.ic.lg { width: 26px; height: 26px; }

/* ── Écran d'accueil ─────────────────────────────────────────── */
.gate-wrap { max-width: 520px; margin: 32px auto; padding: 0 20px; }
.gate-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; }
.gate-card h1 { font-size: 20px; margin: 0 0 4px; }
.gate-card p.sub { color: var(--text-dim); font-size: 13px; margin: 0 0 22px; }
.tabs { display: flex; gap: 6px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.tab-btn { flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--text-dim); cursor: pointer; }
.tab-btn.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
.field input, .field select, .field textarea, .inp { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 0 0 12px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.btn-primary { width: 100%; padding: 12px; border: none; border-radius: 9px; background: var(--nav-gradient); color:#fff; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { padding: 4px 8px; font-size: 12px; }
.gate-error { display: none; background: color-mix(in srgb, var(--danger) 10%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); color: var(--danger); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; }
.security-note { margin-top: 18px; display: flex; gap: 10px; align-items: flex-start; font-size: 12px; color: var(--text-dim); line-height: 1.5; }
.security-note .ic { margin-top: 2px; color: var(--accent); }
.room-list { display: flex; flex-direction: column; gap: 8px; }
.room-item { border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
.room-item b { font-size: 14px; }
.room-item .meta { color: var(--text-dim); font-size: 12px; margin: 3px 0 8px; }
.room-item .acts { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── Avant de rejoindre / salle d'attente ────────────────────── */
.prejoin-wrap, .waiting-wrap { display: none; max-width: 720px; margin: 24px auto; padding: 0 20px; position: relative; z-index: 1; }
.prejoin-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.prejoin-card h2 { margin: 0 0 14px; font-size: 18px; }
.prejoin-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
.preview { position: relative; background: var(--surface2); border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
.preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.preview .off-msg { position: absolute; color: var(--text-dim); font-size: 13px; }
.preview-ctrls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
.level { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; margin-top: 6px; }
.level > div { height: 100%; width: 0; background: var(--accent); transition: width .1s; }
.waiting-card { text-align: center; }
.waiting-card .ic { color: var(--accent); width: 42px; height: 42px; margin-bottom: 10px; }

/* ── Salle d'appel ───────────────────────────────────────────── */
.call-wrap { display: none; padding: 12px 16px 96px; max-width: 1700px; margin: 0 auto; }
.call-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
.call-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.call-title { font-size: 16px; font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--panel-border); color: var(--text-dim); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; }
.pill.rec { color: #fff; background: var(--danger); border-color: var(--danger); }
.pill.clickable { cursor: pointer; color: var(--text); }
.pill.clickable:hover { border-color: var(--accent); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
.status-dot.live { background: var(--accent); box-shadow: 0 0 0 3px var(--aglow); }
.room-code-chip { font-family: "SFMono-Regular", Consolas, monospace; letter-spacing: .5px; }
.banner { display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--accent) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 8px; }
.banner.warn { background: color-mix(in srgb, var(--danger) 10%, var(--panel)); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.banner .grow { flex: 1; }

.call-body { display: flex; gap: 12px; align-items: stretch; }
.stage { flex: 1; min-width: 0; position: relative; }
.main-stage { display: none; margin-bottom: 10px; }
.stage.has-main .main-stage { display: block; }
.stage.has-main .main-stage .tile, .stage.has-main .main-stage .wb-box { aspect-ratio: auto; height: min(62vh, 720px); width: 100%; }
.stage.has-main .main-stage .tile video { object-fit: contain; }
.stage.has-main .video-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 190px)); justify-content: center; }
.video-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.tile { position: relative; background: var(--surface2); border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; box-shadow: var(--shadow); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; }
.tile.speaking { border-color: var(--accent); box-shadow: 0 0 0 2px var(--aglow), var(--shadow); }
.tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile.mirror video { transform: scaleX(-1); }
.tile.no-video video { display: none; }
.tile.screen video { object-fit: contain; background: #000; }
.tile.hidden-self { display: none; }
.tile-avatar { width: 30%; aspect-ratio: 1; min-width: 48px; max-width: 110px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: clamp(16px, 3vw, 34px); font-weight: 700; color:#fff; background: linear-gradient(135deg,var(--vex-green-1) 0%,var(--vex-green-2) 100%); }
.tile.no-video .tile-avatar { display: flex; }
.tile-label { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); background: color-mix(in srgb, var(--text) 62%, transparent); color: var(--surface); font-size: 12px; font-weight: 600; padding: 4px 8px 4px 6px; border-radius: 8px; display: flex; align-items: center; gap: 5px; overflow: hidden; }
.tile-label .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-label .off { color: var(--danger); }
.tile-badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 5px; }
.tile-badge { background: color-mix(in srgb, var(--text) 62%, transparent); color: var(--surface); font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 7px; display: flex; align-items: center; gap: 4px; }
.tile-badge.hand { background: var(--orange); color: #fff; }
.tile-badge.q1 { color: var(--danger); } .tile-badge.q2 { color: var(--orange); }
.tile-menu-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; border: none; background: color-mix(in srgb, var(--text) 62%, transparent); color: var(--surface); cursor: pointer; display: none; align-items: center; justify-content: center; }
.tile:hover .tile-menu-btn { display: flex; }
.tile-react { position: absolute; right: 10px; bottom: 10px; font-size: 34px; pointer-events: none; animation: react-up 2.4s ease-out forwards; }
@keyframes react-up { 0% { transform: translateY(10px) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(0) scale(1.1); } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
.captions { position: sticky; bottom: 84px; margin: 10px auto 0; max-width: 760px; background: color-mix(in srgb, #000 78%, transparent); color: #fff; border-radius: 10px; padding: 8px 14px; font-size: 15px; line-height: 1.45; display: none; }
.captions b { color: #9be7a0; font-weight: 600; }
.empty-hint { text-align: center; color: var(--text-dim); font-size: 13px; margin: 28px 0; }

/* ── Panneau latéral ─────────────────────────────────────────── */
.side-panel { width: 340px; flex: none; display: none; flex-direction: column; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; box-shadow: var(--shadow); height: calc(100vh - 210px); min-height: 360px; position: sticky; top: 84px; }
.side-panel.open { display: flex; }
.side-tabs { display: flex; border-bottom: 1px solid var(--panel-border); }
.side-tab { flex: 1; border: none; background: none; padding: 10px 1px; font-size: 11.5px; font-weight: 600; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; position: relative; }
.side-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.side-close { border: none; background: none; color: var(--text-dim); cursor: pointer; padding: 0 10px; }
.side-pane { flex: 1; overflow: auto; padding: 10px 12px; display: none; flex-direction: column; min-height: 0; }
.side-pane.active { display: flex; }
.dot { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; text-align: center; padding: 0 4px; margin-left: 4px; }
.sect { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-dim); margin: 10px 0 6px; }
.person { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 8px; }
.person:hover { background: var(--bg); }
.person .av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,var(--vex-green-1) 0%,var(--vex-green-2) 100%); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.person .nm { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .nm small { display: block; color: var(--text-dim); font-size: 11px; }
.person .st { display: flex; gap: 6px; color: var(--text-dim); align-items: center; }
.person .st .off { color: var(--danger); } .person .st .hand { color: var(--orange); }
.icon-btn { border: none; background: none; color: var(--text-dim); cursor: pointer; padding: 4px; border-radius: 6px; display: inline-flex; }
.icon-btn:hover { background: var(--bg); color: var(--text); }
.chat-list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.msg { font-size: 13px; line-height: 1.4; }
.msg .who { font-weight: 700; font-size: 12px; }
.msg .who small { font-weight: 400; color: var(--text-dim); margin-left: 6px; }
.msg .bubble { background: var(--bg); border-radius: 10px; padding: 6px 10px; display: inline-block; max-width: 100%; word-break: break-word; white-space: pre-wrap; }
.msg.me .bubble { background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }
.msg.priv .bubble { border: 1px dashed var(--orange); }
.msg.sys { color: var(--text-dim); font-size: 12px; text-align: center; }
.msg a { color: var(--accent); }
.chat-form { display: flex; gap: 6px; margin-top: 8px; align-items: flex-end; }
.chat-form textarea { flex: 1; resize: none; height: 40px; }
.emoji-row { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 6px; }
.emoji-row button { border: none; background: none; font-size: 18px; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.emoji-row button:hover { background: var(--bg); }
.poll { border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.poll h4 { margin: 0 0 8px; font-size: 14px; }
.poll-opt { position: relative; display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--panel-border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; overflow: hidden; }
.poll-opt .bar { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 22%, transparent); }
.poll-opt span { position: relative; }
.poll-opt.mine { border-color: var(--accent); font-weight: 700; }
.poll small { color: var(--text-dim); }
.notes-area { flex: 1; resize: none; min-height: 200px; }
.qa { border: 1px solid var(--panel-border); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; display: flex; gap: 8px; }
.qa.done { opacity: .6; }
.qa .vote { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 4px 6px; cursor: pointer; font-size: 12px; font-weight: 700; height: fit-content; }
.qa .vote.mine { border-color: var(--accent); color: var(--accent); }
.qa .q { font-size: 13px; font-weight: 600; white-space: pre-wrap; word-break: break-word; }
.qa small { color: var(--text-dim); }
.qa .ans { font-size: 12.5px; margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--accent); white-space: pre-wrap; }

/* ── Tableau blanc ───────────────────────────────────────────── */
.wb-box { position: relative; background: #fff; border-radius: 12px; overflow: hidden; border: 2px solid var(--border); box-shadow: var(--shadow); }
.wb-box canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.wb-tools { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; align-items: center; background: color-mix(in srgb, #fff 92%, transparent); border: 1px solid #d0d0d0; border-radius: 10px; padding: 5px 8px; color: #222; }
.wb-tools button { border: 1px solid transparent; background: none; cursor: pointer; border-radius: 6px; padding: 4px; color: #222; display: inline-flex; }
.wb-tools button.on { border-color: #222; }
.wb-tools .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #999; padding: 0; }

/* ── Barre de contrôle ───────────────────────────────────────── */
.controls-bar { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; z-index: 50; pointer-events: none; }
.controls-inner { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--panel-border); padding: 9px 14px; border-radius: 40px; box-shadow: var(--shadow); max-width: calc(100vw - 16px); overflow-x: auto; }
.ctrl-btn { position: relative; width: 46px; height: 46px; flex: none; border-radius: 50%; border: none; background: var(--bg); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s, transform .1s; }
.ctrl-btn:hover { transform: translateY(-2px); }
.ctrl-btn.off { background: var(--danger); color:#fff; }
.ctrl-btn.hangup { background: var(--danger); color:#fff; width: 58px; }
.ctrl-btn.hangup:hover { background: color-mix(in srgb, var(--danger) 85%, black); }
.ctrl-btn.active-toggle { background: var(--accent); color:#fff; }
.ctrl-btn:disabled { opacity: .5; cursor: not-allowed; }
.ctrl-btn .dot { position: absolute; top: -2px; right: -2px; margin: 0; }
.ctrl-sep { width: 1px; height: 28px; background: var(--panel-border); flex: none; }
.pop { position: fixed; z-index: 4000; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.25); padding: 6px; min-width: 230px; max-height: 70vh; overflow: auto; }
.pop button.item { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; color: var(--text); padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left; }
.pop button.item:hover { background: var(--bg); }
.pop button.item.on { color: var(--accent); font-weight: 700; }
.pop button.item.danger { color: var(--danger); }
.pop .sep { height: 1px; background: var(--panel-border); margin: 4px 0; }
.pop .head { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); padding: 6px 10px 2px; }
.pop.reacts { display: flex; gap: 2px; min-width: 0; padding: 6px 8px; border-radius: 30px; }
.pop.reacts button { border: none; background: none; font-size: 26px; cursor: pointer; border-radius: 50%; padding: 4px 6px; }
.pop.reacts button:hover { background: var(--bg); transform: scale(1.15); }

/* ── Fenêtres modales ────────────────────────────────────────── */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 4500; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.35); width: min(520px, 100%); max-height: 88vh; display: flex; flex-direction: column; }
.modal h3 { margin: 0; padding: 16px 18px 10px; font-size: 16px; }
.modal .body { padding: 4px 18px 10px; overflow: auto; font-size: 13px; line-height: 1.5; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 16px; }
.kbd { font-family: Consolas, monospace; background: var(--bg); border: 1px solid var(--panel-border); border-radius: 5px; padding: 1px 6px; font-size: 12px; }
table.simple { border-collapse: collapse; width: 100%; font-size: 13px; }
table.simple td, table.simple th { border-bottom: 1px solid var(--panel-border); padding: 6px 4px; text-align: left; }

#toast-area{position:fixed;bottom:84px;right:24px;z-index:5000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--surface,var(--panel));border:1px solid var(--panel-border);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);padding:12px 18px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;animation:toast-in .25s ease;pointer-events:all;max-width:340px}
@keyframes toast-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.ok{border-left:4px solid var(--accent)}
.toast.error{border-left:4px solid var(--danger)}
.ico-sm{width:14px;height:14px;flex-shrink:0}

@media (max-width: 900px) {
  .call-body { flex-direction: column; }
  .side-panel { width: 100%; position: static; height: 60vh; }
  .prejoin-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) { .video-grid { grid-template-columns: 1fr 1fr; } .ctrl-btn { width: 42px; height: 42px; } }
</style>
</head>

<!-- ══════════════ ÉCRAN D'ACCUEIL ══════════════ -->
<div class="gate-wrap" id="gateWrap">
  <div class="gate-card">
    <h1>{{T_APPEL_VIDEO_VEX}}</h1>
    <p class="sub">{{T_SOUS_TITRE}}</p>
    <div class="gate-error" id="gateError"></div>
    <div class="tabs">
      <button class="tab-btn active" id="tabCreate">{{T_CREER_UNE_SALLE}}</button>
      <button class="tab-btn" id="tabJoin">{{T_REJOINDRE}}</button>
      <button class="tab-btn" id="tabMine" data-i18n="MES_REUNIONS"></button>
    </div>

    <div id="paneCreate">
      <div class="field"><label for="createTitle">{{T_NOM_APPEL}}</label><input type="text" id="createTitle" placeholder="{{T_PLACEHOLDER_REUNION}}" maxlength="120"></div>
      <div class="field"><label for="createPassword">{{T_MDP_OPTIONNEL}}</label><input type="password" id="createPassword" placeholder="{{T_PLACEHOLDER_LAISSER_VIDE}}"></div>

<script>
{{I18N_JS}}
(function () {
"use strict";

const T = I18N;
const API_BASE = "/api/viso";
const HKDF_INFO = "VEX-VISIO-signal-v1";
const HKDF_SALT = "VEX-VISIO-signal-v1";
const HEARTBEAT_MS = 25_000;
const POLL_MS = 1_200;
const ICO = "/static/img/solid/";
const MAX_FILE = 5 * 1024 * 1024;
const REACTIONS = ["👍", "❤️", "😂", "😮", "👏", "🎉"];
const EMOJIS = ["😀", "😂", "😉", "😍", "🤔", "😢", "😡", "👍", "👎", "👏", "🙏", "🎉", "❤️", "🔥", "✅", "❌"];
const WB_COLORS = ["#111111", "#d93025", "#1a73e8", "#188038", "#f9ab00", "#9334e6"];

const $ = (id) => document.getElementById(id);
const ic = (name, cls = "") => `<i class="ic ${cls}" style="--i:url(${ICO}${name}.svg)"></i>`;
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const fmt = (s, o) => String(s).replace(/\{(\w+)\}/g, (_, k) => (o && o[k] != null ? o[k] : ""));
const hhmm = (ts) => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

// Textes des éléments statiques ajoutés (data-i18n / data-i18n-title)
document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T[el.dataset.i18n] || ""; });
document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = T[el.dataset.i18nTitle] || ""; });

// Serveurs STUN/TURN : fournis par le serveur (config.json -> "visio"),
// avec identifiants TURN temporaires. Valeur de repli si l'appel echoue.
let ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];
async function chargerIceServers() {
  try {
    const r = await apiCall("ice_servers", {});
    if (r.success && Array.isArray(r.data.ice_servers) && r.data.ice_servers.length) ICE_SERVERS = r.data.ice_servers;
  } catch (e) { /* repli sur la valeur par defaut */ }
}

// ── État ──
let myKeyPair = null, myPubB64 = "", mySessionId = "", myNom = T.VOUS_DEFAULT, myUserId = null;
let roomId = null, roomCode = "", roomPassword = "", roomTitle = "";
let isHost = false, hostUserId = null, roomLobby = false, roomLocked = false;
let localStream = null, micOn = true, camOn = true;
let screenShare = null;            // { stream, senders: { sid: [RTCRtpSender] } }
let handUp = false, handAt = 0, hardMuted = false;
let heartbeatTimer = null, pollTimer = null, tickTimer = null, waitTimer = null, pollCount = 0, pollFails = 0;
let callStart = 0, inCall = false, leaving = false, removedReason = "";
let layoutMode = "grid", pinned = null, spotlight = null, hideSelf = false, activeSpeaker = null;
let breakout = null;               // { mainCode, mainPassword, until, name }
let waiting = [];                  // sessions en salle d'attente (organisateur)
let breakoutRooms = [];            // salles créées par l'organisateur
const peers = {};                  // sid -> { pc, dc, nom, userId, micOn, camOn, hand, ... }
const chat = [];                   // { id, from, nom, text, ts, to, file }
const polls = new Map();           // id -> { id, q, opts, multi, by, byNom, closed, votes: Map(sid -> [i]) }
const notes = { text: "", ts: 0 };
const qas = new Map();             // id -> { id, by, byNom, text, ts, votes: Set(sid), answers: [], done }
const cohosts = new Set();         // session_id des coorganisateurs désignés par l'organisateur
let unreadQa = 0;
const wb = { strokes: [], open: false, color: WB_COLORS[0], width: 3 };
const attendance = new Map();      // nom -> { nom, first, last, present }
const transcript = [];             // { nom, text, ts }
const incomingFiles = new Map();   // id -> { meta, parts, got }
let unreadChat = 0, unreadPolls = 0;
let recorder = null, recRemote = new Set();
let speech = null, captionsOn = false, showCaptions = true;
let audioCtx = null;
const meters = new Map();          // clé de tuile -> { analyser, data, source }
const prefs = { mic: "", cam: "", spk: "", noise: true, blur: false };
let pending = null;                // { code, password, title } en attente de l'écran de préparation

const enc = new TextEncoder(), dec = new TextDecoder();
function b64(bytes) { let bin = ""; for (const b of new Uint8Array(bytes)) bin += String.fromCharCode(b); return btoa(bin); }
function fromB64(str) { const bin = atob(str); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return arr; }
function genSessionId() { const arr = new Uint8Array(24); crypto.getRandomValues(arr); return b64(arr).replace(/[+/=]/g, c => ({ "+": "-", "/": "_", "=": "" }[c])); }

// Même fonction que fchier.html (zone dynamique, toasts empilables, ok/error).
function toast(msg, type = 'ok', dur = 3500) {
  const area = $('toast-area');
  const existant = [...area.children].find(c => c.dataset.msg === msg);
  if (existant) { existant.dispatchEvent(new Event('vex-relancer')); return; }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.dataset.msg = msg;
  const icone = type === 'error' ? 'circle-xmark' : 'circle-check';
  el.innerHTML = `<img class="ico ico-sm" src="${ICO}${icone}.svg" alt=""><span>${esc(msg)}</span>`;
  area.appendChild(el);
  let minuteur = null;
  const armerDisparition = () => { minuteur = setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, dur); };
  el.addEventListener('mouseenter', () => clearTimeout(minuteur));
  el.addEventListener('mouseleave', armerDisparition);
  el.addEventListener('vex-relancer', () => { clearTimeout(minuteur); armerDisparition(); });
  armerDisparition();
}
function setStatus(text, live) { $("statusPill").style.display = "inline-flex"; $("statusText").textContent = text; $("statusDot").classList.toggle("live", !!live); }

async function apiCall(action, params) {
  const body = new URLSearchParams({ action, ...params });
  const r = await fetch(API_BASE, { method: "POST", credentials: "include", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
  return r.json();
}

// ── CRYPTO (signalisation chiffrée de bout en bout) ──
async function genKeyPair() { return crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]); }
async function exportPub(keyPair) { const raw = await crypto.subtle.exportKey("raw", keyPair.publicKey); return b64(raw); }
async function deriveSharedAesKey(myPriv, peerPubB64) {
  const peerPub = await crypto.subtle.importKey("raw", fromB64(peerPubB64), { name: "ECDH", namedCurve: "P-256" }, false, []);
  const bits = await crypto.subtle.deriveBits({ name: "ECDH", public: peerPub }, myPriv, 256);
  const hkdfMaterial = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt: enc.encode(HKDF_SALT), info: enc.encode(HKDF_INFO) }, hkdfMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptSignal(aesKey, obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); const plain = enc.encode(JSON.stringify(obj)); const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, plain); return { ciphertext: b64(cipher), nonce: b64(iv) }; }
async function decryptSignal(aesKey, ciphertextB64, nonceB64) { const iv = fromB64(nonceB64); const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, aesKey, fromB64(ciphertextB64)); return JSON.parse(dec.decode(plain)); }

// ══════════════════════════════════════════════════════════════
// PAIRS — « négociation parfaite » : chaque côté ajoute ses pistes et
// son canal de données ; en cas d'offres croisées, le pair « poli »
// (plus petit session_id) annule la sienne. Les fonctions de réunion
// (conversation, réactions, sondages, tableau blanc…) passent par un
// canal de données WebRTC direct entre navigateurs (chiffré DTLS) :
// le serveur n'en voit rien.
// ══════════════════════════════════════════════════════════════
function getOrCreatePeer(sessionId, pubKeyRaw, nom, userId) {
  if (peers[sessionId]) return peers[sessionId];
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const entry = {
    pc, pubKeyRaw, nom: nom || T.PARTICIPANT_DEFAULT, userId: userId ?? null, micOn: true, camOn: true, hand: false, handAt: 0,
    sharedKeyPromise: deriveSharedAesKey(myKeyPair.privateKey, pubKeyRaw), streams: new Map(), screenStreamId: null,
    polite: mySessionId < sessionId, makingOffer: false, ignoreOffer: false, queue: [], newcomer: inCall, quality: 3, joined: Date.now(),
  };
  peers[sessionId] = entry;

  const dc = pc.createDataChannel("vex", { negotiated: true, id: 0 });
  entry.dc = dc;
  dc.onopen = () => {
    const q = entry.queue; entry.queue = [];
    sendApp(sessionId, { t: "hello", ...myState() });
    if (entry.newcomer) sendApp(sessionId, syncPayload());
    for (const m of q) sendApp(sessionId, m);
  };
  dc.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } try { handleApp(sessionId, m); } catch (err) { console.warn(err); } };

  if (localStream) localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
  if (screenShare) screenShare.senders[sessionId] = screenShare.stream.getTracks().map((t) => pc.addTrack(t, screenShare.stream));

  pc.onicecandidate = (e) => { if (e.candidate) sendSignal(sessionId, "ice", { candidate: e.candidate }).catch(() => {}); };
  pc.ontrack = (e) => {
    const stream = e.streams[0]; if (!stream) return;
    entry.streams.set(stream.id, stream);
    stream.onremovetrack = () => { if (!stream.getTracks().length) { entry.streams.delete(stream.id); removeTile("screen-" + sessionId, stream); } };
    placeStream(sessionId, stream);
  };
  // Coupure reseau : "disconnected" est souvent passager (changement de
  // Wi-Fi, 4G) -- on laisse 8 s ; "failed" tente d'abord un redemarrage ICE.
  let timerDeconnexion = null;
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if (st === "connected") { clearTimeout(timerDeconnexion); timerDeconnexion = null; entry.iceRedemarre = false; return; }
    if (st === "closed") { removePeer(sessionId); return; }
    if (st === "failed") {
      if (!entry.iceRedemarre && typeof pc.restartIce === "function") { entry.iceRedemarre = true; pc.restartIce(); return; }
      removePeer(sessionId); return;
    }
    if (st === "disconnected" && !timerDeconnexion) {
      timerDeconnexion = setTimeout(() => {
        timerDeconnexion = null;
        if (pc.connectionState === "disconnected") {
          if (!entry.iceRedemarre && typeof pc.restartIce === "function") { entry.iceRedemarre = true; pc.restartIce(); }
          else removePeer(sessionId);
        }
      }, 8000);
    }
  };
  pc.onnegotiationneeded = async () => {
    try {
      entry.makingOffer = true;
      await pc.setLocalDescription();
      await sendSignal(sessionId, "offer", { sdp: pc.localDescription });
    } catch (e) { console.warn("Négociation impossible pour", sessionId, e); }
    finally { entry.makingOffer = false; }
  };

  ensureTile(sessionId, entry.nom, false);
  noteAttendance(entry.nom, true);
  if (inCall && entry.newcomer) sysMsg(fmt(T.A_REJOINT, { nom: entry.nom }));
  updateParticipantsCount(); renderPeople(); refreshChatTargets();
  return entry;
}

async function sendSignal(toSessionId, payloadType, obj) {
  const entry = peers[toSessionId];
  if (!entry) return;
  const aesKey = await entry.sharedKeyPromise;
  const { ciphertext, nonce } = await encryptSignal(aesKey, obj);
  await apiCall("poster_signal", { room_id: String(roomId), from_session: mySessionId, to_session: toSessionId, payload_type: payloadType, ciphertext, nonce });
}

// ── SIGNAUX ──
async function pollSignaux() {
  try {
    const res = await apiCall("recuperer_signaux", { session_id: mySessionId });
    if (!res.success) { if (++pollFails >= 3) onRemoved(); return; }
    pollFails = 0;
    for (const sig of res.data.signaux) await traiterSignal(sig);
  } catch (e) { /* silencieux : coupure réseau passagère */ }
}

async function traiterSignal(sig) {
  const from = sig.from_session;
  let entry = peers[from];
  if (!entry) { await rafraichirParticipants(); entry = peers[from]; if (!entry) return; }
  let payload;
  try { const aesKey = await entry.sharedKeyPromise; payload = await decryptSignal(aesKey, sig.ciphertext, sig.nonce); }
  catch (e) { console.warn("Signal illisible — ignoré."); return; }
  const pc = entry.pc;
  try {
    switch (sig.payload_type) {
      case "offer": {
        const collision = entry.makingOffer || pc.signalingState !== "stable";
        entry.ignoreOffer = !entry.polite && collision;
        if (entry.ignoreOffer) return;
        await pc.setRemoteDescription(payload.sdp);
        await pc.setLocalDescription();
        await sendSignal(from, "answer", { sdp: pc.localDescription });
        break;
      }
      case "answer": if (pc.signalingState === "have-local-offer") await pc.setRemoteDescription(payload.sdp); break;
      case "ice": try { await pc.addIceCandidate(payload.candidate); } catch (e) { if (!entry.ignoreOffer) console.warn(e); } break;
      case "app": handleApp(from, payload); break;
      case "bye": removePeer(from); break;
    }
  } catch (e) { console.warn("Signal non applicable", sig.payload_type, e); }
}

// ── Messages applicatifs (canal de données) ──
function sendApp(sid, msg) {
  const entry = peers[sid];
  if (!entry) return;
  if (entry.dc && entry.dc.readyState === "open") { try { entry.dc.send(JSON.stringify(msg)); } catch (e) { console.warn(e); } }

    case "poll": if (!polls.has(m.id)) { polls.set(m.id, { id: m.id, q: String(m.q || "").slice(0, 300), opts: (m.opts || []).slice(0, 10).map((o) => String(o).slice(0, 120)), multi: !!m.multi, by: sid, byNom: p.nom, closed: false, votes: new Map() }); toast(fmt(T.NOUVEAU_SONDAGE_DE, { nom: p.nom })); bumpPolls(); renderPolls(); } break;

}

function handleMod(sid, m) {

  if (["cohost", "kick", "end", "breakout", "breakoutEnd"].includes(m.a) && !fromHost(sid)) return;
  switch (m.a) {
    case "cohost": { const cible = m.sid; if (m.on) cohosts.add(cible); else cohosts.delete(cible); if (cible === mySessionId) toast(m.on ? T.VOUS_ETES_COORGANISATEUR : T.VOUS_N_ETES_PLUS_COORGANISATEUR); renderPeople(); for (const el of document.querySelectorAll(".tile")) updateTile(el.dataset.key); break; }

// ── PARTICIPANTS ──
async function rafraichirParticipants() {
  const res = await apiCall("lister_participants", { room_id: String(roomId), session_id: mySessionId });
  if (!res.success) return;
  for (const p of res.data.participants) {
    const sid = p.session_id;
    if (sid === mySessionId || peers[sid]) continue;
    getOrCreatePeer(sid, p.x25519_pub, p.nom, p.user_id);

// Choisit l'élément mis en avant : tableau blanc > mise en avant par
// l'organisateur > épinglé localement > partage d'écran > orateur actif.
function applyLayout() {

  else if (pinned && tileEl(pinned)) featured = pinned;
  else { const scr = [...document.querySelectorAll(".tile.screen")].pop(); if (scr) featured = scr.dataset.key; else if (layoutMode === "speaker") featured = activeSpeaker && tileEl(activeSpeaker) ? activeSpeaker : Object.keys(peers)[0] || null; }

// ── Orateur actif (niveau sonore) ──
function attachMeter(key, stream) {
  detachMeter(key);
  if (!stream || !stream.getAudioTracks().length) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
    source.connect(analyser);
    meters.set(key, { analyser, source, data: new Uint8Array(analyser.fftSize), last: 0 });
  } catch (e) { /* pas d'analyse audio */ }
}
function detachMeter(key) { const m = meters.get(key); if (m) { try { m.source.disconnect(); } catch (e) {} meters.delete(key); } }

  const now = Date.now();
  let best = null, bestLvl = 0.035;
  for (const [key, m] of meters) {
    const lvl = levelOf(m);
    const enabled = key === "local" ? micOn : peers[key] && peers[key].micOn;
    const speaking = enabled && lvl > 0.035;
    if (speaking) m.last = now;
    const tile = tileEl(key); if (tile) tile.classList.toggle("speaking", now - m.last < 700);
    if (speaking && lvl > bestLvl && key !== "local") { best = key; bestLvl = lvl; }
  }
  if (best && best !== activeSpeaker) { activeSpeaker = best; if (layoutMode === "speaker") applyLayout(); }
}

// ── Qualité de connexion ──
async function tickQuality() {
  for (const sid in peers) {
    const p = peers[sid];
    try {
      const stats = await p.pc.getStats();
      let rtt = null, lost = 0, recv = 0;
      stats.forEach((r) => {
        if (r.type === "candidate-pair" && r.state === "succeeded" && r.currentRoundTripTime != null) rtt = r.currentRoundTripTime;
        if (r.type === "inbound-rtp") { lost += r.packetsLost || 0; recv += r.packetsReceived || 0; }
      });
      const dl = lost - (p.lostPrev || 0), dr = recv - (p.recvPrev || 0);
      p.lostPrev = lost; p.recvPrev = recv;
      const loss = dr + dl > 0 ? dl / (dr + dl) : 0;
      const q = loss > 0.12 || (rtt != null && rtt > 0.6) ? 1 : loss > 0.04 || (rtt != null && rtt > 0.3) ? 2 : 3;
      if (q !== p.quality) { p.quality = q; updateTile(sid); }
    } catch (e) { /* ignoré */ }
  }
}

function hasTrack(kind) { return !!(localStream && (kind === "audio" ? localStream.getAudioTracks() : localStream.getVideoTracks()).length); }
function mediaConstraints() {
  return {
    audio: { deviceId: prefs.mic ? { exact: prefs.mic } : undefined, noiseSuppression: prefs.noise, echoCancellation: true, autoGainControl: true },
    video: { deviceId: prefs.cam ? { exact: prefs.cam } : undefined, width: { ideal: 1280 }, height: { ideal: 720 } },
  };
}
async function acquireMedia() {
  const c = mediaConstraints();
  return navigator.mediaDevices.getUserMedia(c)
    .catch(() => navigator.mediaDevices.getUserMedia({ audio: true, video: true }))
    .catch(() => navigator.mediaDevices.getUserMedia({ audio: c.audio, video: false }))
    .catch(() => navigator.mediaDevices.getUserMedia({ audio: false, video: c.video }))
    .catch(() => null);
}
function refreshMediaButtons() {
  const audio = hasTrack("audio"), video = hasTrack("video");
  for (const [id, on, ok, a, b] of [["btnMic", micOn, audio, "microphone", "microphone-slash"], ["btnCam", camOn, video, "video", "video-slash"], ["preMic", micOn, audio, "microphone", "microphone-slash"], ["preCam", camOn, video, "video", "video-slash"]]) {
    const el = $(id); el.innerHTML = ic(on && ok ? a : b); el.classList.toggle("off", !(on && ok)); el.disabled = !ok || (id === "btnMic" && hardMuted);
  }
  $("previewOff").style.display = camOn && video ? "none" : "block";
  $("previewVideo").style.visibility = camOn && video ? "visible" : "hidden";
}
function setMic(on) {
  if (!hasTrack("audio")) return;
  if (on && hardMuted) { toast(T.MICROS_DESACTIVES_PAR_ORGANISATEUR, "error"); return; }
  micOn = on;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  refreshMediaButtons(); updateTile("local"); if (inCall) { broadcastState(); renderPeople(); }
}
function setCam(on) {
  if (!hasTrack("video")) return;
  camOn = on;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  refreshMediaButtons();
  const tile = tileEl("local"); if (tile) tile.classList.toggle("no-video", !camOn);
  if (inCall) { broadcastState(); renderPeople(); }
}
function setHand(on) {
  handUp = on; handAt = on ? Date.now() : 0;
  $("btnHand").classList.toggle("active-toggle", handUp);
  $("btnHand").title = handUp ? T.BAISSER_LA_MAIN : T.LEVER_LA_MAIN;
  updateTile("local"); broadcastState(); renderPeople();
}

async function toggleShare() {
  const btn = $("btnShare");
  if (screenShare) { stopShare(); return; }
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    screenShare = { stream, senders: {} };
    for (const sid in peers) screenShare.senders[sid] = stream.getTracks().map((t) => peers[sid].pc.addTrack(t, stream));
    stream.getVideoTracks()[0].onended = () => { if (screenShare && screenShare.stream === stream) stopShare(); };
    btn.classList.add("active-toggle");
    const tile = ensureTile("screen-local", fmt(T.ECRAN_DE, { nom: myNom }), false, true);
    const v = tile.querySelector("video"); v.muted = true; v.srcObject = stream; v.play().catch(() => {});
    tile.classList.remove("no-video");
    broadcastState(); applyLayout();
    toast(T.PARTAGE_ECRAN_DEMARRE);
  } catch (e) { toast(T.PARTAGE_ECRAN_ANNULE); }
}
function stopShare() {
  if (!screenShare) return;
  for (const sid in screenShare.senders) { const pc = peers[sid] && peers[sid].pc; if (pc) for (const s of screenShare.senders[sid]) { try { pc.removeTrack(s); } catch (e) {} } }
  screenShare.stream.getTracks().forEach((t) => t.stop());
  screenShare = null;
  $("btnShare").classList.remove("active-toggle");
  removeTile("screen-local");
  broadcastState();
  toast(T.PARTAGE_ECRAN_ARRETE);
}

async function listDevices() {
  let devs = [];
  try { devs = await navigator.mediaDevices.enumerateDevices(); } catch (e) {}
  const fill = (sel, kind, cur) => {
    const list = devs.filter((d) => d.kind === kind);
    sel.innerHTML = list.length ? list.map((d, i) => `<option value="${esc(d.deviceId)}">${esc(d.label || `${kind} ${i + 1}`)}</option>`).join("") : `<option value="">${esc(T.PAR_DEFAUT)}</option>`;
    if (cur && list.some((d) => d.deviceId === cur)) sel.value = cur;
  };
  const curOf = (kind) => { const t = localStream && (kind === "audio" ? localStream.getAudioTracks() : localStream.getVideoTracks())[0]; return (t && t.getSettings().deviceId) || ""; };
  for (const [pre, set] of [["selMic", "setMic"], ["selCam", "setCam"], ["selSpk", "setSpk"]]) for (const id of [pre, set]) { const el = $(id); if (!el) continue; if (/Mic/.test(id)) fill(el, "audioinput", prefs.mic || curOf("audio")); else if (/Cam/.test(id)) fill(el, "videoinput", prefs.cam || curOf("video")); else { fill(el, "audiooutput", prefs.spk); el.disabled = !("setSinkId" in HTMLMediaElement.prototype); } }
}
// Change de micro ou de caméra en cours d'appel : la piste est remplacée
// chez chaque pair sans renégociation (replaceTrack).
async function switchDevice(kind) {
  const c = mediaConstraints();
  let ns;
  try { ns = await navigator.mediaDevices.getUserMedia(kind === "audio" ? { audio: c.audio } : { video: c.video }); } catch (e) { toast(T.PERIPHERIQUE_INDISPONIBLE, "error"); return; }
  const nt = ns.getTracks()[0];
  if (!localStream) localStream = new MediaStream();
  const old = (kind === "audio" ? localStream.getAudioTracks() : localStream.getVideoTracks())[0];
  nt.enabled = kind === "audio" ? micOn : camOn;
  for (const sid in peers) { const pc = peers[sid].pc; const sender = pc.getSenders().find((s) => s.track && s.track === old); if (sender) await sender.replaceTrack(nt).catch(() => {}); else pc.addTrack(nt, localStream); }
  if (old) { localStream.removeTrack(old); old.stop(); }
  localStream.addTrack(nt);
  if (kind === "audio") attachMeter("local", localStream);
  for (const id of ["previewVideo"]) $(id).srcObject = localStream;
  const lt = tileEl("local"); if (lt) { lt.querySelector("video").srcObject = localStream; lt.classList.toggle("no-video", !(camOn && hasTrack("video"))); }
  if (kind === "video") applyBlur();
  refreshMediaButtons();
}
function blurSupported() { const t = localStream && localStream.getVideoTracks()[0]; try { return !!(t && t.getCapabilities && "backgroundBlur" in t.getCapabilities()); } catch (e) { return false; } }
async function applyBlur() {
  const t = localStream && localStream.getVideoTracks()[0];
  if (!t || !blurSupported()) return false;
  try { await t.applyConstraints({ backgroundBlur: prefs.blur }); return true; } catch (e) { return false; }
}
function setSpeaker(id) {
  prefs.spk = id;
  document.querySelectorAll(".tile video").forEach((v) => { if (!v.muted && v.setSinkId) v.setSinkId(id).catch(() => {}); });
}

let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
document.addEventListener("mousedown", (e) => { if (popEl && !popEl.contains(e.target)) closePop(); });
function placePop(el, anchor) {
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(), b = el.getBoundingClientRect();
  let x = r.left + r.width / 2 - b.width / 2, y = r.top - b.height - 8;
  if (y < 8) y = r.bottom + 8;
  el.style.left = Math.max(8, Math.min(innerWidth - b.width - 8, x)) + "px"; el.style.top = Math.max(8, Math.min(innerHeight - b.height - 8, y)) + "px";
  popEl = el;
}
function popMenu(anchor, items) {
  closePop();
  const el = document.createElement("div"); el.className = "pop";
  for (const it of items) {
    if (!it) continue;
    if (it === "-") { el.insertAdjacentHTML("beforeend", '<div class="sep"></div>'); continue; }
    if (it.head) { el.insertAdjacentHTML("beforeend", `<div class="head">${esc(it.head)}</div>`); continue; }
    const b = document.createElement("button"); b.className = "item" + (it.on ? " on" : "") + (it.danger ? " danger" : "");
    b.innerHTML = ic(it.icon) + `<span>${esc(it.label)}</span>`;
    b.addEventListener("click", () => { closePop(); it.run(); });
    el.appendChild(b);
  }
  setTimeout(() => placePop(el, anchor), 0);
}
function modal(title, body, buttons) {
  const back = document.createElement("div"); back.className = "modal-back";
  const m = document.createElement("div"); m.className = "modal";
  const h = document.createElement("h3"); h.textContent = title;
  const b = document.createElement("div"); b.className = "body";
  if (typeof body === "string") b.innerHTML = body; else b.appendChild(body);
  const f = document.createElement("div"); f.className = "foot";
  const close = () => back.remove();
  for (const bt of buttons || [{ label: T.FERMER }]) {
    const el = document.createElement("button"); el.className = "btn" + (bt.primary ? " accent" : "") + (bt.danger ? " danger" : ""); el.textContent = bt.label;
    el.addEventListener("click", async () => { if (bt.run && (await bt.run()) === false) return; close(); });
    f.appendChild(el);
  }
  m.append(h, b, f); back.appendChild(m);
  back.addEventListener("mousedown", (e) => { if (e.target === back) close(); });
  document.body.appendChild(back);
  return { close, el: m };
}
function confirmBox(title, text) { return new Promise((res) => { modal(title, `<p>${esc(text)}</p>`, [{ label: T.ANNULER, run: () => res(false) }, { label: T.CONFIRMER, primary: true, run: () => res(true) }]); }); }
function download(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[T:]/g, "-");

// ── Participants ──
function renderPeople() {
  const pane = $("pane-people");
  if (!inCall) return;
  const rows = [];
  rows.push(`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;"><button class="btn small" data-act="invite">${ic("link", "sm")}${esc(T.COPIER_LIEN_INVITATION)}</button>${canModerate() ? `<button class="btn small" data-act="muteAll">${ic("microphone-slash", "sm")}${esc(T.COUPER_TOUS_LES_MICROS)}</button><button class="btn small" data-act="lowerAll">${ic("hand", "sm")}${esc(T.BAISSER_TOUTES_LES_MAINS)}</button>` : ""}</div>`);

    rows.push(`<div class="sect">${esc(T.SALLE_ATTENTE)} (${waiting.length}) <button class="btn small" data-act="admitAll" style="float:right;">${esc(T.ADMETTRE_TOUT)}</button></div>`);
    for (const w of waiting) rows.push(`<div class="person"><div class="av">${esc(initials(w.nom))}</div><div class="nm">${esc(w.nom)}</div><button class="btn small accent" data-admit="${esc(w.session_id)}">${esc(T.ADMETTRE)}</button><button class="btn small" data-deny="${esc(w.session_id)}">${esc(T.REFUSER)}</button></div>`);
  }

  const hands = list.filter((x) => x.hand).sort((a, b) => a.handAt - b.handAt);
  const person = (x, rank) => `<div class="person"><div class="av">${esc(initials(x.nom))}</div><div class="nm">${esc(x.nom)}${x.me ? esc(T.VOUS_SUFFIX) : ""}${x.host ? `<small>${esc(T.ORGANISATEUR)}</small>` : x.cohost ? `<small>${esc(T.COORGANISATEUR)}</small>` : ""}</div><div class="st">${rank ? `<b class="hand">${rank}</b>` : ""}${x.hand ? ic("hand", "sm hand") : ""}${x.screen ? ic("display", "sm") : ""}${ic(x.micOn ? "microphone" : "microphone-slash", "sm" + (x.micOn ? "" : " off"))}${ic(x.camOn ? "video" : "video-slash", "sm" + (x.camOn ? "" : " off"))}</div><button class="icon-btn" data-menu="${esc(x.key)}">${ic("ellipsis-vertical", "sm")}</button></div>`;
  if (hands.length) { rows.push(`<div class="sect">${esc(T.MAINS_LEVEES)} (${hands.length})</div>`); hands.forEach((x, i) => rows.push(person(x, i + 1))); }

$("pane-people").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.admit) decideWaiting(b.dataset.admit, true);
  else if (b.dataset.deny) decideWaiting(b.dataset.deny, false);
  else if (b.dataset.menu) tileMenu(b.dataset.menu, b);
  else if (b.dataset.act === "admitAll") decideWaiting("*", true);
  else if (b.dataset.act === "invite") copyInvite();
  else if (b.dataset.act === "muteAll") { broadcast({ t: "mod", a: "mute" }); toast(T.MICROS_COUPES); }
  else if (b.dataset.act === "lowerAll") { broadcast({ t: "mod", a: "lowerHand" }); if (handUp) setHand(false); }
});
function inviteLink() { return `${location.origin}/viso?code=${encodeURIComponent(breakout ? breakout.mainCode : roomCode)}`; }
function copyInvite() { navigator.clipboard?.writeText(inviteLink()).then(() => toast(T.LIEN_COPIE)).catch(() => modal(T.COPIER_LIEN_INVITATION, `<input class="inp" readonly value="${esc(inviteLink())}">`)); }

// ── Conversation ──
function linkify(text) { return esc(text).replace(/\bhttps?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`); }
function addChat(m, silent) {
  if (m.id && chat.some((x) => x.id === m.id)) return;
  chat.push(m);
  const el = document.createElement("div");
  const mine = m.from === mySessionId;
  if (m.sys) { el.className = "msg sys"; el.textContent = m.text; }
  else {
    el.className = "msg" + (mine ? " me" : "") + (m.to ? " priv" : "");
    const toNom = m.to ? (m.to === mySessionId ? myNom : peers[m.to] ? peers[m.to].nom : "?") : "";
    const body = m.file ? `<a href="${m.file.url}" download="${esc(m.file.name)}">${ic("file-arrow-down", "sm")} ${esc(m.file.name)}</a> <small>(${Math.max(1, Math.round(m.file.size / 1024))} Ko)</small>` : linkify(m.text);
    el.innerHTML = `<div class="who">${esc(m.nom)}${m.to ? ` → ${esc(toNom)} <small>${esc(T.PRIVE)}</small>` : ""}<small>${hhmm(m.ts)}</small></div><div class="bubble">${body}</div>`;
  }
  const l = $("chatList"); l.appendChild(el); l.scrollTop = l.scrollHeight;
  if (!silent && !mine && !m.sys && !sideShows("chat")) { unreadChat++; updateDots(); toast(`${m.nom} : ${m.file ? m.file.name : m.text.slice(0, 80)}`); }
}
function sysMsg(text) { addChat({ id: uid(), sys: true, text, ts: Date.now() }, true); }
function sendChat() {
  const inp = $("chatInput"), text = inp.value.trim();
  if (!text) return;
  const to = $("chatTo").value || null;
  const m = { t: "chat", id: uid(), text, ts: Date.now(), to };
  if (to) sendApp(to, m); else broadcast(m);
  addChat({ id: m.id, from: mySessionId, nom: myNom, text, ts: m.ts, to });
  inp.value = "";
}
function refreshChatTargets() {
  const sel = $("chatTo"), cur = sel.value;
  sel.innerHTML = `<option value="">${esc(T.A_TOUT_LE_MONDE)}</option>` + Object.entries(peers).map(([sid, p]) => `<option value="${esc(sid)}">${esc(fmt(T.EN_PRIVE_A, { nom: p.nom }))}</option>`).join("");
  if (cur && peers[cur]) sel.value = cur;
}
$("chatSend").addEventListener("click", sendChat);
$("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } });
$("emojiRow").innerHTML = EMOJIS.map((e) => `<button type="button">${e}</button>`).join("");
$("emojiRow").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") { const i = $("chatInput"); i.value += e.target.textContent; i.focus(); } });
$("chatFile").addEventListener("click", () => $("filePick").click());
$("filePick").addEventListener("change", async () => {
  const f = $("filePick").files[0]; $("filePick").value = "";
  if (!f) return;
  if (f.size > MAX_FILE) { toast(T.FICHIER_TROP_GROS, "error"); return; }
  const to = $("chatTo").value || null, id = uid();
  const buf = new Uint8Array(await f.arrayBuffer());
  const CH = 12000, n = Math.max(1, Math.ceil(buf.length / CH));
  const targets = to ? [to] : Object.keys(peers);
  for (let i = 0; i < n; i++) {
    const part = { t: "file", id, i, n, d: b64(buf.subarray(i * CH, (i + 1) * CH)), to };
    if (i === 0) Object.assign(part, { name: f.name.slice(0, 200), size: f.size, mime: f.type || "application/octet-stream", ts: Date.now() });
    for (const sid of targets) { const p = peers[sid]; if (p && p.dc && p.dc.readyState === "open") { while (p.dc.bufferedAmount > 1_000_000) await new Promise((r) => setTimeout(r, 40)); } sendApp(sid, part); }
  }
  addChat({ id, from: mySessionId, nom: myNom, ts: Date.now(), to, text: f.name, file: { name: f.name, size: f.size, url: URL.createObjectURL(f) } });
});
function receiveFile(sid, m) {
  let f = incomingFiles.get(m.id);
  if (!f) { if (m.i !== 0 || !(m.size <= MAX_FILE) || !(m.n > 0 && m.n < 2000)) return; f = { meta: m, parts: new Array(m.n), got: 0 }; incomingFiles.set(m.id, f); }
  if (f.parts[m.i] != null || typeof m.d !== "string") return;
  f.parts[m.i] = fromB64(m.d); f.got++;
  if (f.got < f.meta.n) return;
  incomingFiles.delete(m.id);
  const blob = new Blob(f.parts, { type: "application/octet-stream" });
  const p = peers[sid];
  addChat({ id: m.id, from: sid, nom: p ? p.nom : "?", ts: f.meta.ts || Date.now(), to: f.meta.to || null, text: f.meta.name, file: { name: String(f.meta.name || "fichier"), size: blob.size, url: URL.createObjectURL(blob) } });
}
function saveChat() {
  const lines = chat.map((m) => (m.sys ? `[${hhmm(m.ts)}] * ${m.text}` : `[${hhmm(m.ts)}] ${m.nom}${m.to ? " (" + T.PRIVE + ")" : ""} : ${m.file ? "[" + m.file.name + "]" : m.text}`));
  download(`viso-conversation-${stamp()}.txt`, new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" }));
}

// ── Sondages ──
function bumpPolls() { if (!sideShows("polls")) { unreadPolls++; updateDots(); } }
function renderPolls() {
  const pane = $("pane-polls");
  let html = `<button class="btn accent" id="newPoll" style="margin-bottom:10px;">${ic("square-poll-vertical")}${esc(T.NOUVEAU_SONDAGE)}</button>`;
  if (!polls.size) html += `<div class="empty-hint">${esc(T.AUCUN_SONDAGE)}</div>`;
  for (const p of [...polls.values()].reverse()) {
    const counts = p.opts.map(() => 0); let voters = 0;
    for (const v of p.votes.values()) { if (v.length) voters++; for (const i of v) counts[i]++; }
    const mine = p.votes.get(mySessionId) || [];
    html += `<div class="poll" data-id="${esc(p.id)}"><h4>${esc(p.q)}</h4>${p.opts.map((o, i) => `<button class="poll-opt${mine.includes(i) ? " mine" : ""}" data-opt="${i}" ${p.closed ? "disabled" : ""}><span class="bar" style="width:${voters ? Math.round((counts[i] / voters) * 100) : 0}%"></span><span>${esc(o)}</span><span>${counts[i]}</span></button>`).join("")}<small>${esc(fmt(T.SONDAGE_INFO, { nom: p.byNom, n: voters }))}${p.multi ? " · " + esc(T.CHOIX_MULTIPLES) : ""}${p.closed ? " · " + esc(T.SONDAGE_CLOS) : ""}</small>${!p.closed && (p.by === mySessionId || isHost) ? ` <button class="btn small" data-end="1">${esc(T.CLORE)}</button>` : ""}</div>`;
  }
  pane.innerHTML = html;
}
$("pane-polls").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "newPoll") return newPollDialog();

// ── Tableau blanc partagé ──
function openWhiteboard(announce) {
  if (wb.open) return;
  wb.open = true;
  const box = document.createElement("div"); box.className = "wb-box"; box.id = "wbBox";
  box.innerHTML = `<canvas width="1600" height="900"></canvas><div class="wb-tools">${WB_COLORS.map((c) => `<button class="sw" data-c="${c}" style="background:${c}"></button>`).join("")}<button data-w="3" title="${esc(T.TRAIT_FIN)}">${ic("pen", "sm")}</button><button data-w="9" title="${esc(T.TRAIT_EPAIS)}">${ic("pen", "")}</button><button data-c="#ffffff" data-w="28" title="${esc(T.GOMME)}">${ic("eraser")}</button><button data-a="undo" title="${esc(T.ANNULER_TRAIT)}">${ic("rotate-left")}</button><button data-a="clear" title="${esc(T.TOUT_EFFACER)}">${ic("trash-can")}</button><button data-a="save" title="${esc(T.TELECHARGER)}">${ic("download")}</button><button data-a="close" title="${esc(T.FERMER)}">${ic("xmark")}</button></div>`;
  $("mainStage").prepend(box);
  const cv = box.querySelector("canvas");
  let cur = null;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [Math.round(((e.clientX - r.left) / r.width) * 1e4) / 1e4, Math.round(((e.clientY - r.top) / r.height) * 1e4) / 1e4]; };
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); cur = { id: uid(), by: mySessionId, c: wb.color, w: wb.width, pts: [pos(e)] }; wb.strokes.push(cur); });
  cv.addEventListener("pointermove", (e) => { if (!cur) return; cur.pts.push(pos(e)); drawWb(); });
  const end = () => { if (!cur) return; if (cur.pts.length === 1) cur.pts.push(cur.pts[0]); broadcast({ t: "wb", op: "stroke", s: cur }); cur = null; drawWb(); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  box.querySelector(".wb-tools").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.c) wb.color = b.dataset.c;
    if (b.dataset.w) wb.width = +b.dataset.w;
    if (b.dataset.c && !b.dataset.w && wb.width > 20) wb.width = 3;
    if (b.dataset.a === "undo") { const last = [...wb.strokes].reverse().find((s) => s.by === mySessionId); if (last) { wb.strokes = wb.strokes.filter((s) => s !== last); broadcast({ t: "wb", op: "undo", id: last.id }); drawWb(); } }
    if (b.dataset.a === "clear") { wb.strokes = []; broadcast({ t: "wb", op: "clear" }); drawWb(); }
    if (b.dataset.a === "save") cv.toBlob((bl) => download(`viso-tableau-${stamp()}.png`, bl));
    if (b.dataset.a === "close") closeWhiteboard(true);
    box.querySelectorAll(".wb-tools button").forEach((x) => x.classList.toggle("on", (x.dataset.c === wb.color && !x.dataset.w) || (x.dataset.w && +x.dataset.w === wb.width && (!x.dataset.c || x.dataset.c === wb.color))));
  });

}
function closeWhiteboard(announce) {
  wb.open = false;

  if (announce) broadcast({ t: "wb", op: "open", on: false });

function drawWb() {
  const box = $("wbBox"); if (!box) return;
  const cv = box.querySelector("canvas"), g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
  g.lineCap = "round"; g.lineJoin = "round";

function updateRecPill() {

  if (recorder) names.unshift(myNom);

function toggleRecording() {
  if (recorder) { recorder.stop(); return; }
  if (!window.MediaRecorder) { toast(T.NON_DISPONIBLE, "error"); return; }
  const cv = document.createElement("canvas"); cv.width = 1280; cv.height = 720;
  const g = cv.getContext("2d");
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const dest = audioCtx.createMediaStreamDestination();
  const wired = new Set();
  const wire = () => { for (const v of document.querySelectorAll(".tile video")) { const s = v.srcObject; if (s && !wired.has(s.id) && s.getAudioTracks().length) { wired.add(s.id); try { audioCtx.createMediaStreamSource(s).connect(dest); } catch (e) {} } } };
  const draw = () => {
    g.fillStyle = "#111"; g.fillRect(0, 0, cv.width, cv.height);
    const main = $("stage").classList.contains("has-main") ? $("mainStage").firstElementChild : null;
    const tiles = [...document.querySelectorAll("#videoGrid .tile:not(.hidden-self)")];
    const cell = (el, x, y, w, h) => {
      g.fillStyle = "#222"; g.fillRect(x + 3, y + 3, w - 6, h - 6);
      const src = el.id === "wbBox" ? el.querySelector("canvas") : el.querySelector("video");
      const vw = src.videoWidth || src.width, vh = src.videoHeight || src.height;
      if (vw && vh && !(el.classList.contains("no-video"))) { const k = Math.min((w - 6) / vw, (h - 6) / vh), dw = vw * k, dh = vh * k; g.drawImage(src, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); }
      else { g.fillStyle = "#3e8e41"; g.beginPath(); g.arc(x + w / 2, y + h / 2, Math.min(w, h) / 5, 0, Math.PI * 2); g.fill(); g.fillStyle = "#fff"; g.font = `bold ${Math.round(Math.min(w, h) / 6)}px sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(el.querySelector(".tile-avatar") ? el.querySelector(".tile-avatar").textContent : "", x + w / 2, y + h / 2); }
      const name = el.querySelector(".name"); if (name) { g.font = "16px sans-serif"; g.textAlign = "left"; g.textBaseline = "alphabetic"; g.fillStyle = "rgba(0,0,0,.6)"; const tw = g.measureText(name.textContent).width; g.fillRect(x + 10, y + h - 34, tw + 14, 24); g.fillStyle = "#fff"; g.fillText(name.textContent, x + 17, y + h - 16); }
    };
    if (main) { cell(main, 0, 0, cv.width, tiles.length ? 560 : 720); const n = tiles.length, w = n ? Math.min(240, cv.width / n) : 0; tiles.forEach((t, i) => cell(t, (cv.width - w * n) / 2 + i * w, 560, w, 160)); }
    else { const n = Math.max(1, tiles.length), cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols), w = cv.width / cols, h = cv.height / rows; tiles.forEach((t, i) => cell(t, (i % cols) * w, Math.floor(i / cols) * h, w, h)); }
  };
  const timer = setInterval(() => { draw(); wire(); }, 66);
  draw(); wire();
  const stream = new MediaStream([...cv.captureStream(15).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m)) || "";
  const chunks = [];
  try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); } catch (e) { clearInterval(timer); toast(T.NON_DISPONIBLE, "error"); return; }
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => { clearInterval(timer); recorder = null; stream.getTracks().forEach((t) => t.stop()); updateRecPill(); broadcastState(); download(`viso-${(roomTitle || "reunion").replace(/[^\wÀ-ɏ-]+/g, "_")}-${stamp()}.webm`, new Blob(chunks, { type: "video/webm" })); toast(T.ENREGISTREMENT_TERMINE); };
  recorder.start(1000);
  updateRecPill(); broadcastState(); toast(T.ENREGISTREMENT_DEMARRE);
}

let pttHeld = false;
document.addEventListener("keydown", (e) => {
  if (!inCall) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.ctrlKey && e.shiftKey) {
    const k = e.key.toLowerCase();
    const map = { m: () => setMic(!micOn), o: () => setCam(!camOn), e: toggleShare, k: () => setHand(!handUp), c: () => toggleSide("chat"), p: () => toggleSide("people"), h: () => quitterAppel() };
    if (map[k]) { e.preventDefault(); map[k](); }
    return;
  }
  if (e.code === "Space" && !typing && !micOn && !pttHeld && !e.repeat && !hardMuted && hasTrack("audio")) { e.preventDefault(); pttHeld = true; setMic(true); }
  if (e.key === "Escape") closePop();
});
document.addEventListener("keyup", (e) => { if (e.code === "Space" && pttHeld) { pttHeld = false; setMic(false); } });

  hideGateError();
}
function showGateError(msg) { const el = $("gateError"); el.textContent = msg; el.style.display = "block"; }

// ENTRÉE / SORTIE DE RÉUNION

async function joinRoom(code, password, keepMedia, knownTitle) {
  try {
    await chargerIceServers();
    myKeyPair = await genKeyPair();
    myPubB64 = await exportPub(myKeyPair);
    mySessionId = genSessionId();
    if (!localStream) localStream = await acquireMedia();
    const res = await apiCall("rejoindre_salle", { room_code: code, session_id: mySessionId, x25519_pub: myPubB64, password: password || "" });
    if (!res.success) {
      if (breakout) { const b = breakout; breakout = null; toast(res.error || T.IMPOSSIBLE_REJOINDRE, "error"); return joinRoom(b.mainCode, b.mainPassword, true); }
      stopLocalStream(); showScreen("gate"); switchTab("join"); $("joinCode").value = code; showGateError(res.error || T.IMPOSSIBLE_REJOINDRE); return;
    }
    roomId = res.data.room_id; roomCode = code; roomPassword = password || ""; roomTitle = knownTitle || res.data.title || T.APPEL_VEX_DEFAULT;
    myNom = res.data.your_nom || T.VOUS_DEFAULT; myUserId = res.data.your_user_id ?? null;
    hostUserId = res.data.host_user_id ?? null; isHost = !!res.data.is_host; roomLobby = !!res.data.lobby; roomLocked = !!res.data.locked;
    if (res.data.waiting) {
      showScreen("waiting");
      clearInterval(waitTimer);
      waitTimer = setInterval(async () => {
        let r; try { r = await apiCall("etat_attente", { session_id: mySessionId }); } catch (e) { return; }
        if (!r.success) return;
        if (r.data.etat === "admitted") { clearInterval(waitTimer); enterCall(r.data.participants || []); }
        else if (r.data.etat === "refused") { clearInterval(waitTimer); stopLocalStream(); showScreen("gate"); showGateError(T.ENTREE_REFUSEE); }
      }, 2000);
      return;
    }
    enterCall(res.data.participants || []);
  } catch (e) {
    console.error(e);
    stopLocalStream(); showScreen("gate");
    showGateError(T.ACCES_CAMERA_MICRO_REFUSE);
  }
}

function enterCall(participants) {
  inCall = true; leaving = false; removedReason = ""; pollFails = 0; pollCount = 0;
  callStart = Date.now();
  $("callTitle").textContent = roomTitle;
  $("roomCodeText").textContent = roomCode;
  $("lockPill").style.display = roomLocked ? "inline-flex" : "none";
  showScreen("call");
  if (localStream) { localStream.getAudioTracks().forEach((t) => t.enabled = micOn); localStream.getVideoTracks().forEach((t) => t.enabled = camOn); }
  const tile = ensureTile("local", myNom, true);
  const video = tile.querySelector("video"); video.srcObject = localStream; video.play().catch(() => {});
  tile.classList.toggle("no-video", !(camOn && hasTrack("video")));
  attachMeter("local", localStream);
  refreshMediaButtons();
  noteAttendance(myNom, true);
  if (!localStream) toast(T.REJOINT_SANS_CAMERA_MICRO);
  for (const p of participants) { const e = getOrCreatePeer(p.session_id, p.x25519_pub, p.nom, p.user_id); e.newcomer = false; }
  setStatus(T.EN_COMMUNICATION, true);
  updateParticipantsCount(); updateEmptyHint(); renderPeople(); renderPolls(); refreshChatTargets(); renderBanners(); applyLayout();
  heartbeatTimer = setInterval(() => apiCall("heartbeat", { session_id: mySessionId }).catch(() => {}), HEARTBEAT_MS);
  pollTimer = setInterval(() => {
    pollSignaux();
    if (++pollCount % 3 === 0) rafraichirParticipants().catch(() => {});
    if (pollCount % 4 === 0) rafraichirAttente();
  }, POLL_MS);
  tickTimer = setInterval(() => {
    tickSpeakers();
    const s = Math.floor((Date.now() - callStart) / 1000);
    $("callTimer").textContent = (s >= 3600 ? String(Math.floor(s / 3600)).padStart(2, "0") + ":" : "") + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    if (breakout) { const left = Math.max(0, Math.round((breakout.until - Date.now()) / 1000)); const el = $("boLeft"); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; if (left <= 0) returnToMain(); }
    if (s % 5 === 0 && Date.now() % 1000 < 260) tickQuality();
  }, 250);
  window.addEventListener("beforeunload", quitterAppelSync);
}

function stopLocalStream() { if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; } detachMeter("local"); }

// Quitte la salle courante sans recharger la page (utilisé pour passer
// d'une salle de petit groupe à la réunion principale et inversement).
async function leaveCall(keepMedia) {
  inCall = false;
  clearInterval(heartbeatTimer); clearInterval(pollTimer); clearInterval(tickTimer); clearInterval(waitTimer);
  if (recorder) recorder.stop();
  if (screenShare) { screenShare.stream.getTracks().forEach((t) => t.stop()); screenShare = null; $("btnShare").classList.remove("active-toggle"); }
  if (captionsOn) { captionsOn = false; try { speech && speech.stop(); } catch (e) {} }
  for (const sid of Object.keys(peers)) { try { await sendSignal(sid, "bye", {}); } catch (e) {} try { peers[sid].pc.close(); } catch (e) {} delete peers[sid]; }
  try { await apiCall("quitter_salle", { session_id: mySessionId }); } catch (e) {}
  for (const k of [...meters.keys()]) if (k !== "local") detachMeter(k);
  $("videoGrid").innerHTML = ""; $("mainStage").innerHTML = ""; $("chatList").innerHTML = ""; $("captions").innerHTML = ""; $("captions").style.display = "none";
  chat.length = 0; polls.clear(); qas.clear(); cohosts.clear(); unreadQa = 0; $("qaList").innerHTML = ""; wb.strokes = []; wb.open = false; notes.text = ""; notes.ts = 0; $("notesArea").value = "";
  recRemote.clear(); updateRecPill(); waiting = []; pinned = null; spotlight = null; handUp = false; hardMuted = false; unreadChat = 0; unreadPolls = 0; updateDots();
  $("btnHand").classList.remove("active-toggle"); $("sidePanel").classList.remove("open");
  if (!keepMedia) stopLocalStream();
}
async function quitterAppel() {
  leaving = true;
  await leaveCall(false);
  window.location.href = "/viso";
}
function quitterAppelSync() { if (mySessionId) navigator.sendBeacon?.(API_BASE, new URLSearchParams({ action: "quitter_salle", session_id: mySessionId })); }

// Le serveur ne reconnaît plus la session : retiré par l'organisateur,
// réunion terminée, ou salle de petit groupe fermée.
async function onRemoved() {
  if (!inCall || leaving) return;
  if (breakout) { toast(T.GROUPES_FERMES); return returnToMain(); }
  const msg = removedReason || T.REUNION_TERMINEE_OU_RETIRE;
  leaving = true;
  inCall = false;
  clearInterval(heartbeatTimer); clearInterval(pollTimer); clearInterval(tickTimer);
  for (const sid of Object.keys(peers)) { try { peers[sid].pc.close(); } catch (e) {} delete peers[sid]; }
  if (recorder) recorder.stop();
  stopLocalStream();
  modal(T.REUNION, `<p>${esc(msg)}</p>`, [{ label: T.RETOUR_ACCUEIL, primary: true, run: () => { window.location.href = "/viso"; } }]);
}
