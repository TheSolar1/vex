<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VEX Cloud Sync</title>
<style>
  :root {
    --bg:#0f1115; --surface:#171a21; --surface2:#1e222b; --border:#2a2f3a;
    --text:#e7e9ee; --text-m:#9aa2b1; --accent:#4caf50; --accent-d:#2e7d32; --danger:#e5484d;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; justify-content:center; padding:40px 16px;
  }
  .carte { width:100%; max-width:460px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:28px 26px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .entete { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .logo { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent-d));
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:#fff; flex-shrink:0; }
  .titre { font-size:17px; font-weight:700; }
  .sous-titre { font-size:12px; color:var(--text-m); margin-top:2px; }
  label { display:block; font-size:12px; color:var(--text-m); margin:14px 0 6px; font-weight:600; }
  input[type=password] {
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    background:var(--surface2); color:var(--text); font-size:13.5px; font-family:inherit;
  }
  input:focus { outline:none; border-color:var(--accent); }
  .aide { font-size:11.5px; color:var(--text-m); margin-top:8px; line-height:1.6; }
  button { font-family:inherit; cursor:pointer; border:none; border-radius:8px; font-size:14.5px; font-weight:600; }
  .btn-principal { width:100%; margin-top:20px; padding:12px; background:var(--accent); color:#fff; }
  .btn-principal:hover { background:var(--accent-d); }
  .btn-principal:disabled { opacity:.5; cursor:not-allowed; }
  .msg { margin-top:14px; font-size:13px; padding:10px 12px; border-radius:8px; display:none; }
  .msg.erreur { background:rgba(229,72,77,.12); color:#ff8b8e; display:block; }
  .msg.ok { background:rgba(76,175,80,.12); color:#8fe08f; display:block; }
  .journal { margin-top:16px; display:none; }
  .ligne-jrn { font-size:12.5px; color:var(--text-m); padding:6px 0; border-bottom:1px solid var(--border); }
  .ligne-jrn:last-child { border-bottom:none; color:var(--text); }
  .spin { display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
    border-radius:50%; animation:tourne .7s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes tourne { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="carte">
  <div class="entete">
    <div class="logo">V</div>
    <div>
      <div class="titre">VEX Cloud Sync</div>
      <div class="sous-titre">Synchronise tes fichiers VEX avec un dossier Windows</div>
    </div>
  </div>

  <div id="zone-mdp">
    <label for="mdp">Mot de passe VEX</label>
    <input type="password" id="mdp" autofocus>
    <div class="aide">Sert uniquement à chiffrer/déchiffrer tes fichiers en local — n'est jamais envoyé au serveur.</div>
    <button class="btn-principal" id="btn-connecter">Connecter</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="journal" id="journal"></div>
</div>

<script>
const zoneMdp = document.getElementById('zone-mdp');
const journal = document.getElementById('journal');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn-connecter');

btn.addEventListener('click', async () => {
  const mdp = document.getElementById('mdp').value;
  if (!mdp) { msg.className = 'msg erreur'; msg.textContent = 'Mot de passe requis.'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Connexion...';
  await fetch('/api/password', { method: 'POST', body: mdp });
  zoneMdp.style.display = 'none';
  journal.style.display = 'block';
  pollStatut();
});

let dernierNb = 0;
async function pollStatut() {
  try {
    const r = await fetch('/api/statut');
    const d = await r.json();
    if (d.lignes.length !== dernierNb) {
      journal.innerHTML = d.lignes.map(l => `<div class="ligne-jrn">${l.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('');
      dernierNb = d.lignes.length;
    }
    if (d.erreur) {
      journal.insertAdjacentHTML('beforeend', `<div class="msg erreur" style="display:block;margin-top:10px">${d.erreur}</div>`);
      return;
    }
    if (d.termine) {
      journal.insertAdjacentHTML('beforeend', `<div class="msg ok" style="display:block;margin-top:10px">Connecté ! Le dossier <strong>${d.dossier||''}</strong> est maintenant synchronisé — tu peux fermer cette page.</div>`);
      return;
    }
  } catch (e) {}
  setTimeout(pollStatut, 1000);
}
</script>
</body>
</html>
