[package]
name = "vex-sync-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vex-sync-client"
path = "src/main.rs"

[dependencies]
# Memes versions que le serveur VEX (src/srp.rs) -- compatibilite bit-a-bit garantie.
num-bigint = "0.4"
num-traits = "0.2"
sha2       = "0.10"
getrandom  = { version = "0.2", features = ["std"] }

# Chiffrement fichiers (AES-256-GCM + HKDF), port de static/crypto.js
aes-gcm = "0.10"
hkdf    = "0.12"
rand    = "0.8"

# HTTP + JSON
ureq       = { version = "2", features = ["json", "tls"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
base64     = "0.22"

# Icone dans la barre des taches (Windows)
tray-item = "0.10"

# Surveillance du dossier local
notify = "6"

# Stockage local de config (dossier synchronise, etc.)
directories = "5"

# Petit serveur HTTP local (page de configuration stylee, remplace les
# prompts console) -- meme crate que le serveur VEX principal.
tiny_http = "0.12"

# Selecteur de dossier natif Windows (bouton "Parcourir..." dans la page
# de configuration, plutot que de taper un chemin a la main).
rfd = "0.14"
